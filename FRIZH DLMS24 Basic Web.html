        document.getElementById(`t-out${i + 1}`).innerHTML = `
          <div class="dashboard-header">
            <div class="dashboard-title">${dspState.out_n[i]} <span style="cursor:pointer; opacity:0.6; font-size:14px;" onclick="renameChannel('out', ${i})" title="Rename Channel">✏️</span></div>
            <div class="dashboard-actions">
              <div style="display:flex; align-items:center; gap:5px; background:#111; padding:2px 6px; border-radius:4px; border:1px solid #333;">
                <span style="font-size:9px; color:#888;">COPY FROM:</span>
                <select id="copy_src_out_${i}" style="background:transparent; color:#fff; border:none; outline:none; font-size:10px;">${copyOpts}</select>
                <button class="btn btn-small" onclick="copyChannel('out', ${i})">GO</button>
              </div>
              <button class="btn btn-primary" onclick="revertTab('out', ${i})">RESET CH</button>
              <button class="btn btn-danger ${dspState.out_mute[i] ? 'active' : ''}" id="btn-mute-out-${i}" onclick="toggleMute('out',${i})">${dspState.out_mute[i] ? 'MUTED' : 'MUTE'}</button>
            </div>
          </div>
          <div class="channel-strip">
            <div class="strip-col">
              <div class="widget">
                ${getWidgetHead('ROUTING, PHASE (0-180°) & DELAY', `revertBlock(${i}, 'rt')`)}
                <div class="widget-body">
                  ${createSelect('INPUT SOURCE', 'rt', i, '', ['OFF', 'IN A', 'IN B', 'MIX A+B'], dspState.rt[i])}
                  <button id="btn-ph-${i}" class="btn" style="${phBtnStyle}" onclick="togglePolarity(${i})">${dspState.ph[i] === 1 ? 'POLARITY: INV (-)' : 'POLARITY: NORM (+)'}</button>
                  ${createFader('PHASE SHIFT (0-180°)', 'phd', i, 'v', 0, 180, dspState.phd[i] || 0, '°', '', '5')}
                  ${createFader('ALIGNMENT DELAY', 'dl', i, '', 0, 200, dspState.dl[i], 'ms', '', '0.1')}
                </div>
              </div>
              <div class="widget">
                ${getWidgetHead('CROSSOVER & GAIN', `revertBlock(${i}, 'xo')`)}
                <div class="widget-body">
                  ${createFader('OUTPUT GAIN', 'xo', i, 'g', -12, 6, dspState.xo_gn[i], 'dB')}
                  ${createSelect('HPF SLOPE', 'xo', i, 't', ['OFF', 'BW12', 'BW24', 'BW48', 'LR12', 'LR24', 'LR48'], dspState.xt[i])}
                  ${createFader('HPF FREQ', 'xo', i, 'fl', 20, 20000, dspState.xfl[i], 'Hz', '', '10')}
                  <div style="border-top:1px solid #333; margin:2px 0;"></div>
                  ${createSelect('LPF SLOPE', 'xo', i, 'th', ['OFF', 'BW12', 'BW24', 'BW48', 'LR12', 'LR24', 'LR48'], dspState.xth[i])}
                  ${createFader('LPF FREQ', 'xo', i, 'fh', 20, 20000, dspState.xfh[i], 'Hz', '', '10')}
                </div>
              </div>
              <div class="widget">
                ${getWidgetHead('COMPRESSOR / LIMITER', `revertBlock(${i}, 'comp')`)}
                <div class="widget-body">
                  <div class="comp-layout">
                    <div class="graph-container" style="flex:1;"><canvas id="cvs-comp-out-${i}"></canvas></div>
                    <div class="gr-meter-box">
                      <span style="font-size:8px; font-weight:bold; color:#888;">GR</span>
                      <div class="gr-track"><div id="gr-fill-out-${i}" class="gr-fill"></div></div>
                    </div>
                  </div>
                  ${createFader('THRESH', 'comp', i, 'thr', -40, 1, dspState.ct[i], 'dB')}
                  <div class="ctrl-row">
                    ${createFader('RATIO', 'comp', i, 'rat', 1, 21, dspState.cr[i], ':1')}
                    ${createFader('MAKEUP', 'comp', i, 'mak', 0, 20, dspState.cm[i], 'dB')}
                  </div>
                  <div class="ctrl-row">
                    ${createFader('ATTACK', 'comp', i, 'atk', 1, 100, dspState.ca[i], 'ms')}
                    ${createFader('RELEASE', 'comp', i, 'rel', 10, 1000, dspState.crel[i], 'ms', '', '10')}
                  </div>
                </div>
              </div>
            </div>

            <div class="strip-col">
              <div class="widget ${dspState.eqb[i] === 1 ? 'bypassed' : ''}" id="wid-eq-${i}">
                <div class="widget-header">
                  <span>7-BAND PEQ, CROSSOVER & 4-CH COMPARE OVERLAY</span>
                  <div class="widget-actions">
                    <button class="btn btn-icon btn-danger" onclick="revertBlock(${i}, 'eq')">RST</button>
                    <button class="btn btn-small ${dspState.eqb[i] === 1 ? 'btn-danger' : ''}" id="btn-byp-eq-${i}" onclick="toggleBypass('eq',${i})">${dspState.eqb[i] === 1 ? 'EQ BYPASSED' : 'EQ ACTIVE'}</button>
                    <button class="btn btn-icon" onclick="toggleWidget(this)">_</button>
                  </div>
                </div>
                <div class="widget-body">
                  <div class="preset-bar">
                    <span style="font-size:9px; color:#999; font-weight:700; margin-right:4px;">COMPARE XOVER OVERLAY:</span>
                    ${xoCompareBtns}
                  </div>
                  <div class="graph-container graph-large"><canvas id="cvs-${i}"></canvas></div>
                  <div class="ctrl-row" style="overflow-x:auto;">${eqHtml}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      // 4. SYSTEM TAB
      document.getElementById('t-sys').innerHTML = `
        <div class="dashboard-header"><div class="dashboard-title">SYSTEM CONFIGURATION</div></div>
        <div class="channel-strip">
          <div class="strip-col">
            <div class="widget">
              ${getWidgetHead('PRESET MANAGEMENT', null)}
              <div class="widget-body">
                <select id="sys-preset-slot" class="pro-sel">
                  ${[1, 2, 3, 4, 5, 6, 7, 8].map(s => `<option value="${s}">SLOT ${s}${s === 6 ? ' (2-WAY FACTORY)' : (s === 7 ? ' (3-WAY FACTORY)' : (s === 8 ? ' (4-WAY FACTORY)' : ' (USER)'))}</option>`).join('')}
                </select>
                <div class="ctrl-row">
                  <button class="btn btn-primary" style="flex:1;" onclick="doPreset('load')">LOAD</button>
                  <button class="btn btn-danger" style="flex:1;" onclick="doPreset('save')">SAVE</button>
                  <button class="btn" style="flex:1;" onclick="doPreset('rename')">RENAME</button>
                </div>
                <div style="border-top:1px solid #333; margin:4px 0;"></div>
                <div class="ctrl-row">
                  <button class="btn btn-primary" style="flex:1;" onclick="exportPreset()">EXPORT FILE</button>
                  <button class="btn btn-primary" style="flex:1;" onclick="document.getElementById('import-file').click()">IMPORT FILE</button>
                  <input type="file" id="import-file" style="display:none" accept=".json" onchange="importPreset(event)">
                </div>
              </div>
            </div>
            <div class="widget">
              ${getWidgetHead('BASIC FIRMWARE UPDATE (OTA)', null)}
              <div class="widget-body">
                <input type="text" id="ota-ssid" class="pro-in" placeholder="WiFi SSID" style="margin-bottom:6px;">
                <input type="password" id="ota-pass" class="pro-in" placeholder="WiFi Password" style="margin-bottom:6px;">
                <div class="ctrl-row">
                  <select id="ota-version" class="pro-sel" style="flex:2;"><option>Click Fetch...</option></select>
                  <button class="btn btn-primary" onclick="fetchGithubReleases()" style="flex:1;">FETCH</button>
                </div>
                <button class="btn btn-danger" style="margin-top:6px;" onclick="triggerOTA()">START UPDATE</button>
              </div>
            </div>
          </div>
          <div class="strip-col">
            <div class="widget">
              ${getWidgetHead('TONE GENERATOR', null)}
              <div class="widget-body">
                <div class="ctrl-row">
                  <div class="ctrl-col">
                    ${createSelect('MODE', 'tone', 0, 'm', ['OFF', 'PINK NOISE', 'SINE WAVE'], dspState.tm)}
                    ${createSelect('ROUTE', 'tone', 0, 'r', ['ALL IN', 'IN A', 'IN B', 'OUT 1', 'OUT 2', 'OUT 3', 'OUT 4'], dspState.tr)}
                  </div>
                  <div class="ctrl-col">
                    ${createFader('FREQ', 'tone', 0, 'f', 20, 20000, dspState.tf, 'Hz', '', '10')}
                    ${createFader('GAIN', 'tone', 0, 'g', -60, 0, dspState.tg, 'dB')}
                  </div>
                </div>
              </div>
            </div>
            <div class="widget">
              ${getWidgetHead('GLOBAL RESET', null)}
              <div class="widget-body">
                <button class="btn btn-danger" style="padding:15px; font-size:12px;" onclick="doFactoryReset()">FACTORY RESET ALL CHANNELS</button>
              </div>
            </div>
          </div>
        </div>
      `;

      setTimeout(() => { dirtyGraphs = true; }, 40);
    }
  </script>
</body>
</html>
