    async function runFrizhMultiWayWizard() {
      if (wizardMeasurement.length === 0) return alert("Please load a 20Hz-20kHz reference file first!");
      if (!wizardSelectedOuts.includes(true)) return alert("Select at least one Output channel (OUT 1..4)!");
      if (isWizardRunning) return;

      isWizardRunning = true;
      wizardStatusText = "Analyzing 20Hz-20kHz acoustic reference...";
      buildUI();

      try {
        let globalRefDb = getWizardGlobalRefLevel();
        let N = (wizardTapMode === 1) ? 512 : 256;
        let halfN = N >> 1;

        let estDelayMs = [0, 0, 0, 0], maxGroupDelay = 0;
        for (let ch = 0; ch < 4; ch++) {
          if (!wizardSelectedOuts[ch]) continue;
          let fLow = dspState.xt[ch] > 0 ? dspState.xfl[ch] : 25;
          let fHigh = dspState.xth[ch] > 0 ? dspState.xfh[ch] : 18500;
          if (fHigh <= fLow + 20) fHigh = Math.min(20000, fLow * 4);
          let gdSum = 0, gdCount = 0, fStep = (fHigh - fLow) / 12.0;
          for (let s = 1; s < 11; s++) {
            let fa = fLow + s * fStep, fb = fa + fStep * 0.5;
            let ma = interpolateMeas(wizardMeasurement, fa), mb = interpolateMeas(wizardMeasurement, fb);
            if (ma.c > 0.5 && mb.c > 0.5) {
              let dp = mb.p - ma.p;
              if (dp > 180) dp -= 360;
              if (dp < -180) dp += 360;
              let tauMs = (-dp / 360.0) / (fb - fa) * 1000.0;
              if (Math.abs(tauMs) < 35.0) { gdSum += tauMs; gdCount++; }
            }
          }
          estDelayMs[ch] = gdCount > 0 ? Math.max(0, Math.min(25, gdSum / gdCount)) : 0;
          if (estDelayMs[ch] > maxGroupDelay) maxGroupDelay = estDelayMs[ch];
        }

        for (let ch = 0; ch < 4; ch++) {
          if (!wizardSelectedOuts[ch]) continue;
          let fLow = dspState.xt[ch] > 0 ? Math.max(20, Math.min(16000, dspState.xfl[ch])) : 25;
          let fHigh = dspState.xth[ch] > 0 ? Math.max(fLow + 30, Math.min(20000, dspState.xfh[ch])) : 19000;

          loadedMeasurements[ch] = [...wizardMeasurement];
          loadedFileNames[ch] = wizardFileName;
          firMinFreq[ch] = fLow; firMaxFreq[ch] = fHigh;
          firMaxBoost[ch] = wizardMaxBoost; firMaxCut[ch] = wizardMaxCut;
          firCorrectPhase[ch] = wizardInversePhase;

          if (wizardTuneGain) {
            let bSum = 0, tSum = 0, wSum = 0;
            for (let pt of wizardMeasurement) {
              if (pt.f >= fLow && pt.f <= fHigh) {
                bSum += (pt.m - globalRefDb) * pt.c;
                tSum += getWizardTargetGainAt(pt.f) * pt.c;
                wSum += pt.c;
              }
            }
            if (wSum > 0) {
              let recGain = Math.max(-12, Math.min(6, Math.round((tSum / wSum) - (bSum / wSum))));
              dspState.xo_gn[ch] = recGain;
              sendBLE(`/api/set?type=xo&ch=${ch}&p=g&v=${recGain}`);
            }
          }

          if (wizardTuneDelay) {
            let alignDl = parseFloat(Math.max(0, Math.min(50, maxGroupDelay - estDelayMs[ch])).toFixed(1));
            dspState.dl[ch] = alignDl;
            sendBLE(`/api/set?type=dl&ch=${ch}&p=v&v=${alignDl}`);
          }

          if (wizardTunePhase) {
            let xoRefF = dspState.xt[ch] > 0 ? fLow : (dspState.xth[ch] > 0 ? fHigh : Math.sqrt(fLow * fHigh));
            let rawPhase = interpolateMeas(wizardMeasurement, xoRefF).p;
            while (rawPhase < 0) rawPhase += 360;
            while (rawPhase >= 360) rawPhase -= 360;
            let invPol = false, neededRot = 360 - rawPhase;
            if (neededRot >= 180) { invPol = true; neededRot -= 180; }
            let degStep = Math.max(0, Math.min(180, Math.round(neededRot / 5) * 5));
            dspState.ph[ch] = invPol ? 1 : 0;
            dspState.apfe[ch] = degStep > 0 ? 1 : 0;
            dspState.apfm[ch] = 1;
            dspState.apfd[ch] = degStep;
            sendBLE(`/api/set?type=ph&ch=${ch}&p=v&v=${dspState.ph[ch]}`);
            sendBLE(`/api/set?type=apf&ch=${ch}&p=e&v=${dspState.apfe[ch]}`);
            sendBLE(`/api/set?type=apf&ch=${ch}&p=m&v=1`);
            sendBLE(`/api/set?type=apf&ch=${ch}&p=d&v=${degStep}`);
          }

          if (wizardTuneEq) {
            await fit7BandEqForChannel(ch, wizardMeasurement, globalRefDb, fLow, fHigh, wizardMaxBoost, wizardMaxCut, true);
          }

          if (wizardTuneFir) {
            dspState.firt[ch] = wizardTapMode;
            sendBLE(`/api/set?type=fir&ch=${ch}&p=t&v=${wizardTapMode}`);
            let chOutGain = dspState.xo_gn[ch];
            let rawCorr = new Array(257).fill(0);
            for (let k = 1; k <= halfN; k++) {
              let f = (k * 48000.0) / N;
              if (f < fLow || f > fHigh) continue;
              let m = interpolateMeas(wizardMeasurement, f);
              let measRel = (m.m - globalRefDb) + chOutGain;
              let peqDb = 0;
              if (dspState.eqb[ch] === 0) {
                for (let b = 0; b < 7; b++) {
                  peqDb += evalEqBandDb(dspState.eqt[ch][b] || 0, f, dspState.eqf[ch][b], dspState.eqq[ch][b], dspState.eq_gn[ch][b]);
                }
              }
              let targetDb = getWizardTargetGainAt(f);
              let corrDb = Math.max(wizardMaxCut, Math.min(wizardMaxBoost, (targetDb - (measRel + peqDb)) * m.c * m.c));
              if (f < fLow * 1.2) corrDb *= Math.max(0, Math.min(1, (f - fLow) / (fLow * 0.2)));
              else if (f > fHigh * 0.85) corrDb *= Math.max(0, Math.min(1, (fHigh - f) / (fHigh * 0.15)));
              rawCorr[k] = corrDb;
            }
            previewFirMagDb[ch] = new Array(257).fill(0);
            for (let k = 1; k <= halfN; k++) {
              previewFirMagDb[ch][k] = 0.25 * rawCorr[Math.max(0, k - 1)] + 0.5 * rawCorr[k] + 0.25 * rawCorr[Math.min(halfN, k + 1)];
            }
            let magLin = new Array(halfN + 1).fill(1.0);
            let phaseRad = new Array(halfN + 1).fill(0.0);
            for (let k = 1; k <= halfN; k++) {
              let f = (k * 48000.0) / N;
              magLin[k] = Math.pow(10.0, previewFirMagDb[ch][k] / 20.0);
              if (wizardInversePhase && f >= fLow && f <= maxGroupDelay + fHigh) {
                let m = interpolateMeas(wizardMeasurement, f);
                phaseRad[k] = -(m.p * Math.PI / 180.0) * m.c;
              }
            }
            let taps = new Array(N).fill(0);
            let center = (N - 1) / 2.0;
            for (let n = 0; n < N; n++) {
              let m = n - center, sum = magLin[0];
              for (let k = 1; k < halfN; k++) sum += 2.0 * magLin[k] * Math.cos((2.0 * Math.PI * k * m / N) + phaseRad[k]);
              sum += magLin[halfN] * Math.cos(Math.PI * m);
              let wNorm = (2.0 * Math.PI * n) / (N - 1);
              let win = 0.35875 - 0.48829 * Math.cos(wNorm) + 0.14128 * Math.cos(2.0 * wNorm) - 0.01168 * Math.cos(3.0 * wNorm);
              taps[n] = (sum / N) * win;
            }
            let ok = await uploadTapsToEsp32(ch, taps, N);
            if (ok) activeInjectedFirDb[ch] = [...previewFirMagDb[ch]];
          }
        }
        wizardStatusText = "FRIZH FIR Auto-Tune Complete!";
        alert("FRIZH FIR Auto-Tune applied to selected outputs!");
      } catch (err) {
        wizardStatusText = "Error: " + err;
      }
      isWizardRunning = false;
      buildUI();
      setTimeout(() => drawFrizhWizardGraph(), 30);
    }

    /* --- CANVAS GRAPH PAINTERS --- */
    function drawFreqGrid(ctx, w, h, zeroY) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 0.6;
      [20,30,40,50,60,70,80,90,100,200,300,400,500,600,700,800,900,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000,20000].forEach(f => {
        let x = ((Math.log10(f) - logMin) / (logMax - logMin)) * w;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      });
      if (zeroY !== null) {
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(w, zeroY); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '9px sans-serif';
      [20, 100, 1000, 10000, 20000].forEach(f => {
        let x = ((Math.log10(f) - logMin) / (logMax - logMin)) * w;
        let lbl = f >= 1000 ? (f / 1000) + 'k' : f.toString();
        let tx = f === 20 ? 3 : (f === 20000 ? x - ctx.measureText(lbl).width - 3 : x - ctx.measureText(lbl).width / 2);
        ctx.fillText(lbl, tx, h - 4);
      });
    }

    function getOutXoverDbAt(ch, f) {
      let totalGain = dspState.xo_gn[ch] || 0;
      let xoT = dspState.xt[ch] || 0, xoTh = dspState.xth[ch] || 0;
      let fLow = dspState.xfl[ch] || 80, fHigh = dspState.xfh[ch] || 5000;
      if (xoT > 0) {
        let ordL = (xoT === 1 || xoT === 4) ? 2 : (xoT === 2 || xoT === 5) ? 4 : 8;
        totalGain -= 10 * Math.log10(1 + Math.pow(fLow / f, 2 * ordL));
      }
      if (xoTh > 0) {
        let ordH = (xoTh === 1 || xoTh === 4) ? 2 : (xoTh === 2 || xoTh === 5) ? 4 : 8;
        totalGain -= 10 * Math.log10(1 + Math.pow(f / fHigh, 2 * ordH));
      }
      return totalGain;
    }

    // 1. GLOBAL OUT PREVIEW (Pure Crossover Slope + Post-Xover Output RTA with 4 Channel Toggle Buttons)
    function drawGlobalOutPreview(tabCh) {
      let cvs = document.getElementById(`cvs-glob-xo-${tabCh}`);
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;
      let zeroY = h * (15 / 45);
      drawFreqGrid(ctx, w, h, zeroY);
      let colors = ['#00ADB5', '#ff9800', '#e040fb', '#69f0ae'];
      let logMin = Math.log10(20), logMax = Math.log10(20000);

      for (let c = 0; c < 4; c++) {
        if (!outXoverVis[tabCh][c]) continue;
        let col = colors[c];
        let rt = dspState.rt[c] || 0;
        let baseRta = rt === 1 ? rtaA : (rt === 2 ? rtaB : (rt === 3 ? rtaA.map((v, i) => Math.max(v, rtaB[i])) : new Array(31).fill(-60)));

        // Shaded Output Channel RTA
        let rtaPath = new Path2D(), rtaFill = new Path2D();
        for (let b = 0; b < 31; b++) {
          let x = (b / 30.0) * w;
          let f = 20.0 * Math.pow(1000.0, b / 30.0);
          let rawDb = baseRta[b];
          let db = rawDb <= -59 ? -60 : Math.max(-60, Math.min(0, rawDb + getOutXoverDbAt(c, f)));
          let y = h - ((db + 60) / 60) * h;
          if (b === 0) { rtaPath.moveTo(x, y); rtaFill.moveTo(x, h); rtaFill.lineTo(x, y); }
          else { rtaPath.lineTo(x, y); rtaFill.lineTo(x, y); }
          if (b === 30) rtaFill.lineTo(x, h);
        }
        ctx.fillStyle = col; ctx.globalAlpha = 0.18; ctx.fill(rtaFill);
        ctx.strokeStyle = col; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.2; ctx.stroke(rtaPath);

        // Smooth Crossover Slope Curve
        let xoCurve = new Path2D();
        for (let x = 0; x <= w; x += 2) {
          let f = Math.pow(10, logMin + (x / w) * (logMax - logMin));
          let y = Math.max(-10, Math.min(h + 10, zeroY - getOutXoverDbAt(c, f) * (h / 45)));
          if (x === 0) xoCurve.moveTo(x, y); else xoCurve.lineTo(x, y);
        }
        ctx.strokeStyle = col; ctx.globalAlpha = 1.0; ctx.lineWidth = 2.2; ctx.stroke(xoCurve);
      }
    }

    // 2. UNIFIED 6-CHANNEL RTA GRAPH
    function drawUnified6ChRTA() {
      let cvs = document.getElementById('cvs-rta-6ch');
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      let drawH = h - 18;
      ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 0.6;
      let labelIndices = [0, 6, 12, 18, 24, 30], labels = ["20", "350", "1k", "2.6k", "7k", "20k"];
      ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.font = '10px sans-serif';
      labelIndices.forEach((idx, i) => {
        let x = (idx / 30.0) * w;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, drawH); ctx.stroke();
        let tx = i === 0 ? 4 : (i === 5 ? w - ctx.measureText(labels[i]).width - 4 : x - ctx.measureText(labels[i]).width / 2);
        ctx.fillText(labels[i], tx, h - 4);
      });
      [-15, -30, -45].forEach(dbm => {
        let y = drawH - ((dbm + 60) / 60) * drawH;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        ctx.fillText(dbm + 'dB', 4, y - 3);
      });

      const rtaColors = ['#00ADB5', '#ffd740', '#69f0ae', '#ff6e40', '#e040fb', '#40c4ff'];
      for (let idx = 0; idx < 6; idx++) {
        if (!rtaVis[idx]) continue;
        let col = rtaColors[idx];
        let path = new Path2D(), fill = new Path2D();
        for (let b = 0; b < 31; b++) {
          let x = (b / 30.0) * w;
          let f = 20.0 * Math.pow(1000.0, b / 30.0);
          let db = -60;
          if (idx === 0) db = dspState.in_mute[0] ? -60 : rtaA[b];
          else if (idx === 1) db = dspState.in_mute[1] ? -60 : rtaB[b];
          else {
            let outCh = idx - 2, rt = dspState.rt[outCh] || 0;
            if (!dspState.out_mute[outCh] && rt > 0) {
              let rawIn = rt === 1 ? rtaA[b] : (rt === 2 ? rtaB[b] : Math.max(rtaA[b], rtaB[b]));
              if (rawIn > -59) {
                let dspDb = getOutXoverDbAt(outCh, f) + getInjectedFirGainAt(outCh, f);
                if (dspState.eqb[outCh] === 0) {
                  for (let eb = 0; eb < 7; eb++) dspDb += evalEqBandDb(dspState.eqt[outCh][eb] || 0, f, dspState.eqf[outCh][eb], dspState.eqq[outCh][eb], dspState.eq_gn[outCh][eb]);
                }
                db = Math.max(-60, Math.min(0, rawIn + dspDb));
              }
            }
          }
          let y = drawH - ((db + 60) / 60) * drawH;
          if (b === 0) { path.moveTo(x, y); fill.moveTo(x, drawH); fill.lineTo(x, y); }
          else { path.lineTo(x, y); fill.lineTo(x, y); }
          if (b === 30) fill.lineTo(x, drawH);
        }
        ctx.fillStyle = col; ctx.globalAlpha = 0.2; ctx.fill(fill);
        ctx.strokeStyle = col; ctx.globalAlpha = 1.0; ctx.lineWidth = 2.0; ctx.stroke(path);
      }
    }

    // 3. UNIFIED 7-BAND INPUT & OUTPUT EQ GRAPH (With PK / LS / HS Shelf Support & Lock Button)
    function drawEqGraph(ch, isInput) {
      let cvs = document.getElementById(`cvs-eq-${isInput ? 'in' : 'out'}-${ch}`);
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;
      let zeroY = h * (15 / 45);
      drawFreqGrid(ctx, w, h, zeroY);

      let fArr = isInput ? dspState.ieqf[ch] : dspState.eqf[ch];
      let gArr = isInput ? dspState.ieqg[ch] : dspState.eq_gn[ch];
      let qArr = isInput ? dspState.ieqq[ch] : dspState.eqq[ch];
      let tArr = isInput ? dspState.ieqt[ch] : dspState.eqt[ch];
      let byp = isInput ? (dspState.ieqb[ch] === 1) : (dspState.eqb[ch] === 1);
      let actBand = isInput ? activeEqBandIn[ch] : activeEqBandOut[ch];
      let color = isInput ? (ch === 0 ? '#00ADB5' : '#ff9800') : ['#00ADB5', '#ff9800', '#e040fb', '#69f0ae'][ch];
      let logMin = Math.log10(20), logMax = Math.log10(20000);

      let getGainAt = (f) => {
        let tot = isInput ? 0 : getOutXoverDbAt(ch, f);
        if (!byp) {
          for (let b = 0; b < 7; b++) tot += evalEqBandDb(tArr[b] || 0, f, fArr[b], qArr[b], gArr[b]);
        }
        if (!isInput) tot += getInjectedFirGainAt(ch, f);
        return tot;
      };

      // Background RTA
      let rData = isInput ? (ch === 0 ? rtaA : rtaB) : (dspState.rt[ch] === 1 ? rtaA : (dspState.rt[ch] === 2 ? rtaB : rtaA.map((v, i) => Math.max(v, rtaB[i]))));
      let rPath = new Path2D();
      for (let b = 0; b < 31; b++) {
        let x = (b / 30.0) * w, f = 20.0 * Math.pow(1000.0, b / 30.0);
        let db = rData[b] <= -59 ? -60 : Math.max(-60, Math.min(0, rData[b] + (isInput ? 0 : getGainAt(f))));
        let y = h - ((db + 60) / 60) * h;
        if (b === 0) { rPath.moveTo(x, h); rPath.lineTo(x, y); } else rPath.lineTo(x, y);
        if (b === 30) rPath.lineTo(x, h);
      }
      ctx.fillStyle = color; ctx.globalAlpha = 0.28; ctx.fill(rPath);

      // EQ Curve
      let cPath = new Path2D(), fPath = new Path2D();
      for (let x = 0; x <= w; x += 2) {
        let f = Math.pow(10, logMin + (x / w) * (logMax - logMin));
        let y = Math.max(-20, Math.min(h + 20, zeroY - getGainAt(f) * (h / 45)));
        if (x === 0) { cPath.moveTo(x, y); fPath.moveTo(x, zeroY); fPath.lineTo(x, y); }
        else { cPath.lineTo(x, y); fPath.lineTo(x, y); }
        if (x >= w - 2) fPath.lineTo(x, zeroY);
      }
      ctx.fillStyle = color; ctx.globalAlpha = 0.15; ctx.fill(fPath);
      ctx.strokeStyle = color; ctx.globalAlpha = 1.0; ctx.lineWidth = 2.4; ctx.stroke(cPath);

      // 7 Band Handles
      for (let b = 0; b < 7; b++) {
        let cx = ((Math.log10(fArr[b]) - logMin) / (logMax - logMin)) * w;
        let cy = zeroY - gArr[b] * (h / 45);
        let isAct = (b === actBand);
        ctx.strokeStyle = isAct ? color : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(cx, zeroY); ctx.lineTo(cx, cy); ctx.stroke();
        ctx.fillStyle = isAct ? color : 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = isAct ? color : '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((b + 1).toString(), cx, cy);
      }
      ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      attachEqDrag(cvs, ch, isInput);
    }

    function attachEqDrag(cvs, ch, isInput) {
      if (cvs.dataset.dragBound) return;
      cvs.dataset.dragBound = '1';
      let dragging = false;
      let getPos = (e) => {
        let r = cvs.getBoundingClientRect();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: cx - r.left, y: cy - r.top, w: r.width, h: r.height };
      };
      let onDown = (e) => {
        if (isInput ? lockInEq[ch] : lockOutEq[ch]) return;
        let pos = getPos(e), logMin = Math.log10(20), logMax = Math.log10(20000), zeroY = pos.h * (15 / 45);
        let fArr = isInput ? dspState.ieqf[ch] : dspState.eqf[ch];
        let gArr = isInput ? dspState.ieqg[ch] : dspState.eq_gn[ch];
        let best = 0, minD = 9999;
        for (let b = 0; b < 7; b++) {
          let bx = ((Math.log10(fArr[b]) - logMin) / (logMax - logMin)) * pos.w;
          let by = zeroY - gArr[b] * (pos.h / 45);
          let d = Math.hypot(pos.x - bx, pos.y - by);
          if (d < minD) { minD = d; best = b; }
        }
        if (isInput) activeEqBandIn[ch] = best; else activeEqBandOut[ch] = best;
        dragging = true;
        onMove(e);
      };
      let onMove = (e) => {
        if (!dragging || (isInput ? lockInEq[ch] : lockOutEq[ch])) return;
        if (e.cancelable) e.preventDefault();
        let pos = getPos(e), logMin = Math.log10(20), logMax = Math.log10(20000), zeroY = pos.h * (15 / 45);
        let b = isInput ? activeEqBandIn[ch] : activeEqBandOut[ch];
        let newF = Math.max(20, Math.min(20000, Math.round(Math.pow(10, logMin + Math.max(0, Math.min(1, pos.x / pos.w)) * (logMax - logMin)))));
        let newG = Math.max(-12, Math.min(12, Math.round((zeroY - pos.y) / (pos.h / 45))));
        if (isInput) {
          dspState.ieqf[ch][b] = newF; dspState.ieqg[ch][b] = newG;
          sendUpdate('ineq', ch, 'f', newF, b); sendUpdate('ineq', ch, 'g', newG, b);
        } else {
          dspState.eqf[ch][b] = newF; dspState.eq_gn[ch][b] = newG;
          sendUpdate('eq', ch, 'f', newF, b); sendUpdate('eq', ch, 'g', newG, b);
        }
        drawEqGraph(ch, isInput);
      };
      let onUp = () => { if (dragging) { dragging = false; buildUI(); setTimeout(() => drawEqGraph(ch, isInput), 20); } };
      cvs.addEventListener('mousedown', onDown); cvs.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
      cvs.addEventListener('touchstart', onDown, {passive:false}); cvs.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onUp);
    }

    // 4. AUTO-FIR DESIGNER PREVIEW GRAPH
    function drawFirPreviewGraph(ch) {
      let cvs = document.getElementById(`cvs-fir-${ch}`);
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;
      let zeroY = h * 0.5;
      drawFreqGrid(ctx, w, h, zeroY);
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      let dbToY = (db) => Math.max(6, Math.min(h - 14, zeroY - db * (h / 48.0)));

      if (firUiTab[ch] === 1) {
        let path = new Path2D(), fill = new Path2D();
        for (let x = 0; x <= w; x += 2) {
          let f = Math.pow(10, logMin + (x / w) * (logMax - logMin));
          let tot = getOutXoverDbAt(ch, f) - (dspState.xo_gn[ch] || 0);
          if (dspState.eqb[ch] === 0) {
            for (let b = 0; b < 7; b++) tot += evalEqBandDb(dspState.eqt[ch][b] || 0, f, dspState.eqf[ch][b], dspState.eqq[ch][b], dspState.eq_gn[ch][b]);
          }
          let y = dbToY(tot);
          if (x === 0) { path.moveTo(x, y); fill.moveTo(x, zeroY); fill.lineTo(x, y); }
          else { path.lineTo(x, y); fill.lineTo(x, y); }
          if (x >= w - 2) fill.lineTo(x, zeroY);
        }
        ctx.fillStyle = '#00ADB5'; ctx.globalAlpha = 0.2; ctx.fill(fill);
        ctx.strokeStyle = '#00ADB5'; ctx.globalAlpha = 1.0; ctx.lineWidth = 2.2; ctx.stroke(path);
        return;
      }

      let xMin = ((Math.log10(firMinFreq[ch]) - logMin) / (logMax - logMin)) * w;
      let xMax = ((Math.log10(firMaxFreq[ch]) - logMin) / (logMax - logMin)) * w;
      ctx.fillStyle = 'rgba(0,173,181,0.08)'; ctx.fillRect(xMin, 0, xMax - xMin, h);
      if (!loadedMeasurements[ch] || loadedMeasurements[ch].length === 0) return;

      let taps = getChannelTaps(ch), halfN = taps >> 1, avgDb = getPassbandAverageDb(ch);
      let mPath = new Path2D(), fPath = new Path2D(), pPath = new Path2D();
      for (let x = 0; x <= w; x += 2) {
        let f = Math.pow(10, logMin + (x / w) * (logMax - logMin));
        let relM = interpolateMeas(loadedMeasurements[ch], f).m - avgDb;
        let bf = Math.max(0, Math.min(halfN, (f * taps) / 48000.0));
        let b0 = Math.floor(bf), b1 = Math.min(halfN, Math.ceil(bf));
        let firDb = previewFirMagDb[ch][b0] + (bf - b0) * (previewFirMagDb[ch][b1] - previewFirMagDb[ch][b0]);
        let ym = dbToY(relM), yf = dbToY(firDb), yp = dbToY(relM + firDb);
        if (x === 0) { mPath.moveTo(x, ym); fPath.moveTo(x, yf); pPath.moveTo(x, yp); }
        else { mPath.lineTo(x, ym); fPath.lineTo(x, yf); pPath.lineTo(x, yp); }
      }
      ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 1.4; ctx.stroke(mPath);
      ctx.strokeStyle = '#00ADB5'; ctx.lineWidth = 2.0; ctx.stroke(fPath);
      ctx.strokeStyle = '#69f0ae'; ctx.lineWidth = 1.6; ctx.stroke(pPath);
    }

    // 5. FRIZH FIR 7-NODE DRAWABLE TARGET CURVE GRAPH
    function drawFrizhWizardGraph() {
      let cvs = document.getElementById('cvs-frizh-wiz');
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;
      let zeroY = h * 0.5;
      drawFreqGrid(ctx, w, h, zeroY);
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      let dbToY = (db) => Math.max(8, Math.min(h - 16, zeroY - db * (h / 36.0)));

      if (wizardMeasurement.length > 0) {
        let refDb = getWizardGlobalRefLevel();
        let mPath = new Path2D(), pPath = new Path2D();
        for (let x = 0; x <= w; x += 2) {
          let f = Math.pow(10, logMin + (x / w) * (logMax - logMin));
          let m = interpolateMeas(wizardMeasurement, f);
          let relM = m.m - refDb;
          let tDb = getWizardTargetGainAt(f);
          let corr = Math.max(wizardMaxCut, Math.min(wizardMaxBoost, (tDb - relM) * m.c));
          let ym = dbToY(relM), yp = dbToY(relM + corr);
          if (x === 0) { mPath.moveTo(x, ym); pPath.moveTo(x, yp); }
          else { mPath.lineTo(x, ym); pPath.lineTo(x, yp); }
        }
        ctx.strokeStyle = 'rgba(255,82,82,0.75)'; ctx.lineWidth = 1.5; ctx.stroke(mPath);
        ctx.strokeStyle = 'rgba(105,240,174,0.88)'; ctx.lineWidth = 1.8; ctx.stroke(pPath);
      }

      let tPath = new Path2D();
      for (let x = 0; x <= w; x += 2) {
        let f = Math.pow(10, logMin + (x / w) * (logMax - logMin));
        let y = dbToY(getWizardTargetGainAt(f));
        if (x === 0) tPath.moveTo(x, y); else tPath.lineTo(x, y);
      }
      ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 2.5; ctx.stroke(tPath);

      for (let i = 0; i < 7; i++) {
        let nx = ((Math.log10(wizardTargetFreqs[i]) - logMin) / (logMax - logMin)) * w;
        let ny = dbToY(wizardTargetGains[i]);
        let sel = (i === wizardSelectedNode);
        ctx.fillStyle = sel ? '#ffd740' : 'rgba(255,255,255,0.4)';
        ctx.beginPath(); ctx.arc(nx, ny, sel ? 8 : 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(nx, ny, sel ? 5 : 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd740'; ctx.beginPath(); ctx.arc(nx, ny, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      attachWizardCurveDrag(cvs);
    }

    function attachWizardCurveDrag(cvs) {
      if (cvs.dataset.wizBound) return;
      cvs.dataset.wizBound = '1';
      let dragging = false;
      let getPos = (e) => {
        let r = cvs.getBoundingClientRect();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: cx - r.left, y: cy - r.top, w: r.width, h: r.height };
      };
      let onDown = (e) => {
        if (lockWizCurve) return;
        let pos = getPos(e), logMin = Math.log10(20), logMax = Math.log10(20000);
        let best = 0, minD = 9999;
        for (let i = 0; i < 7; i++) {
          let nx = ((Math.log10(wizardTargetFreqs[i]) - logMin) / (logMax - logMin)) * pos.w;
          let ny = pos.h * 0.5 - wizardTargetGains[i] * (pos.h / 36.0);
          let d = Math.hypot(pos.x - nx, pos.y - ny);
          if (d < minD) { minD = d; best = i; }
        }
        wizardSelectedNode = best;
        dragging = true;
        onMove(e);
      };
      let onMove = (e) => {
        if (!dragging || lockWizCurve) return;
        if (e.cancelable) e.preventDefault();
        let pos = getPos(e);
        let newDb = Math.max(-12, Math.min(12, parseFloat(((pos.h * 0.5 - pos.y) / (pos.h / 36.0)).toFixed(1))));
        wizardTargetGains[wizardSelectedNode] = newDb;
        wizardActivePreset = 7;
        drawFrizhWizardGraph();
      };
      let onUp = () => { if (dragging) { dragging = false; buildUI(); setTimeout(() => drawFrizhWizardGraph(), 20); } };
      cvs.addEventListener('mousedown', onDown); cvs.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
      cvs.addEventListener('touchstart', onDown, {passive:false}); cvs.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onUp);
    }
    // 6. DYNAMIC EQ & COMPRESSOR GRAPH PAINTERS
    function drawDeqGraph(ch) {
      let cvs = document.getElementById(`cvs-deq-${ch}`);
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;
      let zeroY = h * 0.5;
      drawFreqGrid(ctx, w, h, zeroY);
      let isByp = dspState.deq_e[ch] === 0;
      let color = ch === 0 ? '#00ADB5' : '#ff9800';
      let logMin = Math.log10(20), logMax = Math.log10(20000);

      let rData = ch === 0 ? rtaA : rtaB;
      let rPath = new Path2D();
      for (let b = 0; b < 31; b++) {
        let x = (b / 30.0) * w, db = Math.max(-60, Math.min(0, rData[b]));
        let y = h - ((db + 60) / 60) * h;
        if (b === 0) { rPath.moveTo(x, h); rPath.lineTo(x, y); } else rPath.lineTo(x, y);
        if (b === 30) rPath.lineTo(x, h);
      }
      ctx.fillStyle = color; ctx.globalAlpha = 0.25; ctx.fill(rPath);

      let liveP = livePeaks[ch], liveDb = liveP > 0.0001 ? (20 * Math.log10(liveP) - 3.0) : -60;
      let boundG = [0, 0, 0], dynG = [0, 0, 0];
      for (let b = 0; b < 3; b++) {
        let t = dspState.deq_t[ch][b], r = dspState.deq_r[ch][b], d = dspState.deq_d[ch][b];
        boundG[b] = d;
        if (liveDb > t && r > 1.0 && d !== 0) {
          let chg = (liveDb - t) * (1.0 - 1.0 / r);
          dynG[b] = d < 0 ? Math.max(-chg, d) : Math.min(chg, d);
        }
      }

      let bPath = new Path2D(), dPath = new Path2D(), fPath = new Path2D();
      for (let x = 0; x <= w; x += 2) {
        let f = Math.pow(10, logMin + (x / w) * (logMax - logMin)), tb = 0, td = 0;
        if (!isByp) {
          for (let b = 0; b < 3; b++) {
            let bell = Math.exp(-Math.pow(Math.log10(f / dspState.deq_f[ch][b]) * dspState.deq_q[ch][b] * 2.8, 2));
            tb += boundG[b] * bell; td += dynG[b] * bell;
          }
        }
        let yb = zeroY - tb * (h / 48), yd = zeroY - td * (h / 48);
        if (x === 0) { bPath.moveTo(x, yb); dPath.moveTo(x, yd); fPath.moveTo(x, zeroY); fPath.lineTo(x, yd); }
        else { bPath.lineTo(x, yb); dPath.lineTo(x, yd); fPath.lineTo(x, yd); }
        if (x >= w - 2) fPath.lineTo(x, zeroY);
      }
      ctx.fillStyle = color; ctx.globalAlpha = 0.35; ctx.fill(fPath);
      ctx.strokeStyle = color; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.5; ctx.stroke(bPath);
      ctx.globalAlpha = 1.0; ctx.lineWidth = 2.0; ctx.stroke(dPath);

      for (let b = 0; b < 3; b++) {
        let cx = ((Math.log10(dspState.deq_f[ch][b]) - logMin) / (logMax - logMin)) * w;
        let cy = zeroY - dspState.deq_d[ch][b] * (h / 48);
        let isAct = (b === activeDeqBand[ch]);
        ctx.strokeStyle = isAct ? color : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(cx, zeroY); ctx.lineTo(cx, cy); ctx.stroke();
        ctx.fillStyle = isAct ? color : 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = isAct ? color : '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText((b + 1).toString(), cx, cy);
      }
      ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      attachDeqDrag(cvs, ch);
    }

    function attachDeqDrag(cvs, ch) {
      if (cvs.dataset.deqBound) return;
      cvs.dataset.deqBound = '1';
      let dragging = false;
      let getPos = (e) => {
        let r = cvs.getBoundingClientRect();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: cx - r.left, y: cy - r.top, w: r.width, h: r.height };
      };
      let onDown = (e) => {
        if (lockDeq[ch]) return;
        let pos = getPos(e), logMin = Math.log10(20), logMax = Math.log10(20000), zeroY = pos.h * 0.5;
        let best = 0, minD = 9999;
        for (let b = 0; b < 3; b++) {
          let bx = ((Math.log10(dspState.deq_f[ch][b]) - logMin) / (logMax - logMin)) * pos.w;
          let by = zeroY - dspState.deq_d[ch][b] * (pos.h / 48);
          let d = Math.hypot(pos.x - bx, pos.y - by);
          if (d < minD) { minD = d; best = b; }
        }
        activeDeqBand[ch] = best;
        dragging = true;
        onMove(e);
      };
      let onMove = (e) => {
        if (!dragging || lockDeq[ch]) return;
        if (e.cancelable) e.preventDefault();
        let pos = getPos(e), logMin = Math.log10(20), logMax = Math.log10(20000);
        let b = activeDeqBand[ch];
        let newF = Math.max(20, Math.min(20000, Math.round(Math.pow(10, logMin + Math.max(0, Math.min(1, pos.x / pos.w)) * (logMax - logMin)))));
        let newD = Math.max(-24, Math.min(15, Math.round((pos.h * 0.5 - pos.y) / (pos.h / 48))));
        dspState.deq_f[ch][b] = newF; dspState.deq_d[ch][b] = newD;
        sendUpdate('deq', ch, 'f', newF, b); sendUpdate('deq', ch, 'd', newD, b);
        drawDeqGraph(ch);
      };
      let onUp = () => { if (dragging) { dragging = false; buildUI(); setTimeout(() => drawDeqGraph(ch), 20); } };
      cvs.addEventListener('mousedown', onDown); cvs.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
      cvs.addEventListener('touchstart', onDown, {passive:false}); cvs.addEventListener('touchmove', onMove, {passive:false}); window.addEventListener('touchend', onUp);
    }

    function updateCompCanvas(ch, isInput) {
      let cvs = document.getElementById(`cvs-comp-${isInput ? 'in' : 'out'}-${ch}`);
      let grFill = document.getElementById(`gr-fill-${isInput ? 'in' : 'out'}-${ch}`);
      let grTxt = document.getElementById(`gr-txt-${isInput ? 'in' : 'out'}-${ch}`);
      if (!cvs || !grFill) return;
      let ctxData = getDpiCtx(cvs); if (!ctxData) return;
      let { ctx, w, h } = ctxData;

      let thr = isInput ? dspState.ict[ch] : dspState.ct[ch];
      let r = isInput ? dspState.icr[ch] : dspState.cr[ch];
      let rat = r >= 21 ? 1000.0 : r;
      let mak = isInput ? dspState.icm[ch] : dspState.cm[ch];
      let isOff = thr >= 1;
      let pLin = isInput ? livePeaks[ch] : livePeaks[ch + 2];
      let peakDb = pLin > 0.0001 ? Math.max(-60, Math.min(0, 20 * Math.log10(pLin) - 3.0)) : -60;
      let simGr = calcSimGr(isInput, ch);

      grFill.style.height = ((simGr / 20.0) * 100) + '%';
      if (grTxt) grTxt.innerText = simGr > 0.1 ? ('-' + simGr.toFixed(1)) : '0.0';

      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      let minDb = -60, maxDb = 10, range = maxDb - minDb;
      let dbToX = db => ((db - minDb) / range) * w;
      let dbToY = db => h - (((db - minDb) / range) * h);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(dbToX(0), 0); ctx.lineTo(dbToX(0), h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, dbToY(0)); ctx.lineTo(w, dbToY(0)); ctx.stroke();
      ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(dbToX(minDb), dbToY(minDb)); ctx.lineTo(dbToX(maxDb), dbToY(maxDb)); ctx.stroke();
      if (isOff) return;

      ctx.strokeStyle = isInput ? '#00ADB5' : '#ff9800'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(dbToX(minDb), dbToY(minDb + mak));
      ctx.lineTo(dbToX(thr), dbToY(thr + mak));
      ctx.lineTo(dbToX(maxDb), dbToY(thr + (maxDb - thr) / rat + mak));
      ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dbToX(thr), dbToY(thr + mak), 4, 0, Math.PI * 2); ctx.fill();
      if (peakDb > minDb + 1.0) {
        let inDb = (peakDb - mak > thr) ? thr + (peakDb - mak - thr) * rat : peakDb - mak;
        ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.arc(dbToX(inDb), dbToY(peakDb), 4, 0, Math.PI * 2); ctx.fill();
      }
    }

    /* --- SLIDER & PARAMETER HELPERS --- */
    function sendUpdate(type, ch, param, val, band = '') {
      clearTimeout(timers[type + ch + param + band]);
      timers[type + ch + param + band] = setTimeout(() => {
        sendBLE(`/api/set?type=${type}&ch=${ch}&p=${param}&v=${val}${band !== '' ? '&b=' + band : ''}`);
      }, 40);
    }

    function promptFreq(id, min, max) {
      let val = prompt(`Enter frequency (${min} - ${max} Hz):`);
      if (val !== null && val.trim() !== '') {
        val = parseFloat(val);
        if (!isNaN(val)) {
          val = Math.max(min, Math.min(max, val));
          let el = document.getElementById(id);
          if (el) {
            el.value = ((Math.log10(val) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
            handleSliderInput(el);
          }
        }
      }
    }

    function stepSlider(id, dir) {
      let el = document.getElementById(id); if (!el) return;
      let p = el.getAttribute('data-p');
      let isFreq = (p === 'f' || p === 'fl' || p === 'fh' || p === 'minF' || p === 'maxF');
      if (isFreq) {
        let min = parseFloat(el.getAttribute('data-min')), max = parseFloat(el.getAttribute('data-max'));
        let curF = Math.round(Math.pow(10, Math.log10(min) + (parseFloat(el.value) / 1000) * (Math.log10(max) - Math.log10(min))));
        let nextF = Math.max(min, Math.min(max, curF + dir));
        el.value = ((Math.log10(nextF) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
      } else {
        let st = parseFloat(el.getAttribute('step')) || 1;
        el.value = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), parseFloat(el.value) + dir * st));
      }
      handleSliderInput(el);
    }

    function formatSliderDisplay(type, p, val, unit, step) {
      if (type === 'dl' || type === 'idl') return `${val.toFixed(1)} ms (${(val * 0.343).toFixed(2)} m)`;
      if ((type === 'comp' || type === 'incomp') && p === 'thr' && val >= 1) return 'OFF';
      if ((type === 'comp' || type === 'incomp') && p === 'rat' && val >= 21) return 'LIMIT';
      if (type === 'afs' && p === 's') return val === 1 ? 'STRICT' : (val === 5 ? 'AGGRESSIVE' : val.toString());
      if (type === 'apf' && p === 'd') return `${Math.round(val / 5) * 5}°`;
      if (unit === 'Hz') return `${Math.round(val)} Hz`;
      let dec = (step === '0.1' || step === '0.5') ? 1 : 0;
      let sign = (unit === 'dB' && val > 0 && p !== 'thr' && p !== 't') ? '+' : '';
      return `${sign}${val.toFixed(dec)} ${unit}`;
    }

    function handleSliderInput(el) {
      let type = el.getAttribute('data-type'), ch = parseInt(el.getAttribute('data-ch'));
      let p = el.getAttribute('data-p'), b = el.getAttribute('data-b');
      let unit = el.getAttribute('data-unit'), step = el.getAttribute('step');
      let isFreq = (p === 'f' || p === 'fl' || p === 'fh' || p === 'minF' || p === 'maxF');

      let realVal = parseFloat(el.value);
      if (isFreq) {
        let min = parseFloat(el.getAttribute('data-min')), max = parseFloat(el.getAttribute('data-max'));
        realVal = Math.round(Math.pow(10, Math.log10(min) + (realVal / 1000) * (Math.log10(max) - Math.log10(min))));
      }
      el.closest('.fader-box').querySelector('.fader-val').innerText = formatSliderDisplay(type, p, realVal, unit, step);

      if (type === 'firdes') {
        if (p === 'minF') firMinFreq[ch] = Math.min(realVal, firMaxFreq[ch] - 20);
        if (p === 'maxF') firMaxFreq[ch] = Math.max(realVal, firMinFreq[ch] + 20);
        if (p === 'boost') firMaxBoost[ch] = realVal;
        if (p === 'cut') firMaxCut[ch] = realVal;
        computeFirPreview(ch); drawFirPreviewGraph(ch); return;
      }
      if (type === 'wiz') {
        if (p === 'node') { wizardTargetGains[wizardSelectedNode] = realVal; wizardActivePreset = 7; drawFrizhWizardGraph(); }
        if (p === 'boost') { wizardMaxBoost = realVal; drawFrizhWizardGraph(); }
        if (p === 'cut') { wizardMaxCut = realVal; drawFrizhWizardGraph(); }
        return;
      }

      if (type === 'in') { if (ch === 0) dspState.vA = realVal; else dspState.vB = realVal; }
      else if (type === 'idl') dspState.idl[ch] = realVal;
      else if (type === 'dl') dspState.dl[ch] = realVal;
      else if (type === 'gate') { if (p === 'thr') dspState.gth[ch] = realVal; if (p === 'atk') dspState.gat[ch] = realVal; if (p === 'rel') dspState.gre[ch] = realVal; }
      else if (type === 'bbe') dspState['bbe_' + p][ch] = realVal;
      else if (type === 'afs') dspState['afs_' + p][ch] = realVal;
      else if (type === 'xo') { if (p === 'fl') dspState.xfl[ch] = realVal; if (p === 'fh') dspState.xfh[ch] = realVal; if (p === 'g') dspState.xo_gn[ch] = realVal; drawGlobalOutPreview(ch); }
      else if (type === 'eq') { if (p === 'f') dspState.eqf[ch][b] = realVal; if (p === 'g') dspState.eq_gn[ch][b] = realVal; if (p === 'q') dspState.eqq[ch][b] = realVal; drawEqGraph(ch, false); }
      else if (type === 'ineq') { if (p === 'f') dspState.ieqf[ch][b] = realVal; if (p === 'g') dspState.ieqg[ch][b] = realVal; if (p === 'q') dspState.ieqq[ch][b] = realVal; drawEqGraph(ch, true); }
      else if (type === 'deq') { if (p === 'f') dspState.deq_f[ch][b] = realVal; if (p === 'd') dspState.deq_d[ch][b] = realVal; if (p === 'q') dspState.deq_q[ch][b] = realVal; if (p === 't') dspState.deq_t[ch][b] = realVal; if (p === 'r') dspState.deq_r[ch][b] = realVal; drawDeqGraph(ch); }
      else if (type === 'apf') { if (p === 'f') dspState.apff[ch] = realVal; if (p === 'q') dspState.apfq[ch] = realVal; if (p === 'd') dspState.apfd[ch] = Math.round(realVal / 5) * 5; }
      else if (type === 'comp') { if (p === 'thr') dspState.ct[ch] = realVal; if (p === 'rat') dspState.cr[ch] = realVal; if (p === 'mak') dspState.cm[ch] = realVal; if (p === 'atk') dspState.ca[ch] = realVal; if (p === 'rel') dspState.crel[ch] = realVal; updateCompCanvas(ch, false); }
      else if (type === 'incomp') { if (p === 'thr') dspState.ict[ch] = realVal; if (p === 'rat') dspState.icr[ch] = realVal; if (p === 'mak') dspState.icm[ch] = realVal; if (p === 'atk') dspState.ica[ch] = realVal; if (p === 'rel') dspState.icrel[ch] = realVal; updateCompCanvas(ch, true); }
      else if (type === 'tone') { if (p === 'f') dspState.tf = realVal; if (p === 'g') dspState.tg = realVal; }

      sendUpdate(type, ch, p, realVal, b);
    }

    function createFader(label, type, ch, param, min, max, val, unit, band = '', step = '1') {
      let id = `${type}_${param}_${ch}${band !== '' ? '_' + band : ''}`;
      let isFreq = (param === 'f' || param === 'fl' || param === 'fh' || param === 'minF' || param === 'maxF');
      let disp = formatSliderDisplay(type, param, parseFloat(val), unit, step);
      let hVal = val, hMin = min, hMax = max, hStep = step, clickAct = '';
      if (isFreq) {
        hMin = 0; hMax = 1000; hStep = 1;
        hVal = ((Math.log10(Math.max(min, val)) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
        clickAct = `onclick="promptFreq('${id}', ${min}, ${max})"`;
      }
      return `
        <div class="fader-box">
          <div class="fader-top">
            <span class="fader-label">${label}</span>
            <span class="fader-val" ${clickAct}>${disp}</span>
          </div>
          <div class="fader-track-row">
            <button class="fine-btn" onclick="stepSlider('${id}', -1)">−</button>
            <input type="range" id="${id}" data-type="${type}" data-ch="${ch}" data-p="${param}" data-b="${band}" data-min="${min}" data-max="${max}" data-unit="${unit}" min="${hMin}" max="${hMax}" step="${hStep}" value="${hVal}" oninput="handleSliderInput(this)">
            <button class="fine-btn" onclick="stepSlider('${id}', 1)">+</button>
          </div>
        </div>`;
    }

    function handleSelect(el) {
      let type = el.getAttribute('data-type'), ch = parseInt(el.getAttribute('data-ch')), p = el.getAttribute('data-p'), val = parseInt(el.value);
      if (type === 'xo') { if (p === 't') dspState.xt[ch] = val; if (p === 'th') dspState.xth[ch] = val; drawGlobalOutPreview(ch); }
      else if (type === 'rt') dspState.rt[ch] = val;
      else if (type === 'tone') { if (p === 'm') dspState.tm = val; if (p === 'r') dspState.tr = val; buildUI(); }
      sendUpdate(type, ch, p, val);
    }

    function createSelect(label, type, ch, param, options, val) {
      let opts = options.map((o, i) => `<option value="${i}" ${i == val ? 'selected' : ''}>${o}</option>`).join('');
      return `<div style="display:flex; justify-content:space-between; align-items:center; background:#121317; padding:6px 8px; border:1px solid #2b2d36; border-radius:5px; flex:1;">
                <span style="font-size:10px; color:var(--text-muted); font-weight:700;">${label}</span>
                <select class="pro-sel" data-type="${type}" data-ch="${ch}" data-p="${param}" onchange="handleSelect(this)">${opts}</select>
              </div>`;
    }

    /* --- CHANNEL ACTIONS & RESETS --- */
    function toggleMute(type, ch) {
      if (type === 'in') dspState.in_mute[ch] = !dspState.in_mute[ch];
      else dspState.out_mute[ch] = !dspState.out_mute[ch];
      sendBLE(`/api/mute?type=${type}&ch=${ch}`);
      buildUI();
      setTimeout(() => redrawActiveTabCanvases(), 20);
    }

    function togglePolarity(ch) {
      dspState.ph[ch] = dspState.ph[ch] === 1 ? 0 : 1;
      sendUpdate('ph', ch, 'v', dspState.ph[ch]);
      buildUI();
      setTimeout(() => redrawActiveTabCanvases(), 20);
    }

    function renameChannel(type, ch) {
      let cur = type === 'in' ? dspState.in_n[ch] : dspState.out_n[ch];
      let n = prompt(`Rename ${cur} (Max 8 chars):`, cur);
      if (n !== null && n.trim() !== '') {
        n = n.substring(0, 8).toUpperCase().replace(/[^A-Z0-9 ]/g, '');
        sendBLE(`/api/name?type=${type}&ch=${ch}&n=${n.replace(/ /g, '_')}`);
        if (type === 'in') dspState.in_n[ch] = n; else dspState.out_n[ch] = n;
        buildUI();
      }
    }

    function copyChannelPrompt(type, ch) {
      if (type === 'in') {
        let src = ch === 0 ? 1 : 0;
        if (confirm(`Copy all settings from ${dspState.in_n[src]} to ${dspState.in_n[ch]}?`)) {
          sendBLE(`/api/copy?type=in&src=${src}&dst=${ch}`);
          setTimeout(() => sendBLE('/api/dump'), 500);
        }
      } else {
        let src = prompt(`Copy to ${dspState.out_n[ch]} from Output # (enter 1, 2, 3, or 4):`);
        let sIdx = parseInt(src) - 1;
        if (!isNaN(sIdx) && sIdx >= 0 && sIdx < 4 && sIdx !== ch) {
          sendBLE(`/api/copy?type=out&src=${sIdx}&dst=${ch}`);
          setTimeout(() => sendBLE('/api/dump'), 500);
        }
      }
    }

    function resetAllOutputCh(ch) {
      if (!confirm(`Reset all DSP settings for ${dspState.out_n[ch]}?`)) return;
      dspState.xt[ch] = 0; dspState.xth[ch] = 0; dspState.xfl[ch] = 80; dspState.xfh[ch] = 5000; dspState.xo_gn[ch] = 0;
      sendBLE(`/api/set?type=xo&ch=${ch}&p=t&v=0`); sendBLE(`/api/set?type=xo&ch=${ch}&p=th&v=0`);
      sendBLE(`/api/set?type=xo&ch=${ch}&p=fl&v=80`); sendBLE(`/api/set?type=xo&ch=${ch}&p=fh&v=5000`); sendBLE(`/api/set?type=xo&ch=${ch}&p=g&v=0`);
      let defF = [60, 150, 400, 1000, 2400, 6000, 12000];
      dspState.eqb[ch] = 0; sendBLE(`/api/set?type=eqb&ch=${ch}&p=v&v=0`);
      for (let b = 0; b < 7; b++) {
        dspState.eqf[ch][b] = defF[b]; dspState.eq_gn[ch][b] = 0; dspState.eqq[ch][b] = 1.41; dspState.eqt[ch][b] = 0;
        sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=f&v=${defF[b]}`); sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=g&v=0`);
        sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=q&v=1.41`); sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=t&v=0`);
      }
      resetFirChannel(ch);
      dspState.apfe[ch] = 0; dspState.apfm[ch] = 0; dspState.apff[ch] = 1000; dspState.apfq[ch] = 0.7; dspState.apfd[ch] = 0;
      sendBLE(`/api/set?type=apf&ch=${ch}&p=e&v=0`); sendBLE(`/api/set?type=apf&ch=${ch}&p=m&v=0`); sendBLE(`/api/set?type=apf&ch=${ch}&p=d&v=0`);
      dspState.ct[ch] = 0; dspState.cr[ch] = 4; dspState.cm[ch] = 0; dspState.ca[ch] = 10; dspState.crel[ch] = 100;
      sendBLE(`/api/set?type=comp&ch=${ch}&p=thr&v=0`); sendBLE(`/api/set?type=comp&ch=${ch}&p=rat&v=4`); sendBLE(`/api/set?type=comp&ch=${ch}&p=mak&v=0`);
      dspState.dl[ch] = 0; sendBLE(`/api/set?type=dl&ch=${ch}&p=v&v=0`);
      buildUI(); setTimeout(() => redrawActiveTabCanvases(), 30);
    }

    function resetFirChannel(ch) {
      loadedMeasurements[ch] = []; loadedFileNames[ch] = "No file loaded";
      previewFirMagDb[ch] = new Array(257).fill(0); activeInjectedFirDb[ch] = new Array(257).fill(0);
      activeCustomFirTaps[ch] = []; firUiTab[ch] = 0;
      dspState.firm[ch] = 0; dspState.firt[ch] = 0;
      sendBLE(`/api/set?type=fir&ch=${ch}&p=m&v=0`);
      sendBLE(`/api/set?type=fir&ch=${ch}&p=t&v=0`);
      buildUI(); setTimeout(() => redrawActiveTabCanvases(), 20);
    }

    function selectFirTab(ch, tab) {
      firUiTab[ch] = tab;
      if (tab === 0 || tab === 1) {
        dspState.firm[ch] = tab;
        sendBLE(`/api/set?type=fir&ch=${ch}&p=m&v=${tab}`);
      } else if (tab === 2) {
        if (loadedMeasurements[ch].length > 0 || activeInjectedFirDb[ch].some(v => v !== 0)) {
          dspState.firm[ch] = 2;
          sendBLE(`/api/set?type=fir&ch=${ch}&p=m&v=2`);
        }
      }
      buildUI(); setTimeout(() => drawFirPreviewGraph(ch), 20);
    }

    function setChannelTapMode(ch, tapMode) {
      dspState.firt[ch] = tapMode;
      sendBLE(`/api/set?type=fir&ch=${ch}&p=t&v=${tapMode}`);
      if (loadedMeasurements[ch].length > 0) computeFirPreview(ch);
      buildUI(); setTimeout(() => drawFirPreviewGraph(ch), 20);
    }

    async function fetchGithubReleases() {
      let sel = document.getElementById('ota-version');
      sel.innerHTML = '<option>Fetching from GitHub...</option>';
      try {
        let res = await fetch('https://api.github.com/repos/FRIZH-Labs/FRIZH-Labs/contents/firmware/standard/', { headers: { 'Accept': 'application/vnd.github.v3+json' }});
        let files = await res.json();
        let opts = '';
        files.forEach(f => { if(f.name && f.name.toLowerCase().endsWith('.bin')) { let name = f.name.replace(/\.bin$/i, ''); opts += `<option value="${name}">${name}</option>`; } });
        sel.innerHTML = opts || '<option value="firmware_normal">firmware_normal</option>';
      } catch(e) { sel.innerHTML = '<option value="firmware_normal">firmware_normal</option>'; }
    }

    function triggerOTA() {
      let ssid = document.getElementById('ota-ssid').value, pass = document.getElementById('ota-pass').value, ver = document.getElementById('ota-version').value;
      if(!ssid || !ver || ver.includes('Fetching')) return alert("Enter WiFi SSID and select a firmware version.");
      if(confirm("Start OTA Firmware Update?")) sendBLE(`/api/ota?s=${ssid}&p=${pass}&v=${ver}`);
    }

    function doPreset(act) {
      let slot = parseInt(document.getElementById('sys-preset-slot').value);
      if ((act === 'save' || act === 'rename') && slot >= 6) return alert("Slots 6-8 are factory protected.");
      if (act === 'rename') {
        let n = prompt(`New name for Slot ${slot} (Max 5 chars):`);
        if (n !== null) sendBLE(`/api/preset?act=rename&slot=${slot}&name=${n.substring(0,5).toUpperCase().replace(/[^A-Z0-9 ]/g,'')}`);
      } else if (confirm(`${act.toUpperCase()} Slot ${slot}?`)) {
        sendBLE(`/api/preset?act=${act}&slot=${slot}`);
        if (act === 'load') setTimeout(() => sendBLE('/api/dump'), 1000);
      }
    }

                  ${hasF ? `
                    <div class="ctrl-row">${createFader('Start Freq', 'firdes', ch, 'minF', 20, 20000, firMinFreq[ch], 'Hz')}${createFader('End Freq', 'firdes', ch, 'maxF', 20, 20000, firMaxFreq[ch], 'Hz')}</div>
                    <div class="ctrl-row">${createFader('Max Boost', 'firdes', ch, 'boost', 0, 12, firMaxBoost[ch], 'dB', '', '0.5')}${createFader('Max Cut', 'firdes', ch, 'cut', -24, 0, firMaxCut[ch], 'dB', '', '0.5')}</div>
                    <div class="pill-btn ${firCorrectPhase[ch] ? 'active-cyan' : ''}" onclick="firCorrectPhase[${ch}]=!firCorrectPhase[${ch}]; buildUI();">Inverse Phase Correction: ${firCorrectPhase[ch] ? 'ON (Flattens Speaker Phase)' : 'OFF (0° Linear Phase)'}</div>
                    <div id="fir-prog-txt-${ch}" style="text-align:center; color:var(--accent-orange); font-size:10px; font-weight:bold;"></div>
                    <div class="ctrl-row">
                      <button class="btn btn-primary" style="flex:1; padding:11px;" onclick="autoFitPeqFromMeasurement(${ch})">AUTO-EQ (7-BAND)</button>
                      <button class="btn btn-orange" style="flex:1; padding:11px;" onclick="synthesizeAndInjectAutoFir(${ch})">INJECT ${activeTaps}-T FIR</button>
                    </div>
                  ` : ''}
                ` : ''}
              </div>
            </div>`;
        } else if (st === 3) {
          let apfOn = dspState.apfe[ch] === 1, m = dspState.apfm[ch] || 0;
          bodyHtml = `
            <div class="widget">
              <div class="widget-header"><span>ALL-PASS / PHASE ROTATION</span><button class="btn btn-slim ${apfOn ? 'btn-primary' : ''}" onclick="dspState.apfe[${ch}]=${apfOn ? 0 : 1}; sendBLE('/api/set?type=apf&ch=${ch}&p=e&v=${apfOn ? 0 : 1}'); buildUI();">${apfOn ? 'ENABLED' : 'BYPASS'}</button></div>
              <div class="widget-body">
                <div class="pill-group">
                  <div class="pill-btn ${m === 0 ? 'active-cyan' : ''}" onclick="dspState.apfm[${ch}]=0; sendBLE('/api/set?type=apf&ch=${ch}&p=m&v=0'); buildUI();">MANUAL APF (Q)</div>
                  <div class="pill-btn ${m === 1 ? 'active-orange' : ''}" onclick="dspState.apfm[${ch}]=1; sendBLE('/api/set?type=apf&ch=${ch}&p=m&v=1'); buildUI();">PHASE ROT (5° STEP)</div>
                </div>
                ${m === 0 ? `<div class="ctrl-row">${createFader('Center Freq', 'apf', ch, 'f', 20, 20000, dspState.apff[ch], 'Hz')}${createFader('Q-Factor', 'apf', ch, 'q', 0.1, 10, dspState.apfq[ch], '', '', '0.1')}</div>` : createFader('Phase Rotation', 'apf', ch, 'd', 0, 180, dspState.apfd[ch] || 0, '°', '', '5')}
              </div>
            </div>`;
        } else if (st === 4) {
          bodyHtml = buildCompressorCardHtml(ch, false);
        } else if (st === 5) {
          bodyHtml = `<div class="widget"><div class="widget-header"><span>OUTPUT DELAY</span><button class="btn btn-slim btn-danger" onclick="dspState.dl[${ch}]=0; sendBLE('/api/set?type=dl&ch=${ch}&p=v&v=0'); buildUI();">RST</button></div><div class="widget-body">${createFader('Output Delay', 'dl', ch, 'v', 0, 200, dspState.dl[ch], 'ms', '', '0.1')}</div></div>`;
        }

        document.getElementById(`t-out${ch + 1}`).innerHTML = `
          <div class="slim-header">
            <div class="slim-title">${dspState.out_n[ch]} <span style="cursor:pointer; opacity:0.6;" onclick="renameChannel('out', ${ch})">✏️</span></div>
            <div class="slim-actions">
              <button class="btn btn-slim btn-danger" onclick="resetAllOutputCh(${ch})">RST</button>
              <button class="btn btn-slim" style="${inv ? 'background:var(--accent-orange); color:#000;' : ''}" onclick="togglePolarity(${ch})">${inv ? '180°' : '0°'}</button>
              <button class="btn btn-slim" onclick="copyChannelPrompt('out', ${ch})">📋</button>
              <button id="btn-mute-out-${ch}" class="btn btn-slim btn-danger ${muted ? 'active' : ''}" onclick="toggleMute('out', ${ch})">${muted ? 'MUTED' : 'MUTE'}</button>
            </div>
          </div>
          <div class="panel-scroll">${bodyHtml}</div>`;
      }

      // 5. SYSTEM TAB
      document.getElementById('t-sys').innerHTML = `
        <div class="slim-header"><div class="slim-title">SYSTEM CONFIGURATION</div></div>
        <div class="panel-scroll">
          <div class="widget">
            <div class="widget-header"><span>PRESET MANAGEMENT</span></div>
            <div class="widget-body">
              <select id="sys-preset-slot" class="pro-sel">${[1,2,3,4,5,6,7,8].map(s => `<option value="${s}">SLOT ${s}${s===6?' (2 WAY)':s===7?' (3 WAY)':s===8?' (4 WAY)':''}</option>`).join('')}</select>
              <div class="ctrl-row">
                <button class="btn btn-primary" style="flex:1; padding:9px;" onclick="doPreset('load')">LOAD</button>
                <button class="btn btn-orange" style="flex:1; padding:9px;" onclick="doPreset('save')">SAVE</button>
                <button class="btn" style="flex:1; padding:9px;" onclick="doPreset('rename')">RENAME</button>
              </div>
              <div class="ctrl-row">
                <button class="btn btn-primary" style="flex:1; padding:9px;" onclick="exportPreset()">EXPORT JSON</button>
                <button class="btn btn-primary" style="flex:1; padding:9px;" onclick="document.getElementById('import-file').click()">IMPORT JSON</button>
                <input type="file" id="import-file" style="display:none" accept=".json" onchange="importPreset(event)">
              </div>
            </div>
          </div>
          <div class="widget">
            <div class="widget-header"><span>TONE GENERATOR</span></div>
            <div class="widget-body">
              <div class="ctrl-row">${createSelect('Mode', 'tone', 0, 'm', ['OFF', 'PINK NOISE', 'SINE WAVE'], dspState.tm)}${createSelect('Route To', 'tone', 0, 'r', ['ALL IN', 'IN A', 'IN B', 'OUT 1', 'OUT 2', 'OUT 3', 'OUT 4'], dspState.tr)}</div>
              <div class="ctrl-row">${createFader('Frequency', 'tone', 0, 'f', 20, 20000, dspState.tf, 'Hz')}${createFader('Gain', 'tone', 0, 'g', -60, 0, dspState.tg, 'dB')}</div>
            </div>
          </div>
          <div class="widget">
            <div class="widget-header"><span>FIRMWARE UPDATE (OTA)</span></div>
            <div class="widget-body">
              <div class="ctrl-row"><input type="text" id="ota-ssid" class="pro-in" style="flex:1;" placeholder="Wi-Fi SSID"><input type="password" id="ota-pass" class="pro-in" style="flex:1;" placeholder="Wi-Fi Password"></div>
              <div class="ctrl-row"><select id="ota-version" class="pro-sel" style="flex:2;"><option>Click FETCH...</option></select><button class="btn btn-primary" style="flex:1;" onclick="fetchGithubReleases()">FETCH GITHUB</button><button class="btn btn-danger" style="flex:1;" onclick="triggerOTA()">UPDATE</button></div>
            </div>
          </div>
        </div>`;

      // 6. FRIZH FIR 4-WAY SMART AUTO-TUNE WIZARD TAB
      const nodeLabels = ["32Hz", "80Hz", "250Hz", "1kHz", "3.5k", "8kHz", "16kHz"];
      const presetNames = ["FLAT", "DANGDUT", "LIVE BAND", "LIVE ACOUSTIC", "LIVE PA", "CLUB / DJ", "SUB MONSTER"];
      let presetChips = presetNames.map((nm, idx) => `<div class="pill-btn ${wizardActivePreset === idx ? 'active-amber' : ''}" onclick="applyWizardTargetPreset(${idx})">${nm}</div>`).join('');
      let nodePills = nodeLabels.map((nl, i) => {
        let g = wizardTargetGains[i];
        return `<div class="pill-btn ${wizardSelectedNode === i ? 'active-amber' : ''}" onclick="wizardSelectedNode=${i}; buildUI(); setTimeout(()=>drawFrizhWizardGraph(),20);"><div>${nl}</div><div style="font-family:monospace; color:#fff;">${g >= 0 ? '+' : ''}${g.toFixed(1)}dB</div></div>`;
      }).join('');
      let outCards = [0,1,2,3].map(c => {
        let sel = wizardSelectedOuts[c], col = chColors[c];
        let hpf = dspState.xt[c] > 0 ? dspState.xfl[c] + 'Hz' : '20Hz';
        let lpf = dspState.xth[c] > 0 ? (dspState.xfh[c] >= 1000 ? (dspState.xfh[c]/1000).toFixed(1)+'k' : dspState.xfh[c]+'Hz') : '20k';
        return `<div class="pill-btn" style="${sel ? `background:${col}33; border-color:${col}; color:#fff;` : ''}" onclick="wizardSelectedOuts[${c}]=!wizardSelectedOuts[${c}]; buildUI(); setTimeout(()=>drawFrizhWizardGraph(),20);"><div>${sel ? '☑️' : '⬜'} ${dspState.out_n[c]}</div><div style="font-size:8.5px; color:${col}; font-family:monospace; margin-top:2px;">${hpf} - ${lpf}</div></div>`;
      }).join('');

      document.getElementById('t-frizh').innerHTML = `
        <div class="slim-header"><div class="slim-title" style="color:var(--accent-orange);">✨ FRIZH FIR — SMART 4-WAY AUTO-TUNE WIZARD</div></div>
        <div class="panel-scroll">
          <div class="widget">
            <div class="widget-header"><span>1. REFERENCE FILE & 7-NODE TARGET CURVE</span></div>
            <div class="widget-body">
              <button class="btn btn-primary" style="padding:10px;" onclick="document.getElementById('wiz-file-input').click()">📂 ${wizardMeasurement.length > 0 ? `REF: ${wizardFileName} (${wizardMeasurement.length} pts)` : 'LOAD 20Hz-20kHz REFERENCE (.TXT / .CSV / .FRD)'}</button>
              <div class="pill-group" style="overflow-x:auto;">${presetChips}</div>
              <div class="graph-container graph-xl">
                <canvas id="cvs-frizh-wiz"></canvas>
                <button class="graph-lock-btn ${!lockWizCurve ? 'unlocked' : ''}" onclick="lockWizCurve=!lockWizCurve; buildUI(); setTimeout(()=>drawFrizhWizardGraph(),20);">${lockWizCurve ? '🔒 LOCKED' : '👆 DRAW TARGET'}</button>
              </div>
              <div class="pill-group" style="overflow-x:auto;">${nodePills}</div>
              ${createFader(`Target Node ${nodeLabels[wizardSelectedNode]}`, 'wiz', 0, 'node', -12, 12, wizardTargetGains[wizardSelectedNode], 'dB', '', '0.5')}
            </div>
          </div>
          <div class="widget">
            <div class="widget-header"><span>2. SELECT OUTPUT CHANNELS & CROSSOVER BANDS</span></div>
            <div class="widget-body"><div class="pill-group">${outCards}</div></div>
          </div>
          <div class="widget">
            <div class="widget-header"><span>3. AUTO-TUNE PARAMETERS & EXECUTION</span></div>
            <div class="widget-body">
              <div class="pill-group">
                <div class="pill-btn ${wizardTapMode === 0 ? 'active-cyan' : ''}" onclick="wizardTapMode=0; buildUI();">256 TAPS (2.66ms)</div>
                <div class="pill-btn ${wizardTapMode === 1 ? 'active-orange' : ''}" onclick="wizardTapMode=1; buildUI();">512 TAPS (5.33ms HI-RES)</div>
              </div>
              <div class="pill-group" style="flex-wrap:wrap;">
                <div class="pill-btn ${wizardTuneGain ? 'active-cyan' : ''}" onclick="wizardTuneGain=!wizardTuneGain; buildUI();">Output Gain</div>
                <div class="pill-btn ${wizardTuneEq ? 'active-cyan' : ''}" onclick="wizardTuneEq=!wizardTuneEq; buildUI();">7-Band PEQ</div>
                <div class="pill-btn ${wizardTuneFir ? 'active-cyan' : ''}" onclick="wizardTuneFir=!wizardTuneFir; buildUI();">FIR Taps</div>
                <div class="pill-btn ${wizardInversePhase ? 'active-cyan' : ''}" onclick="wizardInversePhase=!wizardInversePhase; buildUI();">Inverse Phase (FIR)</div>
                <div class="pill-btn ${wizardTunePhase ? 'active-cyan' : ''}" onclick="wizardTunePhase=!wizardTunePhase; buildUI();">5° Phase Rot (APF)</div>
                <div class="pill-btn ${wizardTuneDelay ? 'active-cyan' : ''}" onclick="wizardTuneDelay=!wizardTuneDelay; buildUI();">Delay Align</div>
              </div>
              <div class="ctrl-row">${createFader('Max Boost', 'wiz', 0, 'boost', 0, 12, wizardMaxBoost, 'dB', '', '0.5')}${createFader('Max Cut', 'wiz', 0, 'cut', -24, 0, wizardMaxCut, 'dB', '', '0.5')}</div>
              <div style="text-align:center; color:var(--accent-orange); font-weight:bold;">${isWizardRunning ? wizardStatusText : ''}</div>
              <button class="btn btn-orange" style="padding:14px; font-size:12px; background:var(--accent-orange); color:#000;" onclick="runFrizhMultiWayWizard()">✨ RUN FRIZH FIR - SMART AUTO-TUNE</button>
            </div>
          </div>
        </div>`;
    }

    function build7BandEqCardHtml(ch, isInput) {
      let b = isInput ? activeEqBandIn[ch] : activeEqBandOut[ch];
      let fArr = isInput ? dspState.ieqf[ch] : dspState.eqf[ch];
      let gArr = isInput ? dspState.ieqg[ch] : dspState.eq_gn[ch];
      let qArr = isInput ? dspState.ieqq[ch] : dspState.eqq[ch];
      let tArr = isInput ? dspState.ieqt[ch] : dspState.eqt[ch];
      let byp = isInput ? (dspState.ieqb[ch] === 1) : (dspState.eqb[ch] === 1);
      let isLocked = isInput ? lockInEq[ch] : lockOutEq[ch];
      let prefix = isInput ? 'ineq' : 'eq';
      let bypCmd = isInput ? 'ineqb' : 'eqb';

      let bandTabs = [0,1,2,3,4,5,6].map(i => {
        let bt = tArr[i] || 0;
        let tag = bt === 1 ? ' LS' : (bt === 2 ? ' HS' : '');
        return `<div class="pill-btn ${b === i ? 'active-cyan' : ''}" onclick="${isInput ? `activeEqBandIn[${ch}]=${i}` : `activeEqBandOut[${ch}]=${i}`}; buildUI(); setTimeout(()=>drawEqGraph(${ch},${isInput}),20);">B${i + 1}${tag}</div>`;
      }).join('');

      let curT = tArr[b] || 0;
      let typeChips = ['PEAKING (BELL)', 'LOW SHELF', 'HIGH SHELF'].map((lbl, tv) => `
        <div class="pill-btn ${curT === tv ? 'active-cyan' : ''}" onclick="${isInput ? `dspState.ieqt[${ch}][${b}]=${tv}` : `dspState.eqt[${ch}][${b}]=${tv}`}; sendUpdate('${prefix}', ${ch}, 't', ${tv}, ${b}); buildUI(); setTimeout(()=>drawEqGraph(${ch},${isInput}),20);">${lbl}</div>
      `).join('');

      return `
        <div class="widget ${byp ? 'bypassed' : ''}">
          <div class="widget-header">
            <span>${isInput ? 'INPUT 7-BAND EQUALIZER' : 'OUTPUT 7-BAND PARAMETRIC EQ'}</span>
            <button class="btn btn-slim ${!byp ? 'btn-primary' : 'btn-danger'}" onclick="${isInput ? `dspState.ieqb[${ch}]=${byp ? 0 : 1}` : `dspState.eqb[${ch}]=${byp ? 0 : 1}`}; sendBLE('/api/set?type=${bypCmd}&ch=${ch}&p=v&v=${byp ? 0 : 1}'); buildUI(); setTimeout(()=>drawEqGraph(${ch},${isInput}),20);">${byp ? 'BYPASSED' : 'ACTIVE'}</button>
          </div>
          <div class="widget-body">
            <div class="graph-container graph-large">
              <canvas id="cvs-eq-${isInput ? 'in' : 'out'}-${ch}"></canvas>
              <button class="graph-lock-btn ${!isLocked ? 'unlocked' : ''}" onclick="${isInput ? `lockInEq[${ch}]=!lockInEq[${ch}]` : `lockOutEq[${ch}]=!lockOutEq[${ch}]`}; buildUI(); setTimeout(()=>drawEqGraph(${ch},${isInput}),20);">${isLocked ? '🔒 LOCKED' : '🔓 EDIT'}</button>
            </div>
            <div class="pill-group" style="overflow-x:auto;">${bandTabs}</div>
            <div class="pill-group">${typeChips}</div>
            ${createFader('Frequency', prefix, ch, 'f', 20, 20000, fArr[b], 'Hz', b)}
            <div class="ctrl-row">
              ${createFader('Gain', prefix, ch, 'g', -12, 12, gArr[b], 'dB', b)}
              ${createFader('Q-Factor', prefix, ch, 'q', 0.1, 10, qArr[b], '', b, '0.1')}
            </div>
          </div>
        </div>`;
    }

    function buildCompressorCardHtml(ch, isInput) {
      let pfx = isInput ? 'incomp' : 'comp';
      let t = isInput ? dspState.ict[ch] : dspState.ct[ch];
      let r = isInput ? dspState.icr[ch] : dspState.cr[ch];
      let m = isInput ? dspState.icm[ch] : dspState.cm[ch];
      let a = isInput ? dspState.ica[ch] : dspState.ca[ch];
      let rl = isInput ? dspState.icrel[ch] : dspState.crel[ch];
      return `
        <div class="widget">
          <div class="widget-header"><span>${isInput ? 'INPUT COMPRESSOR' : 'OUTPUT COMPRESSOR / LIMITER'}</span></div>
          <div class="widget-body">
            <div class="comp-layout">
              <div class="graph-container" style="flex:1;"><canvas id="cvs-comp-${isInput ? 'in' : 'out'}-${ch}"></canvas></div>
              <div class="gr-meter-box">
                <span style="font-size:8px; font-weight:bold; color:#888;">GR</span>
                <div class="gr-track"><div id="gr-fill-${isInput ? 'in' : 'out'}-${ch}" class="gr-fill"></div></div>
                <span id="gr-txt-${isInput ? 'in' : 'out'}-${ch}" style="font-size:8px; font-family:monospace; color:#fff;">0.0</span>
              </div>
            </div>
            ${createFader('Threshold', pfx, ch, 'thr', -40, 1, t, 'dB')}
            <div class="ctrl-row">${createFader('Ratio', pfx, ch, 'rat', 1, 21, r, ':1')}${createFader('MakeUp Gain', pfx, ch, 'mak', 0, 20, m, 'dB')}</div>
            <div class="ctrl-row">${createFader('Attack', pfx, ch, 'atk', 1, 100, a, 'ms')}${createFader('Release', pfx, ch, 'rel', 10, 1000, rl, 'ms', '', '10')}</div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
