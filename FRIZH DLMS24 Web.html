<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRIZH DLMS 24 PRO - FIR V1.5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root {
      --bg-main: #0c0d10;
      --bg-panel: #16171b;
      --bg-section: #1d1e24;
      --border-color: #2a2c35;
      --accent-cyan: #00ADB5;
      --accent-orange: #ff9800;
      --accent-amber: #ffd740;
      --accent-red: #f44336;
      --accent-green: #69f0ae;
      --accent-purple: #e040fb;
      --text-main: #d1d5db;
      --text-muted: #6b7280;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: var(--bg-main); color: var(--text-main); font-family: var(--font-family); font-size: 11px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; user-select: none; }

    .app-wrapper { display: flex; flex: 1; height: 100vh; overflow: hidden; }

    /* LEFT MAIN SIDEBAR */
    .sidebar { width: 105px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; flex-shrink: 0; }
    .brand { padding: 10px 6px; font-size: 13px; font-weight: 900; color: var(--accent-cyan); letter-spacing: 1.5px; border-bottom: 1px solid var(--border-color); text-align: center; line-height: 1.2; cursor: pointer; }
    .brand span { font-size: 8px; color: var(--text-muted); display: block; letter-spacing: 1px; }

    .nav-tabs { display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding-top: 4px; }
    .tab { padding: 10px 8px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-left: 3px solid transparent; transition: 0.15s; font-size: 10px; letter-spacing: 0.6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .tab.active { background: rgba(0, 173, 181, 0.12); border-left-color: var(--accent-cyan); color: var(--accent-cyan); }
    .tab-frizh { color: var(--accent-orange) !important; font-weight: 900; border-top: 1px solid var(--border-color); }
    .tab-frizh.active { background: rgba(255, 152, 0, 0.15) !important; border-left-color: var(--accent-orange) !important; }

    .ble-status { padding: 8px; text-align: center; border-top: 1px solid var(--border-color); background: #08080a; }
    .ble-btn { background: #222; color: #fff; border: 1px solid #444; width: 100%; padding: 6px 4px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 9px; }
    .ble-btn.connected { background: rgba(0,173,181,0.2); border-color: var(--accent-cyan); color: var(--accent-cyan); }

    /* LEFT CONTEXTUAL SUB-TAB SIDEBAR (Landscape / Desktop) */
    .sub-sidebar { width: 96px; background: #131418; border-right: 1px solid var(--border-color); display: none; flex-direction: column; padding: 6px 5px; gap: 5px; flex-shrink: 0; }
    .sub-sidebar.visible { display: flex; }
    .sub-tab-btn { flex: 1; background: #202228; color: #9ca3af; border: 1px solid #2e303a; border-radius: 6px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.4px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; transition: 0.15s; }
    .sub-tab-btn:hover { color: #fff; background: #282a32; }
    .sub-tab-btn.active { background: rgba(0, 173, 181, 0.22); color: #fff; border-color: var(--accent-cyan); border-width: 1.5px; }

    /* MAIN WORKSPACE */
    .main-view { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); overflow: hidden; }
    .panel { display: none; height: 100%; width: 100%; flex-direction: column; overflow: hidden; }
    .panel.active { display: flex; animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* SLIM 32PX CHANNEL HEADER BAR */
    .slim-header { height: 32px; min-height: 32px; padding: 0 10px; background: #1a1b20; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .slim-title { font-size: 13px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
    .slim-actions { display: flex; align-items: center; gap: 6px; }

    .panel-scroll { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    /* WIDGET CARDS */
    .widget { background: var(--bg-section); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; }
    .widget-header { padding: 7px 10px; background: rgba(0,0,0,0.25); border-bottom: 1px solid var(--border-color); font-size: 10px; font-weight: 800; color: var(--accent-cyan); display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.6px; border-radius: 6px 6px 0 0; }
    .widget-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .widget.bypassed { opacity: 0.5; border-color: var(--accent-red); }
    .widget-actions { display: flex; gap: 6px; align-items: center; }

    /* CONTROLS & FINE +/- BUTTONS */
    .ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .ctrl-col { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }

    .fader-box { background: #121317; border: 1px solid #2b2d36; padding: 6px 8px; border-radius: 5px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .fader-top { display: flex; justify-content: space-between; align-items: center; }
    .fader-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .fader-val { font-size: 11px; color: var(--accent-cyan); font-family: monospace; font-weight: bold; cursor: pointer; background: rgba(0,173,181,0.12); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(0,173,181,0.25); }
    .fader-track-row { display: flex; align-items: center; gap: 6px; }
    .fine-btn { background: #22242c; color: var(--accent-cyan); border: 1px solid #353844; border-radius: 4px; width: 24px; height: 22px; font-weight: bold; font-size: 13px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .fine-btn:active { background: var(--accent-cyan); color: #000; }

    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; margin: 4px 0; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #333; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #fff; margin-top: -5px; border: 2px solid var(--accent-cyan); }

    .btn { background: #2a2c35; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn:hover { background: #3a3c45; }
    .btn-primary { background: rgba(0, 173, 181, 0.16); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .btn-orange { background: rgba(255, 152, 0, 0.18); border-color: var(--accent-orange); color: var(--accent-orange); }
    .btn-danger { background: rgba(244, 67, 54, 0.16); border-color: var(--accent-red); color: var(--accent-red); }
    .btn-danger.active { background: var(--accent-red); color: #fff; box-shadow: 0 0 8px rgba(244, 67, 54, 0.5); }
    .btn-slim { padding: 3px 7px; font-size: 9px; border-radius: 4px; }

    .pill-group { display: flex; gap: 6px; width: 100%; }
    .pill-btn { flex: 1; padding: 7px 6px; background: #18191f; border: 1px solid #32343e; border-radius: 5px; color: #9ca3af; font-size: 10px; font-weight: 800; text-align: center; cursor: pointer; transition: 0.15s; }
    .pill-btn.active-cyan { background: rgba(0, 173, 181, 0.22); border-color: var(--accent-cyan); color: #fff; }
    .pill-btn.active-orange { background: rgba(255, 152, 0, 0.22); border-color: var(--accent-orange); color: #fff; }
    .pill-btn.active-amber { background: rgba(255, 215, 64, 0.22); border-color: var(--accent-amber); color: var(--accent-amber); }

    select.pro-sel { background: #111; color: #fff; border: 1px solid #333; padding: 5px 8px; border-radius: 4px; font-size: 10px; outline: none; cursor: pointer; font-weight: bold; }
    input.pro-in { background: #111; color: #fff; border: 1px solid #333; padding: 6px 8px; border-radius: 4px; font-size: 11px; width: 100%; outline: none; }

    /* GRAPHS */
    .graph-container { background: #000; border: 1px solid #2e303a; border-radius: 6px; position: relative; width: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .graph-xl { height: 220px; }
    .graph-large { height: 185px; }
    .graph-medium { height: 155px; }
    .graph-lock-btn { position: absolute; top: 6px; right: 8px; background: rgba(15,16,20,0.88); border: 1px solid #444; color: #9ca3af; padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: 800; cursor: pointer; z-index: 10; }
    .graph-lock-btn.unlocked { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0,173,181,0.18); }

    /* DUAL VU + TOP-DOWN GR METERS (MONITOR TAB) */
    .monitor-grid { display: flex; justify-content: space-evenly; align-items: stretch; padding: 10px 6px 16px 6px; flex: 1; min-height: 260px; }
    .vu-channel { display: flex; flex-direction: column; align-items: center; width: 54px; }
    .vu-title { font-weight: 900; font-size: 10px; margin-bottom: 5px; color: #fff; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .vu-top-leds { display: flex; gap: 3px; width: 48px; margin-bottom: 4px; }
    .top-led { flex: 1; padding: 2px 0; text-align: center; font-size: 7px; font-weight: 900; border-radius: 3px; background: #14151a; color: #444; border: 1px solid #282a34; }
    .top-led.clip-on { background: rgba(244,67,54,0.28); color: #ff5252; border-color: #ff5252; }
    .top-led.gr-on { background: rgba(255,152,0,0.28); color: #ffab40; border-color: #ffab40; }

    .dual-bar-housing { flex: 1; width: 48px; background: #050507; border: 1px solid #262832; border-radius: 5px; padding: 4px 3px 16px 3px; display: flex; position: relative; }
    .vu-col-bar { flex: 3; background: #0d0e12; border-radius: 2px; position: relative; overflow: hidden; margin-right: 2px; }
    .gr-col-bar { flex: 2; background: #0d0e12; border-radius: 2px; position: relative; overflow: hidden; border-left: 1px solid #1f2028; }
    .vu-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to top, #00c853 0%, #64dd17 70%, #ffd600 88%, #ff1744 100%); transition: height 0.06s linear; }
    .gr-fill-top { position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to bottom, #ff9100 0%, #ff1744 100%); transition: height 0.06s linear; }
    .vu-num-row { position: absolute; bottom: 1px; left: 3px; right: 3px; display: flex; justify-content: space-between; font-size: 8px; font-family: monospace; font-weight: bold; }

    .vu-mute-pill { margin-top: 8px; width: 50px; height: 34px; border-radius: 6px; background: #23252e; border: 1.5px solid #3e4150; color: #9ca3af; font-size: 8.5px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: 0.15s; }
    .vu-mute-pill.muted { background: var(--accent-red); border-color: #ff8a80; color: #fff; box-shadow: 0 0 10px rgba(244,67,54,0.45); }

    /* COMPRESSOR CARD GR METER */
    .comp-layout { display: flex; gap: 8px; height: 125px; }
    .gr-meter-box { width: 24px; background: #000; border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column; align-items: center; padding: 4px 0; }
    .gr-track { flex: 1; width: 12px; background: #111; position: relative; margin: 4px 0; border-radius: 2px; overflow: hidden; }
    .gr-fill { position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to bottom, #ff9800, #f44336); transition: height 0.05s; }

    /* OVERLAYS */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12,13,16,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(4px); }
    .dialog { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 22px; border-radius: 8px; text-align: center; min-width: 280px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .hidden { display: none !important; }

    /* PORTRAIT / MOBILE RESPONSIVE ADAPTATION */
    @media (orientation: portrait), (max-width: 760px) {
      .app-wrapper { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border-color); flex-direction: row; align-items: center; padding: 0 6px; }
      .brand { padding: 8px 6px; border-bottom: none; border-right: 1px solid var(--border-color); font-size: 11px; }
      .nav-tabs { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 0; }
      .tab { border-left: none; border-bottom: 3px solid transparent; padding: 10px 10px; flex-shrink: 0; }
      .tab.active { border-left-color: transparent; border-bottom-color: var(--accent-cyan); }
      .tab-frizh.active { border-bottom-color: var(--accent-orange) !important; }
      .ble-status { border-top: none; border-left: 1px solid var(--border-color); padding: 4px 6px; }
      .sub-sidebar { width: 100%; height: 42px; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border-color); padding: 5px 8px; }
      .sub-tab-btn { flex: 0 0 auto; padding: 0 12px; height: 30px; }
    }
  </style>
</head>
<body>

  <!-- BLE CONNECTION OVERLAY -->
  <div id="connect-overlay" class="overlay">
    <div style="font-size: 28px; font-weight: 900; color: var(--accent-cyan); letter-spacing: 3px; margin-bottom: 8px;">FRIZH DLMS 24</div>
    <div style="font-size: 11px; color: var(--accent-orange); font-weight: bold; letter-spacing: 1.5px; margin-bottom: 26px;">256 / 512-TAP FIR ACOUSTIC CONSOLE</div>
    <button class="btn btn-primary" style="font-size: 13px; padding: 12px 28px;" onclick="connectBLE()">SCAN & CONNECT</button>
    <p style="color:var(--text-muted); margin-top:15px; font-size: 11px; text-align:center;">Requires Chrome / Edge / Bluefy with Web Bluetooth enabled.</p>
  </div>

  <div id="ble-dialog-overlay" class="overlay hidden">
    <div class="dialog">
      <h3 style="color:var(--accent-cyan); margin-top:0; font-size: 14px;">DEVICE STATUS</h3>
      <p id="ble-connected-name" style="color:var(--text-main); margin-bottom: 20px; font-size: 12px;">Connected to: Unknown</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-primary" onclick="switchDevice()">SWITCH DEVICE</button>
        <button class="btn btn-danger" onclick="disconnectBLE()">DISCONNECT</button>
        <button class="btn" onclick="closeBleDialog()">CANCEL</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <!-- MAIN SIDEBAR NAV (10 TABS Matching Flutter App) -->
    <nav class="sidebar">
      <div class="brand" onclick="window.open('https://frizh-labs.github.io/FRIZH-Labs/','_blank')">FRIZH<span>DLMS 24</span></div>
      <div class="nav-tabs" id="tabs">
        <div class="tab active" id="tab-monitor" onclick="switchTab('t-monitor')">MONITOR</div>
        <div class="tab" id="tab-rta" onclick="switchTab('t-rta')">RTA</div>
        <div class="tab" id="tab-inA" onclick="switchTab('t-inA')">IN A</div>
        <div class="tab" id="tab-inB" onclick="switchTab('t-inB')">IN B</div>
        <div class="tab" id="tab-out1" onclick="switchTab('t-out1')">OUT 1</div>
        <div class="tab" id="tab-out2" onclick="switchTab('t-out2')">OUT 2</div>
        <div class="tab" id="tab-out3" onclick="switchTab('t-out3')">OUT 3</div>
        <div class="tab" id="tab-out4" onclick="switchTab('t-out4')">OUT 4</div>
        <div class="tab" id="tab-sys" onclick="switchTab('t-sys')">SYSTEM</div>
        <div class="tab tab-frizh" id="tab-frizh" onclick="switchTab('t-frizh')">✨ FRIZH FIR</div>
      </div>
      <div class="ble-status">
        <button id="ble-btn" class="ble-btn" onclick="handleBleIconClick()">BLE</button>
      </div>
    </nav>

    <!-- CONTEXTUAL SUB-TAB SIDEBAR (Appears only for IN A..B and OUT 1..4) -->
    <div id="sub-sidebar" class="sub-sidebar"></div>

    <!-- MAIN WORKSPACE -->
    <main class="main-view">
      <div id="t-monitor" class="panel active"></div>
      <div id="t-rta" class="panel"></div>
      <div id="t-inA" class="panel"></div>
      <div id="t-inB" class="panel"></div>
      <div id="t-out1" class="panel"></div>
      <div id="t-out2" class="panel"></div>
      <div id="t-out3" class="panel"></div>
      <div id="t-out4" class="panel"></div>
      <div id="t-sys" class="panel"></div>
      <div id="t-frizh" class="panel"></div>
    </main>
  </div>

  <!-- HIDDEN FILE INPUTS FOR FIR & WIZARD -->
  <input type="file" id="fir-file-input" style="display:none" accept=".txt,.csv,.frd" onchange="handleFirFileSelect(event)">
  <input type="file" id="wiz-file-input" style="display:none" accept=".txt,.csv,.frd" onchange="handleWizardFileSelect(event)">

  <script>
    let dspState = {};
    let timers = {};
    let isUiBuilt = false;
    let activeMainTab = 't-monitor';
    let inSubTab = [0, 0];
    let outSubTab = [0, 0, 0, 0];
    let activeEqBandIn = [0, 0];
    let activeEqBandOut = [0, 0, 0, 0];
    let activeDeqBand = [0, 0];

    // Graph Lock States (Locked by default for thumb safety!)
    let lockInEq = [true, true];
    let lockOutEq = [true, true, true, true];
    let lockDeq = [true, true];
    let lockWizCurve = true;

    const IN_SUB_LABELS = ["GAIN & DELAY", "7-BAND EQ", "DYNAMIC EQ", "AFS (FEEDBACK)", "BBE & GATE", "COMPRESSOR"];
    const OUT_SUB_LABELS = ["SOURCE & XOVER", "7-BAND EQ", "AUTO FIR", "APF & PHASE", "COMPRESSOR", "DELAY"];

    // Per-Output-Tab Global Crossover & RTA visibility toggles (defaults to current channel active)
    let outXoverVis = [
      [true, false, false, false],
      [false, true, false, false],
      [false, false, true, false],
      [false, false, false, true]
    ];
    // 6-Channel RTA visibility toggles [IN A, IN B, OUT 1, OUT 2, OUT 3, OUT 4]
    let rtaVis = [true, false, false, false, false, false];

    // Live Audio State
    let livePeaks = [0,0,0,0,0,0];
    let compAct = [0,0,0,0];
    let inCompAct = [0,0];
    let rtaA = new Array(31).fill(-60.0);
    let rtaB = new Array(31).fill(-60.0);

    // Per-Channel Auto-FIR & Measurement State (256 / 512 Taps)
    let firUiTab = [0, 0, 0, 0];
    let loadedMeasurements = [[], [], [], []];
    let loadedFileNames = ["No file loaded", "No file loaded", "No file loaded", "No file loaded"];
    let firMinFreq = [80, 80, 80, 80];
    let firMaxFreq = [16000, 16000, 16000, 16000];
    let firMaxBoost = [6.0, 6.0, 6.0, 6.0];
    let firMaxCut = [-12.0, -12.0, -12.0, -12.0];
    let firCorrectPhase = [false, false, false, false];
    let isUploadingFir = [false, false, false, false];
    let firUploadProgress = [0, 0, 0, 0];
    let previewFirMagDb = Array.from({length:4}, () => new Array(257).fill(0));
    let activeInjectedFirDb = Array.from({length:4}, () => new Array(257).fill(0));
    let activeCustomFirTaps = [[], [], [], []];
    let pendingFirFileCh = 0;

    // FRIZH FIR 4-Way Smart Wizard State
    let wizardMeasurement = [];
    let wizardFileName = "No reference file loaded";
    const wizardTargetFreqs = [32, 80, 250, 1000, 3500, 8000, 16000];
    let wizardTargetGains = [0, 0, 0, 0, 0, 0, 0];
    let wizardActivePreset = 0;
    let wizardSelectedNode = 0;
    let wizardSelectedOuts = [true, true, true, true];
    let wizardTuneGain = true;
    let wizardTuneEq = true;
    let wizardTuneFir = true;
    let wizardInversePhase = true;
    let wizardTunePhase = true;
    let wizardTuneDelay = true;
    let wizardTapMode = 1; // Default 512 Taps
    let wizardMaxBoost = 6.0;
    let wizardMaxCut = -12.0;
    let isWizardRunning = false;
    let wizardStatusText = "Ready";

    // Web Bluetooth Variables
    let bleDevice, bleServer, bleService, rxChar, txChar;
    let bleQueue = [];
    let isWriting = false;
    let jsonBuffer = "";
    let afsPollTimer = null;

    window.addEventListener('resize', () => redrawActiveTabCanvases());

    function getDpiCtx(cvs) {
      if(!cvs) return null;
      let dpr = window.devicePixelRatio || 1;
      let rect = cvs.getBoundingClientRect();
      if(rect.width === 0 || rect.height === 0) return null;
      cvs.width = rect.width * dpr;
      cvs.height = rect.height * dpr;
      let ctx = cvs.getContext('2d', {alpha: false});
      ctx.scale(dpr, dpr);
      return { ctx, w: rect.width, h: rect.height };
    }

    /* --- BLE LOGIC --- */
    function handleBleIconClick() {
      if (bleDevice && bleDevice.gatt.connected) {
        document.getElementById('ble-connected-name').innerText = "Connected to:\n" + (bleDevice.name || "FRIZH DLMS");
        document.getElementById('ble-dialog-overlay').classList.remove('hidden');
      } else {
        connectBLE();
      }
    }
    function closeBleDialog() { document.getElementById('ble-dialog-overlay').classList.add('hidden'); }
    function disconnectBLE() { if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect(); closeBleDialog(); }
    async function switchDevice() { disconnectBLE(); setTimeout(() => connectBLE(), 400); }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'FRIZH_DLMS24_' }],
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });

        bleDevice.addEventListener('gattserverdisconnected', () => {
          document.getElementById('ble-btn').classList.remove('connected');
          document.getElementById('connect-overlay').classList.remove('hidden');
          if (afsPollTimer) clearInterval(afsPollTimer);
        });

        bleServer = await bleDevice.gatt.connect();
        bleService = await bleServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
        rxChar = await bleService.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
        txChar = await bleService.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleNotifications);

        document.getElementById('connect-overlay').classList.add('hidden');
        document.getElementById('ble-btn').classList.add('connected');
        closeBleDialog();
        sendBLE('/api/dump');

        // Lightweight 1-packet /api/afs poller every 3 seconds (survives hours of activity!)
        if (afsPollTimer) clearInterval(afsPollTimer);
        afsPollTimer = setInterval(() => {
          if (bleDevice && bleDevice.gatt.connected && !isWriting && bleQueue.length === 0) {
            sendBLE('/api/afs');
          }
        }, 3000);
      } catch(e) {
        console.error("BLE Error:", e);
        if (e.name !== 'NotFoundError') alert("Bluetooth Connection Failed.");
      }
    }

    async function processBleQueue() {
      if(isWriting || bleQueue.length === 0 || !rxChar) return;
      isWriting = true;
      let cmd = bleQueue.shift();
      try {
        await rxChar.writeValueWithoutResponse(new TextEncoder().encode(cmd));
      } catch(e) { console.log("BLE Write Error", e); }
      isWriting = false;
      setTimeout(processBleQueue, 40);
    }
    function sendBLE(cmd) { bleQueue.push(cmd); processBleQueue(); }

    function calcSimGr(isInput, ch) {
      if (!dspState.ct || !dspState.ict) return 0;
      let thr = isInput ? dspState.ict[ch] : dspState.ct[ch];
      let r = isInput ? dspState.icr[ch] : dspState.cr[ch];
      let rat = r >= 21 ? 1000.0 : r;
      let mak = isInput ? dspState.icm[ch] : dspState.cm[ch];
      if (thr >= 1) return 0;
      let pLin = isInput ? livePeaks[ch] : livePeaks[ch + 2];
      let peakDb = (pLin > 0.0001) ? Math.max(-60, Math.min(0, 20 * Math.log10(pLin) - 3.0)) : -60;
      let act = isInput ? inCompAct[ch] : compAct[ch];
      let simGr = 0;
      let outNoMak = peakDb - mak;
      if (outNoMak > thr) simGr = (outNoMak - thr) * (1.0 - 1.0 / rat);
      if (act === 1 && simGr < 1.5) simGr = 1.5 + (Math.max(0, peakDb + 40) / 40.0 * Math.min(8, rat));
      return Math.max(0, Math.min(20, simGr));
    }

    function handleNotifications(event) {
      let val = new TextDecoder().decode(event.target.value).trim();
      if(val.startsWith("S:")) {
        let p = val.substring(2).split(',');
        if(p.length >= 18) {
          for(let i=0; i<6; i++) livePeaks[i] = parseFloat(p[i]) || 1e-9;
          if (dspState.in_mute !== undefined) {
            for(let i=0; i<2; i++) {
              dspState.in_mute[i] = (p[6+i] === '1');
              inCompAct[i] = parseInt(p[16+i]) || 0;
              let btn = document.getElementById(`btn-mute-in-${i}`);
              if(btn) { btn.classList.toggle('active', dspState.in_mute[i]); btn.innerText = dspState.in_mute[i] ? 'MUTED' : 'MUTE'; }
            }
            for(let i=0; i<4; i++) {
              dspState.out_mute[i] = (p[8+i] === '1');
              compAct[i] = parseInt(p[12+i]) || 0;
              let btn = document.getElementById(`btn-mute-out-${i}`);
              if(btn) { btn.classList.toggle('active', dspState.out_mute[i]); btn.innerText = dspState.out_mute[i] ? 'MUTED' : 'MUTE'; }
            }
          }
          if(activeMainTab === 't-monitor') updateMonitorMeters();
          drawCompVisualizers();
          if(activeMainTab === 't-inA' && inSubTab[0] === 2) drawDeqGraph(0);
          if(activeMainTab === 't-inB' && inSubTab[1] === 2) drawDeqGraph(1);
        }
      } else if (val.startsWith("R:")) {
        let halves = val.substring(2).split('|');
        if (halves.length === 2) {
          let aVals = halves[0].split(','), bVals = halves[1].split(',');
          for (let i = 0; i < 31; i++) {
            if (aVals[i] !== "") { let raw = parseFloat(aVals[i]); rtaA[i] = raw > rtaA[i] ? raw : Math.max(-60, rtaA[i] - 1.5); }
            if (bVals[i] !== "") { let raw = parseFloat(bVals[i]); rtaB[i] = raw > rtaB[i] ? raw : Math.max(-60, rtaB[i] - 1.5); }
          }
          if (activeMainTab === 't-rta') drawUnified6ChRTA();
          if (activeMainTab.startsWith('t-out')) {
            let ch = parseInt(activeMainTab.replace('t-out','')) - 1;
            if (outSubTab[ch] === 0) drawGlobalOutPreview(ch);
            if (outSubTab[ch] === 1) drawEqGraph(ch, false);
          }
          if (activeMainTab === 't-inA' && inSubTab[0] === 1) drawEqGraph(0, true);
          if (activeMainTab === 't-inB' && inSubTab[1] === 1) drawEqGraph(1, true);
        }
      } else if (val.startsWith("A:")) {
        let halves = val.substring(2).split('|');
        if (halves.length === 2 && dspState.afs_f) {
          let f0 = halves[0].split(','), f1 = halves[1].split(',');
          for (let n = 0; n < 4; n++) {
            dspState.afs_f[0][n] = parseInt(f0[n]) || 0;
            dspState.afs_f[1][n] = parseInt(f1[n]) || 0;
            for (let c = 0; c < 2; c++) {
              let el = document.getElementById(`afs-badge-${c}-${n}`);
              if (el) {
                let f = dspState.afs_f[c][n];
                el.innerText = f === 0 ? '---' : f + 'Hz';
                el.style.color = f === 0 ? '#555' : 'var(--accent-red)';
              }
            }
          }
        }
      } else if (val.startsWith("J:{")) {
        jsonBuffer = val.substring(2);
        tryParseJsonBuffer();
      } else if (val.startsWith("J:")) {
        jsonBuffer += val.substring(2);
        tryParseJsonBuffer();
      } else {
        jsonBuffer += val;
        tryParseJsonBuffer();
      }
    }

    function tryParseJsonBuffer() {
      if(jsonBuffer.startsWith("{") && jsonBuffer.endsWith("}")) {
        try {
          let parsed = JSON.parse(jsonBuffer);
          Object.assign(dspState, parsed);
          ensureDspStateDefaults();
          for (let i = 0; i < 4; i++) {
            let m = dspState.firm[i] || 0;
            if (!(firUiTab[i] === 2 && loadedMeasurements[i].length > 0)) firUiTab[i] = m;
          }
          buildUI();
          isUiBuilt = true;
        } catch(e) { console.log("JSON Parse err", e); }
        jsonBuffer = "";
      }
    }

    /* --- PRESET EXPORT / IMPORT (Includes Custom FIR Taps & Curves!) --- */
    function exportPreset() {
      let exportData = Object.assign({}, dspState);
      delete exportData.peaks; delete exportData.comp_act; delete exportData.in_comp_act;
      exportData.custom_fir_taps = activeCustomFirTaps;
      exportData.custom_fir_db = activeInjectedFirDb;
      exportData.custom_fir_names = loadedFileNames;
      let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
      let dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr); dlAnchorElem.setAttribute("download", "frizh_preset.json");
      document.body.appendChild(dlAnchorElem); dlAnchorElem.click(); document.body.removeChild(dlAnchorElem);
    }

    function importPreset(event) {
      let file = event.target.files[0]; if (!file) return;
      let reader = new FileReader();
      reader.onload = async function(e) {
        try {
          let s = JSON.parse(e.target.result);
          if(confirm("Apply this preset file to the processor?")) {
            bleQueue = [];
            Object.assign(dspState, s);
            ensureDspStateDefaults();

            if(s.vA !== undefined) sendBLE(`/api/set?type=in&ch=0&p=gn&v=${s.vA}`);
            if(s.vB !== undefined) sendBLE(`/api/set?type=in&ch=1&p=gn&v=${s.vB}`);
            for(let i=0; i<2; i++) {
              if(s.idl) sendBLE(`/api/set?type=idl&ch=${i}&v=${s.idl[i]}`);
              if(s.gth) { sendBLE(`/api/set?type=gate&ch=${i}&p=thr&v=${s.gth[i]}`); sendBLE(`/api/set?type=gate&ch=${i}&p=atk&v=${s.gat[i]}`); sendBLE(`/api/set?type=gate&ch=${i}&p=rel&v=${s.gre[i]}`); }
              if(s.ict) { sendBLE(`/api/set?type=incomp&ch=${i}&p=thr&v=${s.ict[i]}`); sendBLE(`/api/set?type=incomp&ch=${i}&p=rat&v=${s.icr[i]}`); sendBLE(`/api/set?type=incomp&ch=${i}&p=mak&v=${s.icm[i]}`); sendBLE(`/api/set?type=incomp&ch=${i}&p=atk&v=${s.ica[i]}`); sendBLE(`/api/set?type=incomp&ch=${i}&p=rel&v=${s.icrel[i]}`); }
              if(s.bbe_e) { sendBLE(`/api/set?type=bbe&ch=${i}&p=e&v=${s.bbe_e[i]}`); sendBLE(`/api/set?type=bbe&ch=${i}&p=l&v=${s.bbe_l[i]}`); sendBLE(`/api/set?type=bbe&ch=${i}&p=p&v=${s.bbe_p[i]}`); }
              if(s.afs_e) { sendBLE(`/api/set?type=afs&ch=${i}&p=e&v=${s.afs_e[i]}`); sendBLE(`/api/set?type=afs&ch=${i}&p=s&v=${s.afs_s[i]}`); }
              if(s.deq_e) { sendBLE(`/api/set?type=deq&ch=${i}&p=e&v=${s.deq_e[i]}`); for(let b=0; b<3; b++) { sendBLE(`/api/set?type=deq&ch=${i}&p=f&b=${b}&v=${s.deq_f[i][b]}`); sendBLE(`/api/set?type=deq&ch=${i}&p=d&b=${b}&v=${s.deq_d[i][b]}`); sendBLE(`/api/set?type=deq&ch=${i}&p=q&b=${b}&v=${s.deq_q[i][b]}`); sendBLE(`/api/set?type=deq&ch=${i}&p=r&b=${b}&v=${s.deq_r[i][b]}`); sendBLE(`/api/set?type=deq&ch=${i}&p=t&b=${b}&v=${s.deq_t[i][b]}`); } }
              if(s.ieqb) { sendBLE(`/api/set?type=ineqb&ch=${i}&p=v&v=${s.ieqb[i]}`); for(let b=0; b<7; b++) { sendBLE(`/api/set?type=ineq&ch=${i}&p=f&b=${b}&v=${s.ieqf[i][b]}`); sendBLE(`/api/set?type=ineq&ch=${i}&p=g&b=${b}&v=${s.ieqg[i][b]}`); sendBLE(`/api/set?type=ineq&ch=${i}&p=q&b=${b}&v=${s.ieqq[i][b]}`); if(s.ieqt) sendBLE(`/api/set?type=ineq&ch=${i}&p=t&b=${b}&v=${s.ieqt[i][b]}`); } }
            }
            for(let i=0; i<4; i++) {
              if(s.rt) sendBLE(`/api/set?type=rt&ch=${i}&v=${s.rt[i]}`);
              if(s.ph) sendBLE(`/api/set?type=ph&ch=${i}&v=${s.ph[i]}`);
              if(s.dl) sendBLE(`/api/set?type=dl&ch=${i}&v=${s.dl[i]}`);
              if(s.xt) { sendBLE(`/api/set?type=xo&ch=${i}&p=t&v=${s.xt[i]}`); sendBLE(`/api/set?type=xo&ch=${i}&p=th&v=${s.xth[i]}`); sendBLE(`/api/set?type=xo&ch=${i}&p=fl&v=${s.xfl[i]}`); sendBLE(`/api/set?type=xo&ch=${i}&p=fh&v=${s.xfh[i]}`); sendBLE(`/api/set?type=xo&ch=${i}&p=g&v=${s.xo_gn[i]}`); }
              if(s.apfe) { sendBLE(`/api/set?type=apf&ch=${i}&p=e&v=${s.apfe[i]}`); sendBLE(`/api/set?type=apf&ch=${i}&p=f&v=${s.apff[i]}`); sendBLE(`/api/set?type=apf&ch=${i}&p=q&v=${s.apfq[i]}`); if(s.apfm) sendBLE(`/api/set?type=apf&ch=${i}&p=m&v=${s.apfm[i]}`); if(s.apfd) sendBLE(`/api/set?type=apf&ch=${i}&p=d&v=${s.apfd[i]}`); }
              if(s.firt) sendBLE(`/api/set?type=fir&ch=${i}&p=t&v=${s.firt[i]}`);
              if(s.firm) { sendBLE(`/api/set?type=fir&ch=${i}&p=m&v=${s.firm[i]}`); firUiTab[i] = s.firm[i]; }
              if(s.custom_fir_db && s.custom_fir_db[i]) { activeInjectedFirDb[i] = s.custom_fir_db[i].slice(0,257); previewFirMagDb[i] = [...activeInjectedFirDb[i]]; }
              if(s.custom_fir_names && s.custom_fir_names[i]) loadedFileNames[i] = s.custom_fir_names[i];
              if(s.custom_fir_taps && s.custom_fir_taps[i] && s.custom_fir_taps[i].length > 0) {
                activeCustomFirTaps[i] = s.custom_fir_taps[i];
                if(s.firm && s.firm[i] === 2) {
                  let tLen = (s.firt && s.firt[i] === 1) ? 512 : 256;
                  await uploadTapsToEsp32(i, activeCustomFirTaps[i], tLen);
                }
              }
              if(s.eqb) { sendBLE(`/api/set?type=eqb&ch=${i}&p=v&v=${s.eqb[i]}`); for(let b=0; b<7; b++) { sendBLE(`/api/set?type=eq&ch=${i}&p=f&b=${b}&v=${s.eqf[i][b]}`); sendBLE(`/api/set?type=eq&ch=${i}&p=g&b=${b}&v=${s.eq_gn[i][b]}`); sendBLE(`/api/set?type=eq&ch=${i}&p=q&b=${b}&v=${s.eqq[i][b]}`); if(s.eqt) sendBLE(`/api/set?type=eq&ch=${i}&p=t&b=${b}&v=${s.eqt[i][b]}`); } }
              if(s.ct) { sendBLE(`/api/set?type=comp&ch=${i}&p=thr&v=${s.ct[i]}`); sendBLE(`/api/set?type=comp&ch=${i}&p=rat&v=${s.cr[i]}`); sendBLE(`/api/set?type=comp&ch=${i}&p=mak&v=${s.cm[i]}`); sendBLE(`/api/set?type=comp&ch=${i}&p=atk&v=${s.ca[i]}`); sendBLE(`/api/set?type=comp&ch=${i}&p=rel&v=${s.crel[i]}`); }
            }
            buildUI();
            setTimeout(() => sendBLE('/api/dump'), 2500);
          }
        } catch(err) { alert("Invalid Preset JSON file."); }
        event.target.value = '';
      };
      reader.readAsText(file);
    }
    /* --- NAVIGATION & CONTEXTUAL SUB-TABS --- */
    function switchTab(id) {
      activeMainTab = id;
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      let panel = document.getElementById(id);
      if (panel) panel.classList.add('active');
      let tabBtn = document.getElementById('tab-' + id.substring(2));
      if (tabBtn) tabBtn.classList.add('active');
      renderSubSidebar();
      setTimeout(() => redrawActiveTabCanvases(), 30);
    }

    function renderSubSidebar() {
      let sb = document.getElementById('sub-sidebar');
      if (!sb) return;
      let isIn = (activeMainTab === 't-inA' || activeMainTab === 't-inB');
      let isOut = activeMainTab.startsWith('t-out');
      if (!isIn && !isOut) {
        sb.classList.remove('visible');
        sb.innerHTML = '';
        return;
      }
      sb.classList.add('visible');
      let ch = isIn ? (activeMainTab === 't-inA' ? 0 : 1) : (parseInt(activeMainTab.replace('t-out', '')) - 1);
      let labels = isIn ? IN_SUB_LABELS : OUT_SUB_LABELS;
      let curSub = isIn ? inSubTab[ch] : outSubTab[ch];
      let accent = isIn ? (ch === 0 ? '#00ADB5' : '#ff9800') : ['#00ADB5', '#ff9800', '#e040fb', '#69f0ae'][ch];

      sb.innerHTML = labels.map((lbl, idx) => {
        let sel = (curSub === idx);
        let st = sel ? `background:${accent}33; border-color:${accent}; color:#fff;` : '';
        return `<div class="sub-tab-btn ${sel ? 'active' : ''}" style="${st}" onclick="selectSubTab(${isIn}, ${ch}, ${idx})">${lbl}</div>`;
      }).join('');
    }

    function selectSubTab(isIn, ch, idx) {
      if (isIn) inSubTab[ch] = idx;
      else outSubTab[ch] = idx;
      renderSubSidebar();
      buildUI();
      setTimeout(() => redrawActiveTabCanvases(), 30);
    }

    function redrawActiveTabCanvases() {
      if (activeMainTab === 't-monitor') updateMonitorMeters();

    /* --- DSP MATH HELPERS (PEAKING / LOW-SHELF / HIGH-SHELF + FIR) --- */
    function evalEqBandDb(type, f, f0, q, gain) {
      if (gain === 0) return 0;
      let logRatio = Math.log10(f / f0);
      if (type === 0) {
        return gain * Math.exp(-Math.pow(logRatio * q * 2.8, 2));
      } else if (type === 1) {
        let slope = Math.max(1.5, Math.min(18.0, q * 6.5));
        return gain / (1.0 + Math.exp(logRatio * slope));
      } else {
        let slope = Math.max(1.5, Math.min(18.0, q * 6.5));
        return gain / (1.0 + Math.exp(-logRatio * slope));
      }
    }

    function getChannelTaps(ch) {
      return (dspState.firt && dspState.firt[ch] === 1) ? 512 : 256;
    }

    function getInjectedFirGainAt(ch, f) {
      if (!dspState.firm || dspState.firm[ch] !== 2) return 0.0;
      let taps = getChannelTaps(ch);
      let halfN = taps >> 1;
      let binFloat = Math.max(0, Math.min(halfN, (f * taps) / 48000.0));
      let b0 = Math.floor(binFloat);
      let b1 = Math.min(halfN, Math.ceil(binFloat));
      let frac = binFloat - b0;
      return activeInjectedFirDb[ch][b0] + frac * (activeInjectedFirDb[ch][b1] - activeInjectedFirDb[ch][b0]);
    }

    function interpolateMeas(pts, f) {
      if (!pts || pts.length === 0) return { m: 0, p: 0, c: 1 };
      if (f <= pts[0].f) return pts[0];
      if (f >= pts[pts.length - 1].f) return pts[pts.length - 1];
      for (let i = 0; i < pts.length - 1; i++) {
        let f0 = pts[i].f, f1 = pts[i + 1].f;
        if (f >= f0 && f <= f1) {
          let t = (f1 - f0) > 1e-6 ? (f - f0) / (f1 - f0) : 0;
          let m = pts[i].m + t * (pts[i + 1].m - pts[i].m);
          let p0 = pts[i].p, p1 = pts[i + 1].p;
          let dp = p1 - p0;
          if (dp > 180) dp -= 360;
          if (dp < -180) dp += 360;
          let p = p0 + t * dp;
          let c = pts[i].c + t * (pts[i + 1].c - pts[i].c);
          return { m, p, c };
        }
      }
      return pts[pts.length - 1];
    }

    function getPassbandAverageDb(ch) {
      let pts = loadedMeasurements[ch];
      if (!pts || pts.length === 0) return 0;
      let sum = 0, wSum = 0;
      for (let pt of pts) {
        if (pt.f >= firMinFreq[ch] && pt.f <= firMaxFreq[ch]) {
          sum += pt.m * pt.c;
          wSum += pt.c;
        }
      }
      return wSum > 0 ? (sum / wSum) : 0;
    }

    function computeFirPreview(ch) {
      if (!loadedMeasurements[ch] || loadedMeasurements[ch].length === 0) return;
      let taps = getChannelTaps(ch);
      let halfN = taps >> 1;
      let avgDb = getPassbandAverageDb(ch);
      let minF = firMinFreq[ch], maxF = firMaxFreq[ch];
      let maxB = firMaxBoost[ch], maxC = firMaxCut[ch];
      let rawCorr = new Array(257).fill(0);

      for (let k = 1; k <= halfN; k++) {
        let f = (k * 48000.0) / taps;
        if (f < minF || f > maxF) continue;
        let m = interpolateMeas(loadedMeasurements[ch], f);
        let relDb = m.m - avgDb;
        let corrDb = Math.max(maxC, Math.min(maxB, -relDb * m.c * m.c));
        if (f < minF * 1.25) corrDb *= Math.max(0, Math.min(1, (f - minF) / (minF * 0.25)));
        else if (f > maxF * 0.8) corrDb *= Math.max(0, Math.min(1, (maxF - f) / (maxF * 0.2)));
        rawCorr[k] = corrDb;
      }
      previewFirMagDb[ch] = new Array(257).fill(0);
      for (let k = 1; k <= halfN; k++) {
        let prev = rawCorr[Math.max(0, k - 1)];
        let curr = rawCorr[k];
        let next = rawCorr[Math.min(halfN, k + 1)];
        previewFirMagDb[ch][k] = 0.25 * prev + 0.5 * curr + 0.25 * next;
      }
    }

    async function uploadTapsToEsp32(ch, taps, targetTaps) {
      if (isUploadingFir[ch]) return false;
      let N = targetTaps || getChannelTaps(ch);
      isUploadingFir[ch] = true;
      firUploadProgress[ch] = 0;

      let cleanTaps = taps.slice(0, N);
      while (cleanTaps.length < N) cleanTaps.push(0.0);

      let peakEnergy = 0;
      for (let v of cleanTaps) peakEnergy += v * v;
      let rmsGain = Math.sqrt(peakEnergy);
      if (rmsGain > 4.0) {
        for (let i = 0; i < N; i++) cleanTaps[i] /= (rmsGain / 2.0);
      }

      for (let idx = 0; idx < N; idx += 32) {
        let chunkStr = cleanTaps.slice(idx, Math.min(idx + 32, N)).map(e => e.toFixed(6)).join(',');
        let nParam = (idx === 0) ? `&n=${N}` : '';
        sendBLE(`/api/fir?ch=${ch}&idx=${idx}${nParam}&t=${chunkStr}`);
        firUploadProgress[ch] = Math.min(1.0, (idx + 32) / N);
        let progEl = document.getElementById(`fir-prog-txt-${ch}`);
        if (progEl) progEl.innerText = `Injecting ${N} Taps... ${Math.round(firUploadProgress[ch] * 100)}%`;
        await new Promise(r => setTimeout(r, 55));
      }

      activeCustomFirTaps[ch] = [...cleanTaps];
      dspState.firm[ch] = 2;
      dspState.firt[ch] = (N === 512) ? 1 : 0;
      firUiTab[ch] = 2;
      isUploadingFir[ch] = false;
      buildUI();
      setTimeout(() => redrawActiveTabCanvases(), 30);
      return true;
    }

    async function synthesizeAndInjectAutoFir(ch) {
      if (!loadedMeasurements[ch] || loadedMeasurements[ch].length === 0) return;
      computeFirPreview(ch);
      let N = getChannelTaps(ch);
      let halfN = N >> 1;
      let minF = firMinFreq[ch], maxF = firMaxFreq[ch];
      let usePhase = firCorrectPhase[ch];

      let magLin = new Array(halfN + 1).fill(1.0);
      let phaseRad = new Array(halfN + 1).fill(0.0);
      for (let k = 1; k <= halfN; k++) {
        let f = (k * 48000.0) / N;
        magLin[k] = Math.pow(10.0, previewFirMagDb[ch][k] / 20.0);
        if (usePhase && f >= minF && f <= maxF) {
          let m = interpolateMeas(loadedMeasurements[ch], f);
          phaseRad[k] = -(m.p * Math.PI / 180.0) * m.c;
        }
      }

      let taps = new Array(N).fill(0.0);
      let center = (N - 1) / 2.0;
      for (let n = 0; n < N; n++) {
        let m = n - center;
        let sum = magLin[0];
        for (let k = 1; k < halfN; k++) {
          sum += 2.0 * magLin[k] * Math.cos((2.0 * Math.PI * k * m / N) + phaseRad[k]);
        }
        sum += magLin[halfN] * Math.cos(Math.PI * m);
        let h = sum / N;
        let wNorm = (2.0 * Math.PI * n) / (N - 1);
        let win = 0.35875 - 0.48829 * Math.cos(wNorm) + 0.14128 * Math.cos(2.0 * wNorm) - 0.01168 * Math.cos(3.0 * wNorm);
        taps[n] = h * win;
      }

      let ok = await uploadTapsToEsp32(ch, taps, N);
      if (ok) activeInjectedFirDb[ch] = [...previewFirMagDb[ch]];
    }

    function triggerFirFilePicker(ch) {
      pendingFirFileCh = ch;
      document.getElementById('fir-file-input').click();
    }

    function parseMeasurementFileText(content) {
      let meas = [], rawTaps = [];
      for (let line of content.split(/[\r\n]+/)) {
        let clean = line.trim();
        if (!clean || clean.startsWith('#') || clean.startsWith('//') || clean.toLowerCase().includes('frequency') || clean.toLowerCase().includes('huper') || clean.includes('*')) continue;
        let cols = clean.split(/[\t,; ]+/);
        if (cols.length >= 2) {
          let f = parseFloat(cols[0]), m = parseFloat(cols[1]);
          let p = cols.length >= 3 ? (parseFloat(cols[2]) || 0) : 0;
          let c = cols.length >= 4 ? (parseFloat(cols[3]) || 1) : 1;
          if (!isNaN(f) && !isNaN(m) && f >= 10 && f <= 24000) {
            meas.push({ f, m, p, c: Math.max(0, Math.min(1, c)) });
          }
        } else if (cols.length === 1) {
          let tap = parseFloat(cols[0]);
          if (!isNaN(tap)) rawTaps.push(tap);
        }
      }
      return { meas, rawTaps };
    }

    function handleFirFileSelect(event) {
      let file = event.target.files[0]; if (!file) return;
      let ch = pendingFirFileCh;
      let reader = new FileReader();
      reader.onload = async function(e) {
        let { meas, rawTaps } = parseMeasurementFileText(e.target.result);
        if (meas.length >= 16) {
          meas.sort((a, b) => a.f - b.f);
          loadedMeasurements[ch] = meas;
          loadedFileNames[ch] = file.name;
          firUiTab[ch] = 2;
          if (dspState.xt[ch] > 0) firMinFreq[ch] = Math.max(20, Math.min(10000, dspState.xfl[ch]));
          if (dspState.xth[ch] > 0) firMaxFreq[ch] = Math.max(firMinFreq[ch] + 50, Math.min(20000, dspState.xfh[ch]));
          computeFirPreview(ch);
          buildUI();
          setTimeout(() => redrawActiveTabCanvases(), 30);
        } else if (rawTaps.length > 0) {
          let tLen = rawTaps.length > 256 ? 512 : 256;
          dspState.firt[ch] = (tLen === 512) ? 1 : 0;
          sendBLE(`/api/set?type=fir&ch=${ch}&p=t&v=${dspState.firt[ch]}`);
          loadedFileNames[ch] = `${file.name} (${tLen} Taps)`;
          firUiTab[ch] = 2;
          await uploadTapsToEsp32(ch, rawTaps, tLen);
        } else {
          alert("Unrecognized measurement or FIR file format.");
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    async function fit7BandEqForChannel(ch, meas, refDb, minF, maxF, maxBoost, maxCut, useTargetCurve) {
      if (dspState.eqb[ch] === 1) {
        dspState.eqb[ch] = 0;
        sendBLE(`/api/set?type=eqb&ch=${ch}&p=v&v=0`);
      }
      let chOutGain = useTargetCurve ? dspState.xo_gn[ch] : 0;
      let gridF = Array.from({length: 60}, (_, i) => minF * Math.pow(maxF / minF, i / 59.0));
      let targetErr = gridF.map(f => {
        let m = interpolateMeas(meas, f);
        let tDb = useTargetCurve ? getWizardTargetGainAt(f) : 0;
        let raw = (tDb - ((m.m - refDb) + chOutGain)) * m.c;
        return Math.max(maxCut, Math.min(maxBoost, raw));
      });

      let bands = [];
      for (let b = 0; b < 7; b++) {
        let bestIdx = 0, maxAbs = 0;
        for (let i = 0; i < 60; i++) {
          if (Math.abs(targetErr[i]) > maxAbs) { maxAbs = Math.abs(targetErr[i]); bestIdx = i; }
        }
        if (maxAbs < 0.8) { bands.push({ f: 1000, g: 0, q: 1.41 }); continue; }
        let f0 = gridF[bestIdx];
        let gainInt = Math.max(-12, Math.min(12, Math.round(targetErr[bestIdx])));
        let left = bestIdx, right = bestIdx;
        while (left > 0 && (targetErr[left] * gainInt) > (maxAbs * 0.5)) left--;
        while (right < 59 && (targetErr[right] * gainInt) > (maxAbs * 0.5)) right++;
        let octaves = Math.max(0.25, Math.min(2.0, Math.log2(gridF[right] / gridF[left])));
        let q = parseFloat(Math.max(0.7, Math.min(4.5, 1.4 / octaves)).toFixed(1));
        bands.push({ f: Math.max(20, Math.min(20000, Math.round(f0))), g: gainInt, q });
        for (let i = 0; i < 60; i++) {
          let logRatio = Math.log10(gridF[i] / f0);
          targetErr[i] -= gainInt * Math.exp(-Math.pow(logRatio * q * 2.8, 2));
        }
      }
      bands.sort((a, b) => a.f - b.f);
      for (let b = 0; b < 7; b++) {
        dspState.eqt[ch][b] = 0;
        dspState.eqf[ch][b] = bands[b].f;
        dspState.eq_gn[ch][b] = bands[b].g;
        dspState.eqq[ch][b] = bands[b].q;
        sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=t&v=0`);
        sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=f&v=${bands[b].f}`);
        sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=g&v=${bands[b].g}`);
        sendBLE(`/api/set?type=eq&ch=${ch}&b=${b}&p=q&v=${bands[b].q}`);
        await new Promise(r => setTimeout(r, 90));
      }
    }

    async function autoFitPeqFromMeasurement(ch) {
      if (!loadedMeasurements[ch] || loadedMeasurements[ch].length === 0) return;
      let avgDb = getPassbandAverageDb(ch);
      await fit7BandEqForChannel(ch, loadedMeasurements[ch], avgDb, Math.max(30, firMinFreq[ch]), Math.min(18000, firMaxFreq[ch]), Math.min(12, firMaxBoost[ch]), Math.max(-12, firMaxCut[ch]), false);
      buildUI();
      alert(`Output ${ch + 1}: 7-Band Parametric EQ Auto-Fitted!`);
    }

    /* --- FRIZH FIR 4-WAY SMART AUTO-TUNE WIZARD ENGINE --- */
    function applyWizardTargetPreset(idx) {
      wizardActivePreset = idx;
      if (idx === 0) wizardTargetGains = [0, 0, 0, 0, 0, 0, 0];
      else if (idx === 1) wizardTargetGains = [5.5, 6.5, -2.5, 0.5, 3.5, 3.0, 1.5]; // DANGDUT
      else if (idx === 2) wizardTargetGains = [4.5, 4.0, -1.5, 0.5, 2.0, 1.5, 0.0]; // LIVE BAND
      else if (idx === 3) wizardTargetGains = [2.0, 2.5, -1.0, 0.5, 1.5, 2.5, 2.0]; // LIVE ACOUSTIC
      else if (idx === 4) wizardTargetGains = [4.5, 3.5, 0.0, 0.0, 1.0, 0.5, -2.0]; // LIVE PA
      else if (idx === 5) wizardTargetGains = [6.0, 4.5, 1.0, -1.5, 0.0, 2.0, 1.0]; // CLUB / DJ
      else if (idx === 6) wizardTargetGains = [8.0, 5.5, -1.0, 0.0, 2.5, 2.0, 0.0]; // SUB MONSTER
      buildUI();
      setTimeout(() => drawFrizhWizardGraph(), 20);
    }

    function getWizardTargetGainAt(f) {
      if (f <= wizardTargetFreqs[0]) return wizardTargetGains[0];
      if (f >= wizardTargetFreqs[6]) return wizardTargetGains[6];
      let logF = Math.log(f);
      for (let i = 0; i < 6; i++) {
        let f0 = wizardTargetFreqs[i], f1 = wizardTargetFreqs[i + 1];
        if (f >= f0 && f <= f1) {
          let t = (logF - Math.log(f0)) / (Math.log(f1) - Math.log(f0));
          let smoothT = (1.0 - Math.cos(t * Math.PI)) * 0.5;
          return wizardTargetGains[i] + smoothT * (wizardTargetGains[i + 1] - wizardTargetGains[i]);
        }
      }
      return 0;
    }

    function getWizardGlobalRefLevel() {
      if (!wizardMeasurement || wizardMeasurement.length === 0) return 0;
      let sum = 0, wSum = 0;
      for (let pt of wizardMeasurement) {
        if (pt.f >= 100 && pt.f <= 8000) { sum += pt.m * pt.c; wSum += pt.c; }
      }
      return wSum > 0 ? (sum / wSum) : 0;
    }

    function handleWizardFileSelect(event) {
