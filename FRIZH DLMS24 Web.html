<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRIZH DLMS 24 - Pro Console</title>
  <style>
    /* PROFESSIONAL DESKTOP THEME */
    :root {
      --bg-dark: #0f1115;
      --bg-panel: #181a20;
      --bg-card: #22252e;
      --accent: #00ADB5;
      --accent-hover: #00e5ff;
      --text-main: #e2e8f0;
      --text-dim: #94a3b8;
      --border-color: #334155;
      --red-alert: #f43f5e;
      --orange-warn: #f59e0b;
    }

    body { margin: 0; padding: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR NAVIGATION */
    .sidebar { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
    .brand { padding: 25px 20px; font-size: 24px; font-weight: 800; letter-spacing: 3px; color: var(--accent); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
    
    .nav-tabs { flex: 1; overflow-y: auto; padding: 15px 0; }
    .nav-item { padding: 12px 25px; cursor: pointer; color: var(--text-dim); font-size: 13px; font-weight: 600; letter-spacing: 1px; transition: 0.2s; border-left: 3px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,0.02); color: var(--text-main); }
    .nav-item.active { background: rgba(0, 173, 181, 0.1); color: var(--accent); border-left-color: var(--accent); }
    
    .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); }
    .btn-connect { width: 100%; padding: 12px; border: 1px solid var(--border-color); background: transparent; color: var(--text-dim); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-connect.connected { background: rgba(0, 173, 181, 0.1); color: var(--accent); border-color: var(--accent); }
    .btn-connect:hover { border-color: var(--accent); color: var(--accent); }

    /* MAIN CONTENT AREA */
    .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header-bar { height: 60px; border-bottom: 1px solid var(--border-color); background: var(--bg-panel); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; flex-shrink: 0; }
    .page-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    
    .content-area { flex: 1; overflow-y: auto; padding: 30px; }
    .panel { display: none; animation: fadeIn 0.2s ease-out; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* DSP CARDS & GRIDS */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .dsp-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
    .card-header { background: rgba(0,0,0,0.2); padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--text-dim); }
    .card-body { padding: 20px; }
    .bypassed .card-body { opacity: 0.4; pointer-events: none; }
    
    /* SLIDERS & CONTROLS */
    .control-group { margin-bottom: 15px; }
    .control-group:last-child { margin-bottom: 0; }
    label { font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .val-display { color: var(--accent); font-family: monospace; font-size: 12px; }
    
    .slider-wrap { display: flex; align-items: center; gap: 10px; }
    input[type=range] { flex: 1; margin: 0; cursor: pointer; accent-color: var(--accent); height: 4px; background: #000; border-radius: 2px; -webkit-appearance: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; border: 2px solid var(--accent); }
    .btn-fine { background: var(--bg-panel); color: var(--text-dim); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; width: 28px; height: 28px; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .btn-fine:hover { color: var(--accent); border-color: var(--accent); }

    select, .txt-input { width: 100%; padding: 10px; background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; outline: none; box-sizing: border-box; }
    select:focus, .txt-input:focus { border-color: var(--accent); }

    /* BUTTONS */
    .btn-action { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); }
    .btn-action.active { background: rgba(0, 173, 181, 0.1); border-color: var(--accent); color: var(--accent); }
    .btn-mute { background: rgba(244, 63, 94, 0.1); border: 1px solid var(--red-alert); color: var(--red-alert); }
    .btn-mute.active { background: var(--red-alert); color: #fff; box-shadow: 0 0 10px rgba(244,63,94,0.4); }

    /* BAND TABS */
    .band-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; }
    .band-tab { padding: 8px 16px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 4px; font-size: 11px; font-weight: bold; color: var(--text-dim); cursor: pointer; transition: 0.2s; }
    .band-tab.active { background: rgba(0, 173, 181, 0.15); border-color: var(--accent); color: var(--accent); }

    /* CANVAS GRAPHS */
    .canvas-container { position: relative; width: 100%; height: 220px; background: #000; border-radius: 6px; border: 1px solid var(--border-color); overflow: hidden; cursor: crosshair; }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* VU METERS */
    .pro-meters-grid { display: flex; justify-content: center; gap: 30px; height: 100%; min-height: 400px; padding: 20px; }
    .meter-wrapper { display: flex; flex-direction: column; align-items: center; width: 60px; }
    .meter-title { font-size: 12px; font-weight: 800; color: var(--text-dim); margin-bottom: 15px; text-align: center; }
    .meter-row { display: flex; align-items: flex-end; gap: 4px; height: 100%; flex: 1; }
    .db-scale-container { position: relative; height: 100%; width: 24px; }
    .db-scale-container span { position: absolute; right: 4px; font-size: 10px; font-weight: bold; font-family: monospace; transform: translateY(-50%); }
    .db-val-0 { top: 0%; color: var(--red-alert); } .db-val-m10 { top: 16.6%; color: var(--orange-warn); } .db-val-m20 { top: 33.3%; color: #4ade80; } .db-val-m40 { top: 66.6%; color: var(--text-dim); } .db-val-m60 { top: 100%; color: #475569; }
    .pro-meter-container { width: 30px; height: 100%; background: #000; border: 1px solid #111; position: relative; }
    .pro-meter-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #166534 0%, #22c55e 60%, #facc15 80%, #ef4444 100%); transition: height 0.08s ease-out; }
    .led { margin-top: 8px; width: 100%; text-align: center; padding: 4px 0; border-radius: 3px; font-size: 9px; font-weight: 800; color: #444; background: #111; border: 1px solid #222; transition: 0.1s; }
    .led-comp.active { background: var(--orange-warn); color: #000; box-shadow: 0 0 10px var(--orange-warn); }
    .led-mute.active { background: var(--red-alert); color: #fff; box-shadow: 0 0 10px var(--red-alert); }
    .led-clip.active { background: var(--red-alert); color: #fff; box-shadow: 0 0 10px var(--red-alert); }

    /* BLE DIALOG */
    #ble-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .ble-dialog { background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .ble-dialog h3 { margin: 0 0 10px 0; color: var(--accent); }
    .ble-dialog p { color: var(--text-dim); font-size: 13px; margin-bottom: 25px; }
  </style>
</head>
<body>

  <!-- BLE CONNECT DIALOG -->
  <div id="ble-dialog-overlay">
    <div class="ble-dialog">
      <h3>DEVICE CONNECTION</h3>
      <p id="ble-connected-name">Status: Disconnected</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="btn-action" style="background: var(--accent); color: #000;" onclick="connectBLE()">SCAN / CONNECT</button>
        <button class="btn-action" onclick="disconnectBLE()">DISCONNECT</button>
        <button class="btn-action" style="background: transparent;" onclick="closeBleDialog()">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR NAVIGATION -->
  <div class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-9 5 18 3-9h5"/></svg>
      FRIZH
    </div>
    <div class="nav-tabs" id="tabs">
      <div class="nav-item active" id="tab-meters" onclick="switchTab('t-meters')">MONITOR</div>
      <div class="nav-item" id="tab-rta" onclick="switchTab('t-rta')">RTA SPECTRUM</div>
      <div style="margin: 15px 25px 5px; font-size: 10px; color: var(--text-dim); font-weight: bold;">INPUTS</div>
      <div class="nav-item" id="tab-inA" onclick="switchTab('t-inA')">IN A</div>
      <div class="nav-item" id="tab-inB" onclick="switchTab('t-inB')">IN B</div>
      <div style="margin: 15px 25px 5px; font-size: 10px; color: var(--text-dim); font-weight: bold;">OUTPUTS</div>
      <div class="nav-item" id="tab-out1" onclick="switchTab('t-out1')">OUT 1</div>
      <div class="nav-item" id="tab-out2" onclick="switchTab('t-out2')">OUT 2</div>
      <div class="nav-item" id="tab-out3" onclick="switchTab('t-out3')">OUT 3</div>
      <div class="nav-item" id="tab-out4" onclick="switchTab('t-out4')">OUT 4</div>
      <div style="margin: 15px 25px 5px; font-size: 10px; color: var(--text-dim); font-weight: bold;">CONFIG</div>
      <div class="nav-item" id="tab-sys" onclick="switchTab('t-sys')">SYSTEM SETUP</div>
    </div>
    <div class="sidebar-footer">
      <button id="ble-btn" class="btn-connect" onclick="document.getElementById('ble-dialog-overlay').style.display='flex'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline></svg>
        <span id="ble-btn-text">CONNECT</span>
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-container">
    <div class="header-bar">
      <div class="page-title" id="page-title">SYSTEM MONITOR</div>
      <div id="top-actions"></div>
    </div>

    <div class="content-area">
      <div id="t-meters" class="panel active"><div id="meter-grid"></div></div>
      <div id="t-rta" class="panel">
        <div class="dsp-card"><div class="card-header">INPUT A RTA</div><div class="card-body"><div class="canvas-container"><canvas id="cvs-rta-A"></canvas></div></div></div>
        <div class="dsp-card"><div class="card-header">INPUT B RTA</div><div class="card-body"><div class="canvas-container"><canvas id="cvs-rta-B"></canvas></div></div></div>
      </div>
      <div id="t-inA" class="panel"><div id="ui-inA"></div></div>
      <div id="t-inB" class="panel"><div id="ui-inB"></div></div>
      <div id="t-out1" class="panel"><div id="ui-out0"></div></div>
      <div id="t-out2" class="panel"><div id="ui-out1"></div></div>
      <div id="t-out3" class="panel"><div id="ui-out2"></div></div>
      <div id="t-out4" class="panel"><div id="ui-out3"></div></div>
      <div id="t-sys" class="panel"><div id="ui-sys"></div></div>
    </div>
  </div>

  <script>
    // --- GLOBAL DSP STATE ---
    let dspState = {};
    let timers = {};
    let livePeaks = [0,0,0,0,0,0]; 
    let compAct = [0,0,0,0], inCompAct = [0,0];
    let rtaA = new Array(31).fill(-60.0), rtaB = new Array(31).fill(-60.0);
    
    // UI Local State
    let activeDeqBand = [0, 0];
    let activeEqBand = [0, 0, 0, 0];

    // Dragging Logic State
    let dragObj = { active: false, cvs: null, ch: null, isDeq: false, band: null };

    // BLE Variables
    let bleDevice, bleServer, bleService, rxChar, txChar, bleQueue = [], isWriting = false, jsonBuffer = "";

    function closeBleDialog() { document.getElementById('ble-dialog-overlay').style.display = 'none'; }
    function disconnectBLE() { if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect(); closeBleDialog(); }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'FRIZH_DLMS24_' }], 
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });
        
        bleDevice.addEventListener('gattserverdisconnected', () => { 
            let b = document.getElementById('ble-btn');
            b.classList.remove('connected');
            document.getElementById('ble-btn-text').innerText = "CONNECT";
            document.getElementById('ble-connected-name').innerText = "Status: Disconnected";
        });

        bleServer = await bleDevice.gatt.connect();
        bleService = await bleServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
        rxChar = await bleService.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
        txChar = await bleService.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
        
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleNotifications);
        
        let b = document.getElementById('ble-btn');
        b.classList.add('connected');
        document.getElementById('ble-btn-text').innerText = "CONNECTED";
        document.getElementById('ble-connected-name').innerText = "Connected to:\n" + bleDevice.name;
        closeBleDialog(); 

        sendBLE('/api/dump');
      } catch(e) { console.error("BLE Error:", e); }
    }

    async function processBleQueue() {
      if(isWriting || bleQueue.length === 0 || !rxChar) return;
      isWriting = true;
      let cmd = bleQueue.shift();
      try { await rxChar.writeValueWithoutResponse(new TextEncoder().encode(cmd)); } catch(e) {}
      isWriting = false;
      setTimeout(processBleQueue, 15);
    }
    function sendBLE(cmd) { bleQueue.push(cmd); processBleQueue(); }

    // --- JSON AND STATUS HANDLING ---
    function handleNotifications(event) {
      let val = new TextDecoder().decode(event.target.value);
      if(val.startsWith("S:")) {
        let p = val.substring(2).split(',');
        if(p.length >= 18) {
            for(let i=0; i<6; i++) {
                livePeaks[i] = parseFloat(p[i]) || 1e-9;
                if(document.getElementById('t-meters').classList.contains('active')) {
                    let db = 20 * Math.log10(livePeaks[i]) - 3.0;
                    let pct = Math.max(0, Math.min(100, (db + 60) * (100 / 60))); 
                    let mtr = document.getElementById(`mtr-${i}`);
                    if(mtr) mtr.style.height = pct + '%';
                    let clipLed = document.getElementById(`ind-clip-${i}`);
                    if(clipLed) clipLed.classList.toggle('active', db >= -3.5); 
                }
            }
            if (dspState.in_mute !== undefined) {
              for(let i=0; i<2; i++) {
                dspState.in_mute[i] = (p[6+i] === '1');
                inCompAct[i] = parseInt(p[16+i]);
                let muteLed = document.getElementById(`ind-mute-${i}`);
                if(muteLed) muteLed.classList.toggle('active', dspState.in_mute[i]);
              }
              for(let i=0; i<4; i++) {
                dspState.out_mute[i] = (p[8+i] === '1');
                compAct[i] = parseInt(p[12+i]);
                let muteLed = document.getElementById(`ind-mute-${i+2}`);
                if(muteLed) muteLed.classList.toggle('active', dspState.out_mute[i]);
              }
            }
            drawCompVisualizers();
        }
      } else if (val.startsWith("R:")) {
        let halves = val.substring(2).split('|');
        if (halves.length === 2) {
          let aVals = halves[0].split(','); let bVals = halves[1].split(',');
          for (let i = 0; i < 31; i++) {
            if (aVals[i] !== "") { let r = parseFloat(aVals[i]); rtaA[i] = r > rtaA[i] ? r : Math.max(-60, rtaA[i] - 1.5); }
            if (bVals[i] !== "") { let r = parseFloat(bVals[i]); rtaB[i] = r > rtaB[i] ? r : Math.max(-60, rtaB[i] - 1.5); }
          }
          drawRTA();
        }
      } else if (val.startsWith("J:{")) { jsonBuffer = val.substring(2);
      } else if (val.startsWith("J:")) {
        jsonBuffer += val.substring(2);
        if(jsonBuffer.endsWith("}")) {
          try {
              dspState = JSON.parse(jsonBuffer);
              if(!dspState.eqb) dspState.eqb = [0,0,0,0];
              if(dspState.tm === undefined) dspState.tm = 0;
              if(dspState.tf === undefined) dspState.tf = 1000;
              if(dspState.tg === undefined) dspState.tg = -20;
              if(dspState.tr === undefined) dspState.tr = 0;
              if(!dspState.bbe_e) dspState.bbe_e = [0,0]; if(!dspState.bbe_l) dspState.bbe_l = [50,50]; if(!dspState.bbe_p) dspState.bbe_p = [50,50];
              if(!dspState.ict) dspState.ict = [0,0]; if(!dspState.icr) dspState.icr = [4,4]; if(!dspState.icm) dspState.icm = [0,0]; if(!dspState.ica) dspState.ica = [10,10]; if(!dspState.icrel) dspState.icrel = [100,100];
              if(!dspState.in_n) dspState.in_n = ["INPUT A", "INPUT B"]; if(!dspState.out_n) dspState.out_n = ["OUTPUT 1", "OUTPUT 2", "OUTPUT 3", "OUTPUT 4"];
              if(!dspState.afs_e) dspState.afs_e = [0,0]; if(!dspState.afs_s) dspState.afs_s = [3,3]; if(!dspState.afs_f) dspState.afs_f = [[0,0,0,0], [0,0,0,0]];
              if(!dspState.deq_e) dspState.deq_e = [0,0]; if(!dspState.deq_f) dspState.deq_f = [[150,1000,5000], [150,1000,5000]]; if(!dspState.deq_q) dspState.deq_q = [[1.4,1.4,1.4], [1.4,1.4,1.4]];
              if(!dspState.deq_t) dspState.deq_t = [[-20,-20,-20], [-20,-20,-20]]; if(!dspState.deq_r) dspState.deq_r = [[0,0,0], [0,0,0]]; if(!dspState.deq_d) dspState.deq_d = [[0,0,0], [0,0,0]];
              buildUI();
          } catch(e) { console.log("JSON Parse err", e); }
          jsonBuffer = "";
        }
      }
    }

    // --- HELPER FUNCTIONS ---
    function sendUpdate(type, ch, param, val, band = '') {
      clearTimeout(timers[type+ch+param+band]);
      timers[type+ch+param+band] = setTimeout(() => {
        sendBLE(`/api/set?type=${type}&ch=${ch}&p=${param}&v=${val}${band !== '' ? '&b='+band : ''}`);
      }, 50);
    }

    function toggleMute(type, ch) {
      if (type === 'in') { dspState.in_mute[ch] = !dspState.in_mute[ch]; } 
      else { dspState.out_mute[ch] = !dspState.out_mute[ch]; }
      sendBLE(`/api/mute?type=${type}&ch=${ch}`);
      buildUI();
    }
    function toggleEqBypass(ch, isDeq) {
      if(isDeq) { dspState.deq_e[ch] = dspState.deq_e[ch]===1?0:1; sendBLE(`/api/set?type=deq&ch=${ch}&p=e&v=${dspState.deq_e[ch]}`); }
      else { dspState.eqb[ch] = dspState.eqb[ch]===1?0:1; sendBLE(`/api/set?type=eqb&ch=${ch}&p=v&v=${dspState.eqb[ch]}`); }
      buildUI(); 
    }

    function setActiveBand(ch, band, isDeq) {
      if(isDeq) activeDeqBand[ch] = band; else activeEqBand[ch] = band;
      buildUI();
    }

    function switchTab(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('tab-' + id.substring(2)).classList.add('active');
      
      let title = document.getElementById('tab-' + id.substring(2)).innerText;
      document.getElementById('page-title').innerText = title;
      
      let actions = document.getElementById('top-actions');
      actions.innerHTML = '';
      if(id.startsWith('t-in')) {
          let ch = id === 't-inA' ? 0 : 1;
          let mBtn = `<button class="btn-action ${dspState.in_mute[ch]?'btn-mute active':''}" onclick="toggleMute('in', ${ch})">${dspState.in_mute[ch]?'MUTED':'MUTE'}</button>`;
          actions.innerHTML = mBtn;
      } else if (id.startsWith('t-out')) {
          let ch = parseInt(id.replace('t-out','')) - 1;
          let mBtn = `<button class="btn-action ${dspState.out_mute[ch]?'btn-mute active':''}" onclick="toggleMute('out', ${ch})">${dspState.out_mute[ch]?'MUTED':'MUTE'}</button>`;
          actions.innerHTML = mBtn;
      }

      drawVisibleGraphs(); drawRTA(); drawCompVisualizers();
    }

    function handleSliderInput(el) {
      let type = el.getAttribute('data-type'); let ch = parseInt(el.getAttribute('data-ch'));
      let p = el.getAttribute('data-p'); let b = el.getAttribute('data-b');
      let unit = el.getAttribute('data-unit'); let step = el.getAttribute('step');
      
      let realVal = parseFloat(el.value);
      if (p === 'f' || p === 'fl' || p === 'fh') {
         let min = parseFloat(el.getAttribute('data-min')), max = parseFloat(el.getAttribute('data-max'));
         realVal = Math.pow(10, Math.log10(min) + (realVal / 1000) * (Math.log10(max) - Math.log10(min)));
         realVal = realVal > 10000 ? Math.round(realVal/100)*100 : realVal > 1000 ? Math.round(realVal/10)*10 : Math.round(realVal);
      }

      let displayVal = realVal.toFixed((unit === '' || step === '0.1') ? 1 : 0) + unit;
      if (type === 'dl' || type === 'idl') displayVal = realVal.toFixed(1) + 'ms / ' + (realVal*34.3).toFixed(1) + 'cm';
      if ((type === 'comp' || type === 'incomp') && p === 'thr' && realVal >= 1) displayVal = "OFF";
      if ((type === 'comp' || type === 'incomp') && p === 'rat' && realVal >= 21) displayVal = "LIMIT";
      if (type === 'deq' && p === 'r') displayVal = realVal === 0 ? "STATIC" : realVal.toFixed(0) + ":1";
      if (type === 'deq' && p === 'd') displayVal = (realVal > 0 ? "+" : "") + realVal.toFixed(0) + "dB";

      el.closest('.control-group').querySelector('.val-display').innerText = displayVal;
      sendUpdate(type, ch, p, realVal, b);
      
      if(type === 'eq') { dspState.eqf[ch][b] = p=='f'?realVal:dspState.eqf[ch][b]; dspState.eq_gn[ch][b] = p=='g'?realVal:dspState.eq_gn[ch][b]; dspState.eqq[ch][b] = p=='q'?realVal:dspState.eqq[ch][b]; }
      if(type === 'deq') { dspState.deq_f[ch][b] = p=='f'?realVal:dspState.deq_f[ch][b]; dspState.deq_d[ch][b] = p=='d'?realVal:dspState.deq_d[ch][b]; dspState.deq_q[ch][b] = p=='q'?realVal:dspState.deq_q[ch][b]; dspState.deq_r[ch][b] = p=='r'?realVal:dspState.deq_r[ch][b]; dspState.deq_t[ch][b] = p=='t'?realVal:dspState.deq_t[ch][b]; }
      if(type === 'xo') { dspState.xt[ch]=p=='t'?realVal:dspState.xt[ch]; dspState.xth[ch]=p=='th'?realVal:dspState.xth[ch]; dspState.xfl[ch]=p=='fl'?realVal:dspState.xfl[ch]; dspState.xfh[ch]=p=='fh'?realVal:dspState.xfh[ch]; dspState.xo_gn[ch]=p=='g'?realVal:dspState.xo_gn[ch]; }

      if (type === 'xo' || type === 'eq' || type === 'deq') drawVisibleGraphs();
    }

    function createSlider(label, type, ch, param, min, max, val, unit, band = '', step = '1') {
      let id = `${type}_${param}_${ch}${band !== '' ? '_' + band : ''}`;
      let isFreq = (param === 'f' || param === 'fl' || param === 'fh');
      let displayVal = parseFloat(val).toFixed((unit === '' || step === '0.1') ? 1 : 0) + unit;
      if(type === 'dl' || type === 'idl') displayVal = parseFloat(val).toFixed(1) + 'ms';
      if ((type === 'comp' || type === 'incomp') && param === 'thr' && parseInt(val) >= 1) displayVal = "OFF";
      if ((type === 'comp' || type === 'incomp') && param === 'rat' && parseInt(val) >= 21) displayVal = "LIMIT";
      if (type === 'deq' && param === 'r') displayVal = parseInt(val) === 0 ? "STATIC" : parseInt(val) + ":1";
      if (type === 'deq' && param === 'd') displayVal = (parseInt(val) > 0 ? "+" : "") + parseInt(val) + "dB";
      
      let htmlVal = val, htmlMin = min, htmlMax = max, htmlStep = step;
      if (isFreq) { htmlMin = 0; htmlMax = 1000; htmlStep = 1; htmlVal = ((Math.log10(val) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000; }

      return `
        <div class="control-group">
          <label>${label} <span class="val-display">${displayVal}</span></label>
          <div class="slider-wrap">
            <input type="range" id="${id}" data-type="${type}" data-ch="${ch}" data-p="${param}" data-b="${band}" data-min="${min}" data-max="${max}" data-unit="${unit}" min="${htmlMin}" max="${htmlMax}" step="${htmlStep}" value="${htmlVal}" oninput="handleSliderInput(this)">
          </div>
        </div>`;
    }

    function createSelect(label, type, ch, param, options, val) {
      let id = `${type}_${param}_${ch}`;
      let opts = options.map((o, i) => `<option value="${i}" ${i==val?'selected':''}>${o}</option>`).join('');
      return `<div class="control-group"><label>${label}</label><select id="${id}" onchange="sendUpdate('${type}', ${ch}, '${param}', this.value); if('${type}'=='xo') drawVisibleGraphs();">${opts}</select></div>`;
    }

    // --- DRAGGABLE CANVAS LOGIC ---
    function getMousePos(canvas, evt) {
        var rect = canvas.getBoundingClientRect();
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }

    function startDragEQ(evt, ch, isDeq) {
        let cvs = evt.target; let pos = getMousePos(cvs, evt);
        let w = cvs.width, h = cvs.height; let logMin = Math.log10(20), logMax = Math.log10(20000);
        let closestBand = 0, minDistance = 999999;
        let numBands = isDeq ? 3 : 7;
        let zeroY = h * (15/45); let scaleY = h/45;

        for(let b=0; b<numBands; b++) {
            let f = isDeq ? dspState.deq_f[ch][b] : dspState.eqf[ch][b];
            let g = isDeq ? dspState.deq_d[ch][b] : dspState.eq_gn[ch][b];
            let x = ((Math.log10(f) - logMin) / (logMax - logMin)) * w;
            let y = zeroY - (g * scaleY);
            let dist = Math.sqrt(Math.pow(pos.x - x, 2) + Math.pow(pos.y - y, 2));
            if(dist < minDistance) { minDistance = dist; closestBand = b; }
        }
        dragObj = { active: true, ch: ch, band: closestBand, isDeq: isDeq, cvs: cvs };
        setActiveBand(ch, closestBand, isDeq); // Auto-switch tab
        document.addEventListener('mousemove', doDragEQ);
        document.addEventListener('mouseup', stopDragEQ);
    }

    function doDragEQ(evt) {
        if(!dragObj.active) return;
        let pos = getMousePos(dragObj.cvs, evt);
        let w = dragObj.cvs.width, h = dragObj.cvs.height;
        let px = Math.max(0, Math.min(w, pos.x)); let py = Math.max(0, Math.min(h, pos.y));
        
        let logMin = Math.log10(20), logMax = Math.log10(20000);
        let freq = Math.pow(10, logMin + (px/w)*(logMax-logMin));
        freq = Math.max(20, Math.min(20000, freq));
        
        let zeroY = h * (15/45); let scaleY = h/45;
        let gain = (zeroY - py) / scaleY;

        let ch = dragObj.ch, b = dragObj.band;
        if (dragObj.isDeq) {
            gain = Math.max(-24, Math.min(15, gain));
            dspState.deq_f[ch][b] = freq; dspState.deq_d[ch][b] = gain;
            let elF = document.getElementById(`deq_f_${ch}_${b}`); let elD = document.getElementById(`deq_d_${ch}_${b}`);
            if(elF) { elF.value = ((Math.log10(freq)-logMin)/(logMax-logMin))*1000; handleSliderInput(elF); }
            if(elD) { elD.value = gain; handleSliderInput(elD); }
        } else {
            gain = Math.max(-12, Math.min(12, gain));
            dspState.eqf[ch][b] = freq; dspState.eq_gn[ch][b] = gain;
            let elF = document.getElementById(`eq_f_${ch}_${b}`); let elG = document.getElementById(`eq_g_${ch}_${b}`);
            if(elF) { elF.value = ((Math.log10(freq)-logMin)/(logMax-logMin))*1000; handleSliderInput(elF); }
            if(elG) { elG.value = gain; handleSliderInput(elG); }
        }
    }

    function stopDragEQ() {
        dragObj.active = false;
        document.removeEventListener('mousemove', doDragEQ);
        document.removeEventListener('mouseup', stopDragEQ);
    }

    // --- CANVAS DRAWING ---
    function drawGrid(ctx, w, h) {
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 0.5;
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      let majorFreqs = [20, 100, 1000, 10000, 20000];
      let minorFreqs = [30, 40, 50, 60, 70, 80, 90, 200, 300, 400, 500, 600, 700, 800, 900, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000];
      
      ctx.font = '10px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for(let f of [...majorFreqs, ...minorFreqs]) {
          let x = (Math.log10(f) - logMin) / (logMax - logMin) * w;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          if (majorFreqs.includes(f)) {
              let lbl = f >= 1000 ? (f/1000)+'k' : f;
              let tx = x - ctx.measureText(lbl).width/2;
              if (f===20) tx = 2; if (f===20000) tx = x - ctx.measureText(lbl).width - 2;
              ctx.fillText(lbl, tx, h - 10);
          }
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
      let zeroY = h * (15/45);
      ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(w, zeroY); ctx.stroke();
      return { logMin, logMax, zeroY, scaleY: h/45 };
    }

    function drawAnchors(ctx, w, h, ch, numBands, isDeq, metrics, color) {
        for(let b=0; b<numBands; b++) {
            let f = isDeq ? dspState.deq_f[ch][b] : dspState.eqf[ch][b];
            let g = isDeq ? dspState.deq_d[ch][b] : dspState.eq_gn[ch][b];
            let x = ((Math.log10(f) - metrics.logMin) / (metrics.logMax - metrics.logMin)) * w;
            let y = metrics.zeroY - (g * metrics.scaleY);
            let isActive = isDeq ? (activeDeqBand[ch] === b) : (activeEqBand[ch] === b);

            ctx.strokeStyle = isActive ? color : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x, metrics.zeroY); ctx.lineTo(x, y); ctx.stroke();
            
            ctx.fillStyle = isActive ? color : 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = isActive ? color : '#fff'; ctx.font = '10px bold sans-serif';
            let txt = (b+1).toString();
            ctx.fillText(txt, x - ctx.measureText(txt).width/2, y + 4);
        }
    }

    function drawVisibleGraphs() {
        for(let i=0; i<2; i++) if(document.getElementById('t-in'+['A','B'][i]).classList.contains('active')) drawGraphDeq(i);
        for(let i=0; i<4; i++) if(document.getElementById('t-out'+(i+1)).classList.contains('active')) drawGraphEq(i);
    }

    function drawGraphDeq(ch) {
        let cvs = document.getElementById(`cvs-deq-${ch}`); if(!cvs) return;
        let ctx = cvs.getContext('2d', { alpha: false }); let w = cvs.width, h = cvs.height;
        let metrics = drawGrid(ctx, w, h);
        let color = ch === 0 ? '#00ADB5' : 'orange';

        ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
        let bypass = dspState.deq_e[ch] === 0;
        for(let x=0; x<=w; x+=1.0) {
            let f = Math.pow(10, metrics.logMin + (x/w)*(metrics.logMax-metrics.logMin));
            let total_db = 0.0;
            if(!bypass) {
                for(let b=0; b<3; b++) {
                    let g = dspState.deq_d[ch][b]; if(g == 0) continue;
                    let fc = dspState.deq_f[ch][b]; let q = dspState.deq_q[ch][b];
                    let xc = (Math.log10(fc)-metrics.logMin)/(metrics.logMax-metrics.logMin) * w;
                    let bw = (9.0 / q) * (w / 123.0);
                    total_db += g / (1.0 + Math.pow(x - xc, 2) / Math.max(0.2, Math.pow(bw, 2)));
                }
            }
            let y = metrics.zeroY - (total_db * metrics.scaleY);
            if(x==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
        drawAnchors(ctx, w, h, ch, 3, true, metrics, color);
    }

    function drawGraphEq(ch) {
      let cvs = document.getElementById(`cvs-eq-${ch}`); if(!cvs) return;
      let ctx = cvs.getContext('2d', { alpha: false }); let w = cvs.width, h = cvs.height;
      let metrics = drawGrid(ctx, w, h);
      const outColors = ['#00ADB5', 'orange', 'purple', 'lightgreen'];
      let color = outColors[ch];

      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
      
      let xo_t = dspState.xt[ch], xo_th = dspState.xth[ch], f_low = dspState.xfl[ch], f_high = dspState.xfh[ch], g_off = dspState.xo_gn[ch];
      let orderL = [2.0, 2.0, 4.0, 8.0, 2.0, 4.0, 8.0][xo_t] || 2.0;
      let orderH = [2.0, 2.0, 4.0, 8.0, 2.0, 4.0, 8.0][xo_th] || 2.0;
      let eqBypassed = dspState.eqb[ch] === 1;

      for(let x=0; x<=w; x+=1.0) {
        let f = Math.pow(10, metrics.logMin + (x/w)*(metrics.logMax-metrics.logMin));
        let total_db = g_off;
        if(xo_t > 0) total_db += -10*Math.log10(1+Math.pow(f_low/f, 2*orderL));
        if(xo_th > 0) total_db += -10*Math.log10(1+Math.pow(f/f_high, 2*orderH));
        
        if(!eqBypassed) {
            for(let b=0; b<7; b++) {
              let g = dspState.eq_gn[ch][b]; if(g == 0) continue;
              let fc = dspState.eqf[ch][b]; let q = dspState.eqq[ch][b];
              let xc = (Math.log10(fc)-metrics.logMin)/(metrics.logMax-metrics.logMin) * w;
              let bw = (9.0 / q) * (w / 123.0);
              total_db += g / (1.0 + Math.pow(x - xc, 2)/Math.max(0.2, Math.pow(bw, 2)));
            }
        }
        let y = metrics.zeroY - (total_db * metrics.scaleY);
        if(x==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      drawAnchors(ctx, w, h, ch, 7, false, metrics, color);
    }

    // --- OTHER VISUALIZERS ---
    function drawRTA() {
        if(!document.getElementById('t-rta').classList.contains('active')) return;
        drawRTACanvas('cvs-rta-A', rtaA, '#00ADB5'); drawRTACanvas('cvs-rta-B', rtaB, 'orange');

    function drawRTACanvas(id, data, color) {
        let cvs = document.getElementById(id); if(!cvs) return;
        let ctx = cvs.getContext('2d', {alpha: false}); let w = cvs.width, h = cvs.height;
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
        let drawHeight = h - 20;
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
        for(let b=0; b<31; b++) {
            let x = (b/30.0)*w; let db = Math.max(-60, Math.min(0, data[b]));
            let y = drawHeight - ((db + 60)/60) * drawHeight;
            if(b===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

              ${createSlider('Makeup', 'comp', i, 'mak', 0, 20, dspState.cm[i], 'dB')}
              <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
              <div style="font-size:11px; font-weight:bold; color:#00ADB5; margin-bottom:10px;">ALL-PASS FILTER</div>
              ${createSelect('APF Enable', 'apf', i, 'e', ['BYPASS', 'ACTIVE'], dspState.apfe[i])}
              ${createSlider('APF Freq', 'apf', i, 'f', 20, 20000, dspState.apff[i], 'Hz', '', '10')}
              ${createSlider('APF Q', 'apf', i, 'q', 0.1, 10, dspState.apfq[i], '', '', '0.1')}
            </div></div>
          </div>

          <div class="dsp-card"><div class="card-header">PARAMETRIC EQ (7-BAND)
            <button class="btn-action ${dspState.eqb[i]===1?'active':''}" onclick="toggleEqBypass(${i}, false)" style="padding:4px 8px;">${dspState.eqb[i]===1?'BYPASSED':'ACTIVE'}</button>
          </div><div class="card-body">
            <div class="canvas-container"><canvas id="cvs-eq-${i}" width="800" height="220" onmousedown="startDragEQ(event, ${i}, false)"></canvas></div>
            <div style="margin-top:20px;">${eqTabs}${eqSliders}</div>
          </div></div>
        `;
      }
      
      // System Tab Setup
      let sysTab = document.getElementById('ui-sys');
      if (sysTab) {
        sysTab.innerHTML = `
          <div class="grid">
            <div class="dsp-card"><div class="card-header">FACTORY RESET</div><div class="card-body">
              <p style="font-size:12px; color:#888; margin-bottom:20px;">Wipe all current settings (Inputs, Outputs, EQs, Routing) and return the DSP to a flat state.</p>
              <button class="btn-connect" style="background:rgba(244,63,94,0.1); color:#f43f5e; border-color:#f43f5e;" onclick="if(confirm('Reset all channels to default?')) { sendBLE('/api/preset?act=load&slot=8'); setTimeout(()=>location.reload(), 1000); }">FACTORY RESET DSP</button>
            </div></div>
            <div class="dsp-card"><div class="card-header">TONE GENERATOR</div><div class="card-body">
              ${createSelect('Mode', 'tone', 0, 'm', ['OFF', 'PINK NOISE', 'SINE WAVE'], dspState.tm)}
              ${createSelect('Route', 'tone', 0, 'r', ['ALL IN', 'IN A', 'IN B', 'OUT 1', 'OUT 2', 'OUT 3', 'OUT 4'], dspState.tr)}
              <div id="tone-freq-container" style="opacity: ${dspState.tm === 2 ? '1' : '0.4'}; pointer-events: ${dspState.tm === 2 ? 'auto' : 'none'};">
                ${createSlider('Freq', 'tone', 0, 'f', 20, 20000, dspState.tf, 'Hz', '', '10')}
              </div>
              ${createSlider('Gain', 'tone', 0, 'g', -60, 0, dspState.tg, 'dB')}
            </div></div>
          </div>
        `;
      }
      drawVisibleGraphs();
    }
    
    function clearAFS(ch) { sendBLE(`/api/set?type=afs&ch=${ch}&p=clr&v=1`); dspState.afs_f[ch] = [0,0,0,0]; buildUI(); }

    // Init UI immediately empty
    switchTab('t-meters');
  </script>
</body>
</html>
