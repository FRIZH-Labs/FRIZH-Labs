<!DOCTYPE html>
<html>
<head>
  <title>FRIZH DLMS 24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #121212; color: #ddd; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 10px; }
    
    /* App Header & BLE Icon */
    .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid #333; margin-bottom: 15px; }
    .app-title { color: #00ADB5; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
    #ble-btn { cursor: pointer; color: #555; transition: all 0.3s ease; padding: 5px; }
    #ble-btn.connected { color: #00ADB5; filter: drop-shadow(0 0 8px rgba(0,173,181,0.6)); }
    #ble-btn:hover { color: #fff; }

    .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 1; padding: 10px; background: #222; text-align: center; cursor: pointer; border-radius: 5px; font-weight: bold; min-width: 60px; transition: 0.2s; border: 1px solid transparent; font-size: 13px; white-space: nowrap; }
    .tab.active { background: #00ADB5; color: #000; box-shadow: 0 0 10px rgba(0,173,181,0.3); }
    
    .panel { display: none; background: #1a1a1a; padding: 15px; border-radius: 5px; border: 1px solid #333; }
    .panel.active { display: block; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
    .control-group { background: #222; padding: 10px; border-radius: 5px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
    label { font-size: 11px; color: #888; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Sliders & Fine Tuning */
    .slider-wrap { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    input[type=range] { width: 100%; margin: 0; cursor: pointer; accent-color: #00ADB5; }
    .btn-fine { background: #333; color: #fff; border: 1px solid #555; border-radius: 3px; cursor: pointer; padding: 0 8px; font-weight: bold; font-size: 14px; outline: none; height: 24px; display: flex; align-items: center; justify-content: center; transition: 0.2s; user-select: none; }
    .btn-fine:hover { background: #00ADB5; color: #000; border-color: #00ADB5; }
    .btn-fine:active { transform: scale(0.95); }
    
    select { width: 100%; padding: 5px; background: #333; color: #fff; border: 1px solid #555; border-radius: 3px; cursor: pointer; outline: none; }
    select:focus { border-color: #00ADB5; }
    .val-display { float: right; color: #00ADB5; font-weight: bold; font-family: monospace; font-size: 12px; }
    
    /* Text Inputs for OTA */
    .txt-input { width: 100%; padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 3px; outline: none; font-family: inherit; box-sizing: border-box; }
    .txt-input:focus { border-color: #00ADB5; }

    /* Vertical VU Meter Styles */
    .pro-meters-grid { display: flex; justify-content: center; gap: 12px; padding: 10px 0; height: 320px; overflow-x: auto; }
    .meter-unit { display: flex; align-items: flex-end; gap: 2px; }
    .meter-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
    .meter-title { font-weight: 800; color: #fff; font-size: 11px; letter-spacing: 1px; margin-bottom: 8px; opacity: 0.7; }
    
    .pro-meter-container { width: 30px; height: 180px; background: #000; border-radius: 2px; position: relative; overflow: hidden; border: 1px solid #333; }
    .pro-meter-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to top, #004400 0%, #00cc00 60%, #e6e600 80%, #ff0000 100%); transition: height 0.08s ease-out; }
    .pro-meter-marks { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(to top, transparent, transparent 3px, #0a0a0a 3px, #0a0a0a 4px); pointer-events: none; }
    
    /* DB Scale */
    .scale-wrapper { display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; height: 100%; padding-right: 5px; }
    .meter-row { display: flex; align-items: flex-start; gap: 2px; }
    .db-scale-container { position: relative; height: 180px; width: 24px; }
    .db-scale-container span { position: absolute; right: 2px; font-size: 9px; font-weight: bold; transform: translateY(-50%); font-family: monospace; line-height: 1; }
    .db-val-0   { top: 0%; color: #ff5555; }
    .db-val-m10 { top: 16.6%; color: #ffcc00; }
    .db-val-m20 { top: 33.3%; color: #44ff44; }
    .db-val-m40 { top: 66.6%; color: #aaaaaa; }
    .db-val-m60 { top: 100%; color: #666666; }

    .meter-indicators { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; width: 100%; align-items: center; }
    
    .led { width: 32px; text-align: center; padding: 3px 0; border-radius: 3px; font-size: 8px; font-weight: 900; letter-spacing: 0.5px; color: #444; background: #222; border: 1px solid #111; opacity: 0.6; transition: all 0.1s; box-sizing: border-box; }
    .led.active { opacity: 1; color: #fff; }
    .led-mute.active { background: #e60000; border-color: #ff3333; box-shadow: 0 0 8px #e60000; }
    .led-clip.active { background: #ff0000; border-color: #ff6666; box-shadow: 0 0 10px #ff0000; color: #fff; }
    .led-comp.active { background: #ffaa00; border-color: #ffcc00; box-shadow: 0 0 8px #ffaa00; color: #000; }
    .led-placeholder { height: 16px; width: 32px; } 

    @media (min-width: 768px) {
        .pro-meters-grid { height: 480px; gap: 20px; }
        .pro-meter-container { width: 45px; height: 320px; }
        .db-scale-container { height: 320px; width: 35px; }
        .db-scale-container span { font-size: 13px; right: 5px; }
        .meter-title { font-size: 14px; margin-bottom: 12px; }
        .led { width: 45px; padding: 5px 0; font-size: 10px; }
        .led-placeholder { height: 22px; width: 45px; }
    }

    canvas { background: #000; width: 100%; border-radius: 5px; border: 1px solid #444; margin: 10px 0; display: block; box-shadow: inset 0 0 10px rgba(0,173,181,0.1); }
    
    .btn-revert { background: #444; color: #fff; border: 1px solid #666; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 10px; float: right; transition: 0.2s; }
    .btn-revert:hover { background: #555; }
    .btn-mute { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; width: 100%; transition: 0.2s; }
    .btn-mute:hover { background: #444; }
    .btn-mute.active { background: #f55; color: #fff; border-color: #f00; box-shadow: 0 0 8px rgba(255,0,0,0.6); }
    .btn-bypass { background: #00ADB5; color: #000; border: none; padding: 8px 12px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
    .btn-bypass.active { background: #f55; color: #fff; box-shadow: 0 0 8px rgba(255,0,0,0.5); }
    .btn-row { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; align-items: center; justify-content: space-between; }
    
    .section-header { background: #2a2a2a; padding: 10px 12px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px 4px 0 0; color: #00ADB5; font-size: 0.85em; font-weight: bold; border: 1px solid #333; border-bottom: none; }
    .edit-toggle-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.8em; color: #aaa; }
    .edit-toggle-wrap input { width: 14px; height: 14px; cursor: pointer; accent-color: #00ADB5; }
    .dsp-section { background: #1a1a1a; padding: 12px; border: 1px solid #333; border-top: 1px solid #222; border-radius: 0 0 4px 4px; transition: opacity 0.2s; }
    .dsp-section.locked { opacity: 0.4; pointer-events: none; filter: grayscale(50%); height: 0; padding: 0; overflow: hidden; border: none; }
    .dsp-section.bypassed { opacity: 0.5; border: 1px solid #f55; }
    
    /* BLE Overlays & Dialogs */
    #connect-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(18,18,18,0.95); z-index:9998; display:flex; justify-content:center; align-items:center; flex-direction:column; backdrop-filter: blur(5px); }
    .btn-connect { padding:15px 30px; font-size:16px; background:#00ADB5; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold; box-shadow: 0 4px 15px rgba(0, 173, 181, 0.4); transition: 0.2s; letter-spacing: 1px; }
    .btn-connect:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 173, 181, 0.6); }
    .btn-connect:active { transform: translateY(1px); }
    .btn-connect:disabled { background: #555; color: #aaa; box-shadow: none; cursor: not-allowed; transform: none; }

    #ble-dialog-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; display:none; justify-content:center; align-items:center; backdrop-filter: blur(3px); }
    .ble-dialog { background:#1a1a1a; padding:25px; border-radius:8px; border:1px solid #333; text-align:center; min-width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .ble-dialog h3 { color:#00ADB5; margin-top:0; letter-spacing: 1px; font-size: 16px; }
    .ble-dialog p { color: #aaa; font-size: 13px; margin-bottom: 20px; }
    .ble-btn-row { display:flex; flex-direction:column; gap:10px; }
    .ble-dialog button { padding:12px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; font-size: 13px; letter-spacing: 0.5px; transition: 0.2s; }
    .btn-switch { background:#00ADB5; color:#000; }
    .btn-switch:hover { background:#008B92; }
    .btn-dc { background:#ff3333; color:#fff; }
    .btn-dc:hover { background:#e60000; }
    .btn-cancel { background:#333; color:#fff; border: 1px solid #555 !important; }
    .btn-cancel:hover { background:#444; }

    /* Channel Header */
    .channel-header { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 15px; }
    .btn-icon { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 5px; transition: 0.2s; }
    .btn-icon:hover { color: #00ADB5; }
  </style>
</head>
<body>

  <div id="connect-overlay">
    <div style="font-size: 28px; font-weight: bold; color: #00ADB5; letter-spacing: 2px; margin-bottom: 30px;">FRIZH DLMS 24</div>
    <button class="btn-connect" onclick="connectBLE()">SCAN & CONNECT</button>
    <p style="color:#888; margin-top:20px; text-align:center; font-size: 13px; line-height: 1.6;">Ensure Bluetooth is enabled on your device.<br>Requires Google Chrome, Edge, or a WebBLE supported browser.</p>
  </div>

  <div id="ble-dialog-overlay">
    <div class="ble-dialog">
      <h3>DEVICE STATUS</h3>
      <p id="ble-connected-name">Connected to: Unknown</p>
      <div class="ble-btn-row">
        <button class="btn-switch" onclick="switchDevice()">SWITCH DEVICE</button>
        <button class="btn-dc" onclick="disconnectBLE()">DISCONNECT</button>
        <button class="btn-cancel" onclick="closeBleDialog()">CANCEL</button>
      </div>
    </div>
  </div>

  <div class="app-header">
    <div class="app-title">FRIZH DLMS 24</div>
    <div id="ble-btn" onclick="handleBleIconClick()" title="Bluetooth Options">
      <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"></polyline>
      </svg>
    </div>
  </div>
  
  <div class="tabs" id="tabs">
    <div class="tab active" id="tab-meters" onclick="switchTab('t-meters')">MONITOR</div>
    <div class="tab" id="tab-rta" onclick="switchTab('t-rta')">RTA</div>
    <div class="tab" id="tab-inA" onclick="switchTab('t-inA')">IN A</div>
    <div class="tab" id="tab-inB" onclick="switchTab('t-inB')">IN B</div>
    <div class="tab" id="tab-out1" onclick="switchTab('t-out1')">OUT 1</div>
    <div class="tab" id="tab-out2" onclick="switchTab('t-out2')">OUT 2</div>
    <div class="tab" id="tab-out3" onclick="switchTab('t-out3')">OUT 3</div>
    <div class="tab" id="tab-out4" onclick="switchTab('t-out4')">OUT 4</div>
    <div class="tab" id="tab-sys" onclick="switchTab('t-sys')" style="color: #ffaa00;">SYSTEM</div>
  </div>

  <div id="t-meters" class="panel active"><div id="meter-grid"></div></div>
  
  <div id="t-rta" class="panel">
     <div class="section-header" style="border-radius: 4px;">INPUT A SPECTRUM</div>
     <canvas id="cvs-rta-A" width="400" height="140"></canvas>
     <div class="section-header" style="margin-top:20px; border-radius: 4px;">INPUT B SPECTRUM</div>
     <canvas id="cvs-rta-B" width="400" height="140"></canvas>
  </div>
  
  <div id="t-inA" class="panel"><div id="ui-inA"></div></div>
  <div id="t-inB" class="panel"><div id="ui-inB"></div></div>
  <div id="t-out1" class="panel"></div>
  <div id="t-out2" class="panel"></div>
  <div id="t-out3" class="panel"></div>
  <div id="t-out4" class="panel"></div>
  <div id="t-sys" class="panel"></div>

  <script>
    let dspState = {};
    let initialState = null;
    let timers = {};
    
    // Live Audio State
    let livePeaks = [0,0,0,0,0,0]; // A, B, 1, 2, 3, 4 (in Linear value)
    let compAct = [0,0,0,0];
    let inCompAct = [0,0];
    let rtaA = new Array(31).fill(-60.0);
    let rtaB = new Array(31).fill(-60.0);

    // Web Bluetooth Variables
    let bleDevice, bleServer, bleService, rxChar, txChar;
    let bleQueue = [];
    let isWriting = false;
    let jsonBuffer = "";

    function handleBleIconClick() {
      if (bleDevice && bleDevice.gatt.connected) {
         document.getElementById('ble-connected-name').innerText = "Connected to:\n" + (bleDevice.name || "FRIZH_DLMS24_...");
         document.getElementById('ble-dialog-overlay').style.display = 'flex';
      } else {
         connectBLE();
      }
    }

    function closeBleDialog() {
        document.getElementById('ble-dialog-overlay').style.display = 'none';
    }

    function disconnectBLE() {
        if (bleDevice && bleDevice.gatt.connected) {
            bleDevice.gatt.disconnect();
        }
        closeBleDialog();
    }

    async function switchDevice() {
        disconnectBLE();
        setTimeout(() => { connectBLE(); }, 400);
    }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'FRIZH_DLMS24_' }], 
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });
        
        bleDevice.addEventListener('gattserverdisconnected', () => { 
            document.getElementById('ble-btn').classList.remove('connected');
            document.getElementById('connect-overlay').style.display = 'flex'; 
        });

        bleServer = await bleDevice.gatt.connect();
        bleService = await bleServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
        rxChar = await bleService.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
        txChar = await bleService.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
        
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleNotifications);
        
        document.getElementById('connect-overlay').style.display = 'none';
        document.getElementById('ble-btn').classList.add('connected');
        closeBleDialog(); 

        sendBLE('/api/dump');
      } catch(e) { 
        console.error("BLE Error:", e);
        if (e.name !== 'NotFoundError') {
            alert("Bluetooth Connection Failed. Please ensure your device supports Web Bluetooth.");
        }
      }
    }

    async function processBleQueue() {
      if(isWriting || bleQueue.length === 0 || !rxChar) return;
      isWriting = true;
      let cmd = bleQueue.shift();
      try {
        let enc = new TextEncoder();
        await rxChar.writeValueWithoutResponse(enc.encode(cmd));
      } catch(e) { console.log("BLE Write Error", e); }
      isWriting = false;
      setTimeout(processBleQueue, 15);
    }

    function sendBLE(cmd) {
      bleQueue.push(cmd);
      processBleQueue();
    }

    function handleNotifications(event) {
      let val = new TextDecoder().decode(event.target.value);
      if(val.startsWith("S:")) {
        let p = val.substring(2).split(',');
        if(p.length >= 18) {
            for(let i=0; i<6; i++) {
                livePeaks[i] = parseFloat(p[i]) || 1e-9;
                if(document.getElementById('t-meters').classList.contains('active')) {
                    let db = 20 * Math.log10(livePeaks[i]);
                    db -= 3.0; // -3dB Calibration
                    let pct = Math.max(0, Math.min(100, (db + 60) * (100 / 60))); 
                    let mtr = document.getElementById(`mtr-${i}`);
                    if(mtr) mtr.style.height = pct + '%';
                    let clipLed = document.getElementById(`ind-clip-${i}`);
                    if(clipLed) clipLed.classList.toggle('active', db >= -3.5); 
                }
            }
            
            if (dspState.in_mute !== undefined) {
              for(let i=0; i<2; i++) {
                dspState.in_mute[i] = (p[6+i] === '1');
                inCompAct[i] = parseInt(p[16+i]);
                
                let btn = document.getElementById(`btn-mute-in-${i}`);
                if(btn) btn.classList.toggle('active', dspState.in_mute[i]);
                let muteLed = document.getElementById(`ind-mute-${i}`);
                if(muteLed) muteLed.classList.toggle('active', dspState.in_mute[i]);
                let compLed = document.getElementById(`ind-comp-${i}`);
                if(compLed) compLed.classList.toggle('active', inCompAct[i] === 1);
              }
              for(let i=0; i<4; i++) {
                dspState.out_mute[i] = (p[8+i] === '1');
                compAct[i] = parseInt(p[12+i]);
                
                let btn = document.getElementById(`btn-mute-out-${i}`);
                if(btn) btn.classList.toggle('active', dspState.out_mute[i]);
                
                let muteLed = document.getElementById(`ind-mute-${i+2}`);
                if(muteLed) muteLed.classList.toggle('active', dspState.out_mute[i]);
                
                let compLed = document.getElementById(`ind-comp-${i+2}`);
                if(compLed) compLed.classList.toggle('active', compAct[i] === 1);
              }
            }
            drawCompVisualizers();
        }
      } else if (val.startsWith("R:")) {
        let halves = val.substring(2).split('|');
        if (halves.length === 2) {
          let aVals = halves[0].split(',');
          let bVals = halves[1].split(',');
          for (let i = 0; i < 31; i++) {
            if (aVals[i] !== "") {
              let rawA = parseFloat(aVals[i]);
              rtaA[i] = rawA > rtaA[i] ? rawA : Math.max(-60, rtaA[i] - 1.5);
            }
            if (bVals[i] !== "") {
              let rawB = parseFloat(bVals[i]);
              rtaB[i] = rawB > rtaB[i] ? rawB : Math.max(-60, rtaB[i] - 1.5);
            }
          }
          drawRTA();
        }
      } else if (val.startsWith("J:{")) {
        jsonBuffer = val.substring(2);
      } else if (val.startsWith("J:")) {
        jsonBuffer += val.substring(2);
        if(jsonBuffer.endsWith("}")) {
          try {
              dspState = JSON.parse(jsonBuffer);
              if(!dspState.eqb) dspState.eqb = [0,0,0,0];
              if(dspState.tm === undefined) dspState.tm = 0;
              if(dspState.tf === undefined) dspState.tf = 1000;
              if(dspState.tg === undefined) dspState.tg = -20;
              if(dspState.tr === undefined) dspState.tr = 0;
              if(!dspState.bbe_e) dspState.bbe_e = [0,0];
              if(!dspState.bbe_l) dspState.bbe_l = [50,50];
              if(!dspState.bbe_p) dspState.bbe_p = [50,50];
              
              // V2.1.5 Additions
              if(!dspState.ict) dspState.ict = [0,0];
              if(!dspState.icr) dspState.icr = [4,4];
              if(!dspState.icm) dspState.icm = [0,0];
              if(!dspState.ica) dspState.ica = [10,10];
              if(!dspState.icrel) dspState.icrel = [100,100];
              if(!dspState.in_n) dspState.in_n = ["INPUT A", "INPUT B"];
              if(!dspState.out_n) dspState.out_n = ["OUTPUT 1", "OUTPUT 2", "OUTPUT 3", "OUTPUT 4"];

              initialState = JSON.stringify(dspState);
              buildUI();
          } catch(e) { console.log("JSON Parse err", e); }
          jsonBuffer = "";
        }
      }
    }

    function toggleMute(type, ch) {
      let isMuted = false;
      if (type === 'in') {
          dspState.in_mute[ch] = !dspState.in_mute[ch];
          isMuted = dspState.in_mute[ch];
      } else {
          dspState.out_mute[ch] = !dspState.out_mute[ch];
          isMuted = dspState.out_mute[ch];
      }
      document.getElementById(`btn-mute-${type}-${ch}`).classList.toggle('active', isMuted);
      sendBLE(`/api/mute?type=${type}&ch=${ch}`);
    }

    function toggleEqBypass(ch) {
      dspState.eqb[ch] = dspState.eqb[ch] === 1 ? 0 : 1;
      sendBLE(`/api/set?type=eqb&ch=${ch}&p=v&v=${dspState.eqb[ch]}`);
      buildUI(); 
    }

    function renameChannel(type, ch) {
        let current = type === 'in' ? dspState.in_n[ch] : dspState.out_n[ch];
        let n = prompt(`Enter new name for ${type.toUpperCase()} ${ch+1} (Max 8 chars):`, current);
        if (n !== null) {
            n = n.substring(0,8).toUpperCase().replace(/[^A-Z0-9 ]/g, '');
            sendBLE(`/api/name?type=${type}&ch=${ch}&n=${encodeURIComponent(n)}`);
            if (type === 'in') dspState.in_n[ch] = n;
            else dspState.out_n[ch] = n;
            buildUI();
        }
    }

    function doPreset(act) {
        let slot = parseInt(document.getElementById('sys-preset-slot').value);
        let isProtected = slot >= 6;

        if (act === 'load' || act === 'save') {
            if(act === 'save' && isProtected) return alert("Slots 6, 7, and 8 are factory protected.");
            if(confirm(`Are you sure you want to ${act.toUpperCase()} Slot ${slot}?`)) {
                sendBLE(`/api/preset?act=${act}&slot=${slot}`);
            }
        } else if (act === 'rename') {
            if(isProtected) return alert("Slots 6, 7, and 8 are factory protected.");
            let name = prompt(`Enter new name for Slot ${slot} (Max 5 chars):`);
            if(name !== null) {
                name = name.substring(0,5).toUpperCase().replace(/[^A-Z0-9 ]/g, '');
                sendBLE(`/api/preset?act=rename&slot=${slot}&name=${name}`);
            }
        }
    }

    function updatePresetButtons() {
        let slot = parseInt(document.getElementById('sys-preset-slot').value);
        let isProtected = slot >= 6;
        let btnSave = document.getElementById('btn-preset-save');
        let btnRen = document.getElementById('btn-preset-ren');
        
        btnSave.style.opacity = isProtected ? '0.3' : '1';
        btnRen.style.opacity = isProtected ? '0.3' : '1';
        btnSave.disabled = isProtected;
        btnRen.disabled = isProtected;
    }

    async function fetchGithubReleases() {
        let sel = document.getElementById('ota-version');
        let btn = document.getElementById('btn-ota-fetch');
        sel.innerHTML = '<option>Fetching from GitHub...</option>';
        btn.disabled = true;
        try {
            let res = await fetch('https://api.github.com/repos/FRIZH-Labs/FRIZH-Labs/contents/', {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            let files = await res.json();
            let opts = '';
            files.forEach(f => {
                if(f.name.toLowerCase().endsWith('.bin')) {
                    let name = f.name.replace(/\.bin$/i, '');
                    opts += `<option value="${name}">${name}</option>`;
                }
            });
            if(opts === '') opts = '<option value="firmware_normal">firmware_normal (Fallback)</option>';
            sel.innerHTML = opts;
        } catch(e) {
            sel.innerHTML = '<option value="firmware_normal">Fetch Failed - Using Fallback</option>';
        }
        btn.disabled = false;
    }

    function triggerOTA() {
        let ssid = document.getElementById('ota-ssid').value;
        let pass = document.getElementById('ota-pass').value;
        let ver = document.getElementById('ota-version').value;
        
        if(!ssid || !ver || ver.includes('Fetching')) {
            return alert("Please enter WiFi SSID and select a firmware version.");
        }
        
        if(confirm("Start OTA Update?\nThe device will connect to WiFi, download the firmware, and automatically reboot. This may take up to 2 minutes.")) {
            sendBLE(`/api/ota?s=${encodeURIComponent(ssid)}&p=${encodeURIComponent(pass)}&v=${encodeURIComponent(ver)}`);
        }
    }

    function handleToneModeUpdate(val) {
        let mode = parseInt(val);
        document.getElementById('tone-freq-container').style.opacity = (mode === 2) ? '1' : '0.4';
        document.getElementById('tone-freq-container').style.pointerEvents = (mode === 2) ? 'auto' : 'none';
        sendUpdate('tone', 0, 'm', mode);
    }
    
    function copyChannel(targetCh) {
        let src = document.getElementById(`copy_src_${targetCh}`).value;
        if(src === "" || parseInt(src) === targetCh) return;
        if(confirm(`Copy all settings from OUT ${parseInt(src)+1} to OUT ${targetCh+1}?`)) {
            sendBLE(`/api/copy?src=${src}&dst=${targetCh}`);
        }
        document.getElementById(`copy_src_${targetCh}`).value = "";
    }

    function switchTab(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      let tabBtn = document.getElementById('tab-' + id.substring(2));
      if(tabBtn) tabBtn.classList.add('active');
      
      if(id.startsWith('t-out')) drawVisibleGraphs();
      if(id === 't-rta') drawRTA();
      drawCompVisualizers();
    }

    function sendUpdate(type, ch, param, val, band = '') {
      clearTimeout(timers[type+ch+param+band]);
      timers[type+ch+param+band] = setTimeout(() => {
        let url = `/api/set?type=${type}&ch=${ch}&p=${param}&v=${val}${band !== '' ? '&b='+band : ''}`;
        sendBLE(url);
      }, 50);
    }

    function promptFreq(id, min, max) {
        let val = prompt(`Enter frequency (${min} - ${max} Hz):`);
        if (val !== null && val.trim() !== '') {
            val = parseFloat(val);
            if (!isNaN(val)) {
                val = Math.max(min, Math.min(max, val));
                let el = document.getElementById(id);
                if (el) {
                    let logMin = Math.log10(min);
                    let logMax = Math.log10(max);
                    let sliderVal = ((Math.log10(val) - logMin) / (logMax - logMin)) * 1000;
                    el.value = sliderVal;
                    handleSliderInput(el);
                }
            }
        }
    }

    function fineTune(id, direction) {
      let el = document.getElementById(id);
      if(!el) return;
      let step = parseFloat(el.getAttribute('step')) || 1;
      let val = parseFloat(el.value);
      val += (direction * step);
      
      let max = parseFloat(el.getAttribute('max'));
      let min = parseFloat(el.getAttribute('min'));
      if (val > max) val = max;
      if (val < min) val = min;
      el.value = val;
      handleSliderInput(el); 
    }

    function handleSliderInput(el) {
      let type = el.getAttribute('data-type');
      let ch = parseInt(el.getAttribute('data-ch'));
      let p = el.getAttribute('data-p');
      let b = el.getAttribute('data-b');
      let unit = el.getAttribute('data-unit');
      let step = el.getAttribute('step');
      let isFreq = (p === 'f' || p === 'fl' || p === 'fh');
      
      let realVal = parseFloat(el.value);
      if (isFreq) {
         let min = parseFloat(el.getAttribute('data-min'));
         let max = parseFloat(el.getAttribute('data-max'));
         let logMin = Math.log10(min);
         let logMax = Math.log10(max);
         realVal = Math.pow(10, logMin + (realVal / 1000) * (logMax - logMin));
         if(realVal > 10000) realVal = Math.round(realVal / 100) * 100;
         else if(realVal > 1000) realVal = Math.round(realVal / 10) * 10;
         else realVal = Math.round(realVal);
      }

      let displayVal = realVal.toFixed((unit === '' || step === '0.1') ? 1 : 0) + unit;
      if (type === 'dl' || type === 'idl') {
          let dist = (realVal * 34.3).toFixed(1);
          displayVal = realVal.toFixed(1) + 'ms / ' + dist + 'cm';
      }
      
      if (type === 'comp' || type === 'incomp') {
          if (p === 'thr' && realVal >= 1) displayVal = "OFF";
          if (p === 'rat' && realVal >= 21) displayVal = "LIMIT";
      }

      el.closest('.control-group').querySelector('.val-display').innerText = displayVal;
      sendUpdate(type, ch, p, realVal, b);
      if (type === 'xo' || type === 'eq') drawVisibleGraphs();
      if (type === 'comp' || type === 'incomp') {
          if(type === 'incomp') { dspState.ict[ch]=p=='thr'?realVal:dspState.ict[ch]; dspState.icr[ch]=p=='rat'?realVal:dspState.icr[ch]; dspState.icm[ch]=p=='mak'?realVal:dspState.icm[ch]; }
          else { dspState.ct[ch]=p=='thr'?realVal:dspState.ct[ch]; dspState.cr[ch]=p=='rat'?realVal:dspState.cr[ch]; dspState.cm[ch]=p=='mak'?realVal:dspState.cm[ch]; }
          drawCompVisualizers();
      }
    }

    function createSlider(label, type, ch, param, min, max, val, unit, band = '', step = '1') {
      let id = `${type}_${param}_${ch}${band !== '' ? '_' + band : ''}`;
      let isFreq = (param === 'f' || param === 'fl' || param === 'fh');
      let displayVal = parseFloat(val).toFixed((unit === '' || step === '0.1') ? 1 : 0) + unit;
      
      if(type === 'dl' || type === 'idl') {
          let dist = (parseFloat(val) * 34.3).toFixed(1);
          displayVal = parseFloat(val).toFixed(1) + 'ms / ' + dist + 'cm';
      }
      
      if (type === 'comp' || type === 'incomp') {
          if (param === 'thr' && parseInt(val) >= 1) displayVal = "OFF";
          if (param === 'rat' && parseInt(val) >= 21) displayVal = "LIMIT";
      }
      
      let htmlVal = val, htmlMin = min, htmlMax = max, htmlStep = step;
      let clickAction = '', cursorStyle = '';
      if (isFreq) {
         htmlMin = 0; htmlMax = 1000; htmlStep = 1;
         htmlVal = ((Math.log10(val) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
         clickAction = `onclick="promptFreq('${id}', ${min}, ${max})"`;
         cursorStyle = 'cursor:pointer; text-decoration:underline;';
      }

      return `
        <div class="control-group">
          <label>${label} <span class="val-display" style="${cursorStyle}" ${clickAction}>${displayVal}</span></label>
          <div class="slider-wrap">
            <button class="btn-fine" onclick="fineTune('${id}', -1)">-</button>
            <input type="range" id="${id}" data-type="${type}" data-ch="${ch}" data-p="${param}" data-b="${band}" data-min="${min}" data-max="${max}" data-unit="${unit}" min="${htmlMin}" max="${htmlMax}" step="${htmlStep}" value="${htmlVal}" 
              oninput="handleSliderInput(this)" style="flex:1;">
            <button class="btn-fine" onclick="fineTune('${id}', 1)">+</button>
          </div>
        </div>`;
    }

    function createSelect(label, type, ch, param, options, val) {
      let id = `${type}_${param}_${ch}`;
      let opts = options.map((o, i) => `<option value="${i}" ${i==val?'selected':''}>${o}</option>`).join('');
      let onChangeAction = (type === 'tone' && param === 'm') ?
        `handleToneModeUpdate(this.value);` : 
        `sendUpdate('${type}', ${ch}, '${param}', this.value); if('${type}'=='xo') drawVisibleGraphs();`;
        
      return `
        <div class="control-group">
          <label>${label}</label>
          <select id="${id}" onchange="${onChangeAction}">${opts}</select>
        </div>`;
    }

    function getRealFreq(el) {
      if(!el) return 20;
      let min = parseFloat(el.getAttribute('data-min'));
      let max = parseFloat(el.getAttribute('data-max'));
      let val = parseFloat(el.value);
      let logMin = Math.log10(min);
      let logMax = Math.log10(max);
      return Math.pow(10, logMin + (val / 1000) * (logMax - logMin));
    }

    function drawRTA() {
        if(!document.getElementById('t-rta').classList.contains('active')) return;
        drawRTACanvas('cvs-rta-A', rtaA, '#00ADB5');
        drawRTACanvas('cvs-rta-B', rtaB, 'orange');
    }

    function drawRTACanvas(id, data, color) {
        let cvs = document.getElementById(id);
        if(!cvs) return;
        let ctx = cvs.getContext('2d', {alpha: false});
        let w = cvs.width, h = cvs.height;
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 0.5;
        let labels = ["20", "350", "1k", "2.6k", "7k", "20k"];
        let indices = [0, 6, 12, 18, 24, 30];
        
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '10px sans-serif';
        for(let i=0; i<labels.length; i++) {
            let x = (indices[i]/30.0)*w;
            ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
            let textX = x - (ctx.measureText(labels[i]).width / 2);
            if(i===0) textX = 4;
            if(i===labels.length-1) textX = w - ctx.measureText(labels[i]).width - 4;
            ctx.fillText(labels[i], textX, h-4);
        }
        
        ctx.beginPath(); ctx.moveTo(0, h*0.33); ctx.lineTo(w, h*0.33); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, h*0.66); ctx.lineTo(w, h*0.66); ctx.stroke();
        
        let drawHeight = h - 20;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        for(let b=0; b<31; b++) {
            let x = (b/30.0)*w;
            let db = Math.max(-60, Math.min(0, data[b]));
            let y = drawHeight - ((db + 60)/60) * drawHeight;
            if(b===0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function drawCompVisualizers() {
        for(let i=0; i<2; i++) {
            if(!document.getElementById(`t-in${['A','B'][i]}`).classList.contains('active')) continue;
            updateCompCanvas(i, true);
        }
        for(let i=0; i<4; i++) {
            if(!document.getElementById(`t-out${i+1}`).classList.contains('active')) continue;
            updateCompCanvas(i, false);
        }
    }

    function updateCompCanvas(ch, isInput) {
        let cvs = document.getElementById(`cvs-comp-${isInput?'in':'out'}-${ch}`);
        let grBar = document.getElementById(`gr-bar-${isInput?'in':'out'}-${ch}`);
        let grTxt = document.getElementById(`gr-txt-${isInput?'in':'out'}-${ch}`);
        if(!cvs || !grBar) return;
        
        let thr = isInput ? dspState.ict[ch] : dspState.ct[ch];
        let r = isInput ? dspState.icr[ch] : dspState.cr[ch];
        let rat = r >= 21 ? 1000.0 : r;
        let mak = isInput ? dspState.icm[ch] : dspState.cm[ch];
        let isOff = thr >= 1;
        
        let peakLinear = isInput ? livePeaks[ch] : livePeaks[ch+2];
        let peakDb = -60;
        if (peakLinear > 0.0001) peakDb = 20 * Math.log10(peakLinear) - 3.0;
        peakDb = Math.max(-60, Math.min(0, peakDb));

        let activeFlag = isInput ? inCompAct[ch] : compAct[ch];
        
        let simGr = 0.0;
        if(!isOff) {
            let outNoMak = peakDb - mak;
            if(outNoMak > thr) simGr = (outNoMak - thr) * (rat - 1);
            if(activeFlag === 1 && simGr < 1.5) {
                let heat = Math.max(0, Math.min(40, peakDb + 40)) / 40.0;
                simGr = 1.5 + (heat * Math.min(8, rat));
            }
        }
        simGr = Math.max(0, Math.min(20, simGr));
        
        grBar.style.height = (simGr / 20.0 * 100) + '%';
        grTxt.innerText = simGr > 0.1 ? `-${simGr.toFixed(1)}` : `0.0`;
        
        let ctx = cvs.getContext('2d');
        let w = cvs.width, h = cvs.height;
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
        
        let minDb = -60, maxDb = 10, range = maxDb - minDb;
        let dbToX = db => ((db - minDb) / range) * w;
        let dbToY = db => h - (((db - minDb) / range) * h);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(dbToX(0), 0); ctx.lineTo(dbToX(0), h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, dbToY(0)); ctx.lineTo(w, dbToY(0)); ctx.stroke();
        
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath();
        ctx.moveTo(dbToX(minDb), dbToY(minDb)); ctx.lineTo(dbToX(maxDb), dbToY(maxDb)); ctx.stroke();
        
        if(isOff) return;
        
        ctx.strokeStyle = isInput ? '#00ADB5' : 'orange'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(dbToX(minDb), dbToY(minDb + mak));
        ctx.lineTo(dbToX(thr), dbToY(thr + mak));
        let outAtMax = thr + (maxDb - thr) / rat + mak;
        ctx.lineTo(dbToX(maxDb), dbToY(outAtMax));
        ctx.stroke();
        
        ctx.fillStyle = '#fff'; ctx.beginPath();
        ctx.arc(dbToX(thr), dbToY(thr + mak), 4, 0, Math.PI*2); ctx.fill();
        
        let outDbNoMak = peakDb - mak;
        let inDb = outDbNoMak;
        if (outDbNoMak > thr) inDb = thr + (outDbNoMak - thr) * rat;
        
        if(peakDb > minDb + 1.0) {
            ctx.fillStyle = '#f55'; ctx.beginPath();
            ctx.arc(dbToX(inDb), dbToY(peakDb), 4, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawVisibleGraphs() {
        for(let i=0; i<4; i++) {
            drawGraph(i);
            drawCrossoverGraph(i);
        }
    }

    function drawCrossoverGraph(ch) {
      let cvs = document.getElementById(`cvs-xo-cmp-${ch}`);
      if(!cvs || cvs.offsetParent === null) return;
      let ctx = cvs.getContext('2d', { alpha: false });
      let w = cvs.width, h = cvs.height;
      
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
      for(let i=1; i<4; i++) { ctx.beginPath(); ctx.moveTo(0, h*i/4); ctx.lineTo(w, h*i/4); ctx.stroke(); }

      let logMin = Math.log10(20), logMax = Math.log10(20000);
      const outColors = ['#aaaaaa', '#00ADB5', 'orange', 'purple', 'lightgreen'];

      for(let d=0; d<4; d++) {
          let sel = document.getElementById(`xo_cmp_${ch}_${d}`);
          if(sel) sel.style.color = outColors[parseInt(sel.value)] || '#fff';
      }

      for(let d=0; d<4; d++) {
        let sel = document.getElementById(`xo_cmp_${ch}_${d}`);
        if(!sel) continue;
        let val = parseInt(sel.value);
        if(val === 0) continue; 

        let targetCh = val - 1; 
        
        let el_t = document.getElementById(`xo_t_${targetCh}`);
        let el_th = document.getElementById(`xo_th_${targetCh}`);
        let el_fl = document.getElementById(`xo_fl_${targetCh}`);
        let el_fh = document.getElementById(`xo_fh_${targetCh}`);
        let el_g = document.getElementById(`xo_g_${targetCh}`);
        if(!el_t || !el_th || !el_fl || !el_fh || !el_g) continue;

        let xo_t = parseInt(el_t.value);
        let xo_th = parseInt(el_th.value);
        let f_low = getRealFreq(el_fl);
        let f_high = getRealFreq(el_fh);
        let g_off = parseFloat(el_g.value);
        let orderL = [2.0, 2.0, 4.0, 8.0, 2.0, 4.0, 8.0][xo_t] || 2.0;
        let orderH = [2.0, 2.0, 4.0, 8.0, 2.0, 4.0, 8.0][xo_th] || 2.0;
        
        ctx.strokeStyle = outColors[val];
        ctx.lineWidth = 2; 
        ctx.beginPath();
        for(let x=0; x<w; x+=2) {
          let f = Math.pow(10, logMin + (x/w)*(logMax-logMin));
          let total_db = g_off;
          
          if(xo_t > 0) total_db += -10*Math.log10(1+Math.pow(f_low/f, 2*orderL));
          if(xo_th > 0) total_db += -10*Math.log10(1+Math.pow(f/f_high, 2*orderH));
          let y = h/2 - (total_db * (h/48));
          if(x==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    }

    function drawGraph(ch) {
      let cvs = document.getElementById(`cvs-${ch}`);
      if(!cvs || cvs.offsetParent === null) return;
      let ctx = cvs.getContext('2d', { alpha: false });
      let w = cvs.width, h = cvs.height;
      
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
      for(let i=1; i<4; i++) { ctx.beginPath(); ctx.moveTo(0, h*i/4); ctx.lineTo(w, h*i/4); ctx.stroke(); }

      ctx.strokeStyle = '#00ADB5';
      ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
      
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      
      let xo_t = parseInt(document.getElementById(`xo_t_${ch}`).value);
      let xo_th = parseInt(document.getElementById(`xo_th_${ch}`).value);
      let f_low = getRealFreq(document.getElementById(`xo_fl_${ch}`));
      let f_high = getRealFreq(document.getElementById(`xo_fh_${ch}`));
      let g_off = parseFloat(document.getElementById(`xo_g_${ch}`).value);
      let orderL = [2.0, 2.0, 4.0, 8.0, 2.0, 4.0, 8.0][xo_t] || 2.0;
      let orderH = [2.0, 2.0, 4.0, 8.0, 2.0, 4.0, 8.0][xo_th] || 2.0;
      
      let eqBypassed = dspState.eqb && dspState.eqb[ch] === 1;
      for(let x=0; x<w; x+=2) {
        let f = Math.pow(10, logMin + (x/w)*(logMax-logMin));
        let total_db = g_off;
        
        if(xo_t > 0) total_db += -10*Math.log10(1+Math.pow(f_low/f, 2*orderL));
        if(xo_th > 0) total_db += -10*Math.log10(1+Math.pow(f/f_high, 2*orderH));
        
        if(!eqBypassed) {
            for(let b=0; b<7; b++) {
              let g = parseFloat(document.getElementById(`eq_g_${ch}_${b}`).value);
              if(g == 0) continue;
              let fc = getRealFreq(document.getElementById(`eq_f_${ch}_${b}`));
              let q = parseFloat(document.getElementById(`eq_q_${ch}_${b}`).value);
              let xc = (Math.log10(fc)-logMin)/(logMax-logMin) * w;
              let dx = x - xc;
              let bw = (9.0 / q) * (w / 123.0);
              total_db += g / (1.0 + (dx*dx)/(Math.max(0.2, bw*bw)));
            }
        }
        
        let y = h/2 - (total_db * (h/48));
        if(x==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    const wrapSection = (title, content, id, rstAction = '', extraClass = '') => `
      <div class="section-header">
        <span>${title}</span>
        <div class="edit-toggle-wrap">
          ${rstAction !== '' ? `<button style="background:#522; color:#fff; border:1px solid #f55; border-radius:3px; padding:2px 8px; font-weight:bold; font-size:9px; cursor:pointer;" onclick="${rstAction}">RST</button>` : ''}
          <label style="margin:0; font-size:10px;">EDIT</label>
          <input type="checkbox" onchange="document.getElementById('${id}').classList.toggle('locked', !this.checked)">
        </div>
      </div>
      <div id="${id}" class="dsp-section locked ${extraClass}">${content}</div>`;

    function buildUI() {
      // Update Tab Names
      ['A','B'].forEach((n,i) => {
          document.getElementById(`tab-in${n}`).innerText = dspState.in_n[i];
      });
      for(let i=1; i<=4; i++) {
          document.getElementById(`tab-out${i}`).innerText = dspState.out_n[i-1];
      }

      // Build Vertical VU Meters grid
      let mHtml = '<div class="pro-meters-grid">';
      const labels = [dspState.in_n[0], dspState.in_n[1], dspState.out_n[0], dspState.out_n[1], dspState.out_n[2], dspState.out_n[3]];
      
      labels.forEach((lbl, i) => {
        let isOut = i >= 2;
        let muteCls = (isOut ? dspState.out_mute[i-2] : dspState.in_mute[i]) ? 'led-mute active' : 'led-mute';
        
        mHtml += `
        <div class="meter-wrapper">
            <span class="meter-title">${lbl}</span>
            <div class="meter-row">
                <div class="db-scale-container">
                    <span class="db-val-0">0</span>
                    <span class="db-val-m10">-10</span>
                    <span class="db-val-m20">-20</span>
                    <span class="db-val-m40">-40</span>
                    <span class="db-val-m60">-60</span>
                </div>
                <div class="pro-meter-container">
                    <div id="mtr-${i}" class="pro-meter-fill"></div>
                    <div class="pro-meter-marks"></div>
                </div>
            </div>
            <div class="meter-indicators">
                <span id="ind-comp-${i}" class="led led-comp">COMP</span>
                <span id="ind-mute-${i}" class="led ${muteCls}">MUTE</span>
                <span id="ind-clip-${i}" class="led led-clip">CLIP</span>
            </div>
        </div>`;
      });
      
      mHtml += '</div>';
      document.getElementById('meter-grid').innerHTML = mHtml;

      // Inputs
      ['A', 'B'].forEach((name, i) => {
        let tab = document.getElementById('t-in' + name);
        if(!tab) return;
        
        let idlSafe = (dspState.idl && dspState.idl[i] !== undefined) ? dspState.idl[i] : 0;
        let gainVal = i === 0 ? dspState.vA : dspState.vB;

        let gainContent = createSlider('Gain', 'in', i, 'gn', -12, 24, gainVal, 'dB');
        
        let compContent = `
          <div style="display:flex; height:120px; gap:12px; margin-bottom:15px;">
              <canvas id="cvs-comp-in-${i}" width="280" height="120" style="flex:1; background:#000; border:1px solid #333; border-radius:5px; margin:0; box-shadow: inset 0 0 10px rgba(0,173,181,0.1);"></canvas>
              <div style="display:flex; flex-direction:column; align-items:center; width:24px;">
                  <span style="font-size:9px; color:#888; font-weight:bold;">GR</span>
                  <div style="flex:1; width:100%; background:#000; border:1px solid #333; border-radius:3px; position:relative; overflow:hidden; margin:4px 0;">
                      <div id="gr-bar-in-${i}" style="position:absolute; top:0; left:0; width:100%; height:0%; background:linear-gradient(to bottom, orange, red); transition:height 0.05s;"></div>
                  </div>
                  <span id="gr-txt-in-${i}" style="font-size:9px; color:#fff; font-weight:bold;">0.0</span>
              </div>
          </div>
          <div class="grid">
            ${createSlider('Thresh', 'incomp', i, 'thr', -40, 1, dspState.ict[i], 'dB')}
            ${createSlider('Ratio', 'incomp', i, 'rat', 1, 21, dspState.icr[i], ':1')}
            ${createSlider('Makeup', 'incomp', i, 'mak', 0, 20, dspState.icm[i], 'dB')}
            ${createSlider('Attack', 'incomp', i, 'atk', 1, 100, dspState.ica[i], 'ms')}
            ${createSlider('Release', 'incomp', i, 'rel', 10, 1000, dspState.icrel[i], 'ms', '', '10')}
          </div>`;

        let gateContent = createSlider('Gate Thresh', 'gate', i, 'thr', -90, 0, dspState.gth[i], 'dB') +
                          createSlider('Attack', 'gate', i, 'atk', 1, 100, dspState.gat[i], 'ms') +
                          createSlider('Release', 'gate', i, 'rel', 10, 1000, dspState.gre[i], 'ms');
                          
        let delayContent = createSlider('Delay', 'idl', i, '', 0, 200, idlSafe, 'ms', '', '0.1');

        let bbeContent = `<div class="grid">
            ${createSelect('Enable', 'bbe', i, 'e', ['BYPASS', 'ACTIVE'], dspState.bbe_e[i])}
            ${createSlider('Lo Contour', 'bbe', i, 'l', 0, 100, dspState.bbe_l[i], '%')}
            ${createSlider('Process', 'bbe', i, 'p', 0, 100, dspState.bbe_p[i], '%')}
        </div>`;

        let inMuteCls = dspState.in_mute[i] ? 'btn-mute active' : 'btn-mute';
        
        tab.innerHTML = `<div class="channel-header">${dspState.in_n[i]} <button class="btn-icon" onclick="renameChannel('in', ${i})">✏️</button></div>` +
                         `<div class="btn-row">
                           <button id="btn-mute-in-${i}" class="${inMuteCls}" onclick="toggleMute('in', ${i})">MUTE ${dspState.in_n[i]}</button>
                           <button class="btn-revert" style="width:100%" onclick="revertTab('in', ${i})">RESET ALL</button>
                         </div>` + 
                         wrapSection(`GAIN`, `<div style="display:flex; flex-direction:column; gap:8px;">${gainContent}</div>`, `sec-in-gain-${name}`) +
                         wrapSection(`INPUT COMPRESSOR`, compContent, `sec-in-comp-${name}`, `revertBlock(${i}, 'incomp')`) +
                         wrapSection(`NOISE GATE`, `<div style="display:flex; flex-direction:column; gap:8px;">${gateContent}</div>`, `sec-in-gate-${name}`) +
                         wrapSection(`DELAY`, `<div style="display:flex; flex-direction:column; gap:8px;">${delayContent}</div>`, `sec-in-dly-${name}`) +
                         wrapSection(`BBE SONIC MAXIMIZER`, bbeContent, `sec-in-bbe-${name}`);
      });

      // Outputs
      for(let i=0; i<4; i++) {
        let tab = document.getElementById('t-out' + (i+1));
        if(!tab) continue;
        
        // Copy Options Logic
        let copyOptions = `<option value="">Select Channel...</option>`;
        for(let c=0; c<4; c++) {
            if(c !== i) copyOptions += `<option value="${c}">OUT ${c+1} (${dspState.out_n[c]})</option>`;
        }
        let copyContent = `
            <div class="control-group" style="background:#2a2a2a; border: 1px solid #00ADB5;">
                <label style="color:#00ADB5;">COPY SETTINGS FROM</label>
                <div style="display:flex; gap:10px;">
                    <select id="copy_src_${i}" style="flex:1;">${copyOptions}</select>
                    <button class="btn-bypass" onclick="copyChannel(${i})" style="padding: 4px 12px;">COPY</button>
                </div>
            </div>
        `;

        let phaseCls = dspState.ph[i] === 1 ? 'background:orange; color:#000;' : 'background:#2A2A2A; color:#fff;';
        let routeContent = `
        ${copyContent}
        <div class="grid" style="margin-top:15px;">
          ${createSelect('Route', 'rt', i, '', ['OFF', 'IN A', 'IN B', 'MIX'], dspState.rt[i])}
          <div class="control-group">
            <label>Phase</label>
            <button onclick="sendUpdate('ph', ${i}, 'v', ${dspState.ph[i]===1?0:1})" style="width:100%; padding:6px; border:none; border-radius:3px; cursor:pointer; font-weight:bold; ${phaseCls}">${dspState.ph[i]===1?'INV 180&deg;':'NORM 0&deg;'}</button>
          </div>
          ${createSlider('Delay', 'dl', i, '', 0, 200, dspState.dl[i], 'ms', '', '0.1')}
        </div>
        <div style="margin-top:15px; color:#00ADB5; font-size:11px; font-weight:bold; margin-bottom:10px; letter-spacing:0.5px;">ALL-PASS FILTER (PHASE ALIGN)</div>
        <div class="grid">
          ${createSelect('Enable APF', 'apf', i, 'e', ['BYPASS', 'ACTIVE'], dspState.apfe[i])}
          ${createSlider('APF Freq', 'apf', i, 'f', 20, 20000, dspState.apff[i], 'Hz', '', '10')}
          ${createSlider('APF Q', 'apf', i, 'q', 0.1, 10, dspState.apfq[i], '', '', '0.1')}
        </div>`;

        // Generate Crossover Comparison Visualizer
        let compareSelects = '';
        for(let d=0; d<4; d++) {
          let defaultVal = (d === 0) ? (i + 1) : 0; 
          compareSelects += `<select id="xo_cmp_${i}_${d}" onchange="drawVisibleGraphs()" style="font-size:11px; padding:4px; font-weight:bold;">
            <option value="0" ${defaultVal===0?'selected':''}>OFF</option>
            <option value="1" ${defaultVal===1?'selected':''}>OUT 1</option>
            <option value="2" ${defaultVal===2?'selected':''}>OUT 2</option>
            <option value="3" ${defaultVal===3?'selected':''}>OUT 3</option>
            <option value="4" ${defaultVal===4?'selected':''}>OUT 4</option>
          </select>`;
        }
        
        let xoAlignmentContent = `
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:10px;">
            ${compareSelects}
          </div>
          <canvas id="cvs-xo-cmp-${i}" width="400" height="140" style="margin:0; box-shadow: inset 0 0 10px rgba(255,255,255,0.05);"></canvas>
        `;

        let xoContent = `<div class="grid">
          ${createSelect('HPF Slope', 'xo', i, 't', ['OFF', 'BW12', 'BW24', 'BW48', 'LR12', 'LR24', 'LR48'], dspState.xt[i])}
          ${createSelect('LPF Slope', 'xo', i, 'th', ['OFF', 'BW12', 'BW24', 'BW48', 'LR12', 'LR24', 'LR48'], dspState.xth[i])}
          ${createSlider('HPF Freq', 'xo', i, 'fl', 20, 20000, dspState.xfl[i], 'Hz', '', '10')}
          ${createSlider('LPF Freq', 'xo', i, 'fh', 20, 20000, dspState.xfh[i], 'Hz', '', '10')}
          ${createSlider('Gain', 'xo', i, 'g', -12, 6, dspState.xo_gn[i], 'dB')}
        </div>`;

        let eqBypassed = dspState.eqb[i] === 1;
        let eqContent = `
          <div style="margin-bottom:12px; text-align:right;">
            <button class="btn-bypass ${eqBypassed ? 'active' : ''}" onclick="toggleEqBypass(${i})">
              ${eqBypassed ? 'EQ BYPASSED' : 'EQ ACTIVE'}
            </button>
          </div>
          <div class="grid">`;
          
        for(let b=0; b<7; b++) {
          eqContent += `
            <div style="grid-column: 1 / -1; display:flex; gap:8px; background:#111; padding:8px; margin-bottom:4px; border-radius:4px; border:1px solid #222;">
              <div style="flex:2">${createSlider(`B${b+1}`, 'eq', i, 'f', 20, 20000, dspState.eqf[i][b], 'Hz', b, '10')}</div>
              <div style="flex:1">${createSlider(`G`, 'eq', i, 'g', -12, 12, dspState.eq_gn[i][b], 'dB', b)}</div>
              <div style="flex:1">${createSlider(`Q`, 'eq', i, 'q', 0.1, 10, dspState.eqq[i][b], '', b, '0.1')}</div>
            </div>`;
        }
        eqContent += `</div>`;

        let compContent = `
          <div style="display:flex; height:120px; gap:12px; margin-bottom:15px;">
              <canvas id="cvs-comp-out-${i}" width="280" height="120" style="flex:1; background:#000; border:1px solid #333; border-radius:5px; margin:0; box-shadow: inset 0 0 10px rgba(255,165,0,0.1);"></canvas>
              <div style="display:flex; flex-direction:column; align-items:center; width:24px;">
                  <span style="font-size:9px; color:#888; font-weight:bold;">GR</span>
                  <div style="flex:1; width:100%; background:#000; border:1px solid #333; border-radius:3px; position:relative; overflow:hidden; margin:4px 0;">
                      <div id="gr-bar-out-${i}" style="position:absolute; top:0; left:0; width:100%; height:0%; background:linear-gradient(to bottom, orange, red); transition:height 0.05s;"></div>
                  </div>
                  <span id="gr-txt-out-${i}" style="font-size:9px; color:#fff; font-weight:bold;">0.0</span>
              </div>
          </div>
          <div class="grid">
            ${createSlider('Thresh', 'comp', i, 'thr', -40, 1, dspState.ct[i], 'dB')}
            ${createSlider('Ratio', 'comp', i, 'rat', 1, 21, dspState.cr[i], ':1')}
            ${createSlider('Makeup', 'comp', i, 'mak', 0, 20, dspState.cm[i], 'dB')}
            ${createSlider('Attack', 'comp', i, 'atk', 1, 100, dspState.ca[i], 'ms')}
            ${createSlider('Release', 'comp', i, 'rel', 10, 1000, dspState.crel[i], 'ms', '', '10')}
          </div>`;

        let outMuteCls = dspState.out_mute[i] ? 'btn-mute active' : 'btn-mute';
        
        tab.innerHTML = `<div class="channel-header">${dspState.out_n[i]} <button class="btn-icon" onclick="renameChannel('out', ${i})">✏️</button></div>` +
                         `<div class="btn-row">
                           <button id="btn-mute-out-${i}" class="${outMuteCls}" onclick="toggleMute('out', ${i})">MUTE ${dspState.out_n[i]}</button>
                           <button class="btn-revert" style="width:100%" onclick="revertTab('out', ${i})">RESET ALL</button>
                         </div>` +
                        wrapSection("ROUTING, PHASE & COPY", routeContent, `sec-rt-${i}`) +
                        wrapSection("CROSSOVER ALIGNMENT VIEW", xoAlignmentContent, `sec-xo-cmp-${i}`) +
                        wrapSection("BAND-PASS CROSSOVER", xoContent, `sec-xo-${i}`, `revertBlock(${i}, 'xo')`) +
                        `<canvas id="cvs-${i}" width="400" height="140"></canvas>` +
                        wrapSection("7-BAND PEQ", eqContent, `sec-eq-${i}`, `revertBlock(${i}, 'eq')`, eqBypassed ? 'bypassed' : '') +
                        wrapSection("COMPRESSOR", compContent, `sec-comp-${i}`, `revertBlock(${i}, 'comp')`);
      }

      // --- SYSTEM TAB ---
      let sysTab = document.getElementById('t-sys');
      if (sysTab) {
          let presetOptions = '';
          for(let s=1; s<=8; s++) {
              let lbl = `SLOT ${s}`;
              if(s==6) lbl += " (2 WAY FACTORY)";
              if(s==7) lbl += " (3 WAY FACTORY)";
              if(s==8) lbl += " (4 WAY FACTORY)";
              presetOptions += `<option value="${s}">${lbl}</option>`;
          }
          let presetHtml = wrapSection("PRESET MANAGEMENT", `
              <div class="control-group">
                  <label>Select Preset Slot</label>
                  <select id="sys-preset-slot" onchange="updatePresetButtons()">${presetOptions}</select>
              </div>
              <div class="btn-row" style="margin-top:10px; gap:8px;">
                  <button class="btn-connect" style="flex:1; padding:10px; font-size:11px; background:#4CAF50; color:#fff;" onclick="doPreset('load')">LOAD</button>
                  <button id="btn-preset-save" class="btn-connect" style="flex:1; padding:10px; font-size:11px; background:#FF9800; color:#fff;" onclick="doPreset('save')">SAVE</button>
                  <button id="btn-preset-ren" class="btn-connect" style="flex:1; padding:10px; font-size:11px; background:#9E9E9E; color:#fff;" onclick="doPreset('rename')">RENAME</button>
              </div>
          `, 'sec-sys-preset');

          let isSine = dspState.tm === 2;
          let toneHtml = wrapSection("TONE GENERATOR", `
              <div class="grid">
                  ${createSelect('Mode', 'tone', 0, 'm', ['OFF', 'PINK NOISE', 'SINE WAVE'], dspState.tm)}
                  ${createSelect('Route', 'tone', 0, 'r', ['ALL IN', 'IN A', 'IN B', 'OUT 1', 'OUT 2', 'OUT 3', 'OUT 4'], dspState.tr)}
                  <div id="tone-freq-container" style="transition:0.2s; opacity: ${isSine ? '1' : '0.4'}; pointer-events: ${isSine ? 'auto' : 'none'};">
                    ${createSlider('Freq', 'tone', 0, 'f', 20, 20000, dspState.tf, 'Hz', '', '10')}
                  </div>
                  ${createSlider('Gain', 'tone', 0, 'g', -60, 0, dspState.tg, 'dB')}
              </div>
          `, 'sec-sys-tone');

          let otaHtml = wrapSection("FIRMWARE UPDATE (OTA)", `
              <div class="control-group" style="margin-bottom:10px;">
                  <label>WiFi SSID</label>
                  <input type="text" id="ota-ssid" class="txt-input" placeholder="Enter WiFi Name">
              </div>
              <div class="control-group" style="margin-bottom:10px;">
                  <label>WiFi Password</label>
                  <input type="password" id="ota-pass" class="txt-input" placeholder="Enter Password">
              </div>
              <div class="control-group" style="margin-bottom:10px;">
                  <label>Firmware Flavor (GitHub)</label>
                  <div style="display:flex; gap:10px;">
                      <select id="ota-version" style="flex:1; padding:8px;"><option>Select firmware...</option></select>
                      <button id="btn-ota-fetch" class="btn-bypass" onclick="fetchGithubReleases()">FETCH</button>
                  </div>
              </div>
              <button class="btn-connect" style="width:100%; margin-top:10px; background:#00ADB5; color:#000;" onclick="triggerOTA()">START UPDATE</button>
          `, 'sec-sys-ota');

          sysTab.innerHTML = presetHtml + toneHtml + otaHtml;
          updatePresetButtons(); 
      }
      
      drawVisibleGraphs();
      drawRTA();
      drawCompVisualizers();
    }

    async function revertTab(type, ch) {
      if(!confirm(`Reset entire ${type.toUpperCase()} Channel ${type === 'in' ? dspState.in_n[ch] : dspState.out_n[ch]} to default flat values?`)) return;
      if (type === 'in') {
          sendBLE(`/api/set?type=in&ch=${ch}&v=0`);
          sendBLE(`/api/set?type=gate&ch=${ch}&p=thr&v=-75`);
          sendBLE(`/api/set?type=gate&ch=${ch}&p=atk&v=10`);
          sendBLE(`/api/set?type=gate&ch=${ch}&p=rel&v=200`);
          sendBLE(`/api/set?type=idl&ch=${ch}&v=0`);
          sendBLE(`/api/set?type=bbe&ch=${ch}&p=e&v=0`);
          sendBLE(`/api/set?type=bbe&ch=${ch}&p=l&v=50`);
          sendBLE(`/api/set?type=bbe&ch=${ch}&p=p&v=50`);
          revertBlock(ch, 'incomp', true);
      } else if (type === 'out') {
          sendBLE(`/api/set?type=rt&ch=${ch}&v=${(ch%2)+1}`);
          sendBLE(`/api/set?type=ph&ch=${ch}&v=0`);
          sendBLE(`/api/set?type=dl&ch=${ch}&v=0`);
          sendBLE(`/api/set?type=apf&ch=${ch}&p=e&v=0`);
          sendBLE(`/api/set?type=apf&ch=${ch}&p=f&v=1000`);
          sendBLE(`/api/set?type=apf&ch=${ch}&p=q&v=0.7`);
          
          revertBlock(ch, 'xo', true);
          revertBlock(ch, 'eq', true);
          revertBlock(ch, 'comp', true);
      }
      sendBLE('/api/dump');
    }

    async function revertBlock(ch, block, skipConfirm = false) {
      if(!skipConfirm && !confirm(`Reset this DSP section to default flat values?`)) return;
      if (block === 'xo') {
        sendBLE(`/api/set?type=xo&ch=${ch}&p=t&v=0`);
        sendBLE(`/api/set?type=xo&ch=${ch}&p=th&v=0`);
        sendBLE(`/api/set?type=xo&ch=${ch}&p=fl&v=80`);
        sendBLE(`/api/set?type=xo&ch=${ch}&p=fh&v=5000`);
        sendBLE(`/api/set?type=xo&ch=${ch}&p=g&v=0`);
      } else if (block === 'eq') {
        const defFreqs = [60, 150, 400, 1000, 2400, 6000, 12000];
        for(let b=0; b<7; b++) {
          sendBLE(`/api/set?type=eq&ch=${ch}&p=f&b=${b}&v=${defFreqs[b]}`);
          sendBLE(`/api/set?type=eq&ch=${ch}&p=g&b=${b}&v=0`);
          sendBLE(`/api/set?type=eq&ch=${ch}&p=q&b=${b}&v=1.41`);
        }
      } else if (block === 'comp') {
        sendBLE(`/api/set?type=comp&ch=${ch}&p=thr&v=0`);
        sendBLE(`/api/set?type=comp&ch=${ch}&p=rat&v=4`);
        sendBLE(`/api/set?type=comp&ch=${ch}&p=mak&v=0`);
        sendBLE(`/api/set?type=comp&ch=${ch}&p=atk&v=10`);
        sendBLE(`/api/set?type=comp&ch=${ch}&p=rel&v=100`);
      } else if (block === 'incomp') {
        sendBLE(`/api/set?type=incomp&ch=${ch}&p=thr&v=0`);
        sendBLE(`/api/set?type=incomp&ch=${ch}&p=rat&v=4`);
        sendBLE(`/api/set?type=incomp&ch=${ch}&p=mak&v=0`);
        sendBLE(`/api/set?type=incomp&ch=${ch}&p=atk&v=10`);
        sendBLE(`/api/set?type=incomp&ch=${ch}&p=rel&v=100`);
      }

      if (!skipConfirm) sendBLE('/api/dump');
    }
  </script>
</body>
</html>
