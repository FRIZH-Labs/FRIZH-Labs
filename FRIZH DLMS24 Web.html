<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRIZH DLMS 24 PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* 
     * PRO CONSOLE UI THEME 
     */
    :root {
      --bg-main: #0c0d10;
      --bg-panel: #16171b;
      --bg-section: #1d1e24;
      --border-color: #2a2c35;
      --accent-cyan: #00ADB5;
      --accent-orange: #ff9800;
      --accent-red: #f44336;
      --text-main: #d1d5db;
      --text-muted: #6b7280;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: var(--bg-main); color: var(--text-main); font-family: var(--font-family); font-size: 12px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* LAYOUT */
    .app-wrapper { display: flex; flex: 1; height: 100vh; overflow: hidden; }
    
    /* SIDEBAR NAV */
    .sidebar { width: 140px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; }
    .brand { padding: 20px 15px; font-size: 16px; font-weight: 900; color: var(--accent-cyan); letter-spacing: 2px; border-bottom: 1px solid var(--border-color); text-align: center; line-height: 1.2; }
    .brand span { font-size: 10px; color: var(--text-muted); display: block; letter-spacing: 1px; }
    
    .nav-tabs { display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding-top: 10px; }
    .tab { padding: 12px 20px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-left: 3px solid transparent; transition: 0.15s; font-size: 12px; letter-spacing: 1px; }
    .tab:hover { background: rgba(255,255,255,0.03); color: #fff; }
    .tab.active { background: rgba(0, 173, 181, 0.1); border-left-color: var(--accent-cyan); color: var(--accent-cyan); }
    .tab-sys { margin-top: auto; border-top: 1px solid var(--border-color); color: var(--accent-orange); }
    
    .ble-status { padding: 15px; text-align: center; border-top: 1px solid var(--border-color); font-size: 10px; background: #08080a; }
    .ble-btn { background: #222; color: #fff; border: 1px solid #444; width: 100%; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .ble-btn.connected { background: rgba(0,173,181,0.2); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .ble-btn:hover { background: #333; }

    /* MAIN CONTENT AREA */
    .main-view { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); overflow: hidden; }
    .panel { display: none; height: 100%; width: 100%; overflow-y: auto; padding: 20px; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* PRO CONSOLE GRID SYSTEM */
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .dashboard-title { font-size: 24px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    .dashboard-actions { display: flex; gap: 10px; }
    
    .channel-strip { display: grid; grid-template-columns: 280px 1fr; gap: 20px; height: calc(100% - 60px); }
    .strip-col { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; }
    .strip-col::-webkit-scrollbar { width: 6px; }
    .strip-col::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    /* WIDGET BLOCKS */
    .widget { background: var(--bg-section); border: 1px solid var(--border-color); border-radius: 6px; display: flex; flex-direction: column; }
    .widget-header { padding: 8px 12px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); font-size: 11px; font-weight: 800; color: var(--accent-cyan); display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; }
    .widget-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .widget.bypassed { opacity: 0.5; border-color: var(--accent-red); }

    /* CONTROLS (Knobs & Sliders) */
    .ctrl-row { display: flex; gap: 10px; }
    .ctrl-col { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    
    .fader-box { background: #111; border: 1px solid #333; padding: 10px; border-radius: 4px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .fader-label { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
    .fader-val { font-size: 13px; color: var(--accent-cyan); font-family: monospace; font-weight: bold; cursor: pointer; margin-bottom: 8px; background: rgba(0,173,181,0.1); padding: 2px 6px; border-radius: 3px; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #333; border-radius: 2px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #ddd; margin-top: -6px; border: 2px solid #222; }
    
    .btn { background: #2a2c35; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; text-transform: uppercase; transition: 0.15s; }
    .btn:hover { background: #3a3c45; }
    .btn-primary { background: rgba(0, 173, 181, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .btn-primary:hover { background: rgba(0, 173, 181, 0.3); }
    .btn-danger { background: rgba(244, 67, 54, 0.15); border-color: var(--accent-red); color: var(--accent-red); }
    .btn-danger:hover { background: rgba(244, 67, 54, 0.3); }
    .btn-danger.active { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px rgba(244, 67, 54, 0.5); }
    .btn-small { padding: 3px 8px; font-size: 9px; }

    select.pro-sel { background: #111; color: #fff; border: 1px solid #333; padding: 6px; border-radius: 4px; font-size: 11px; width: 100%; outline: none; cursor: pointer; }
    input.pro-in { background: #111; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 4px; font-size: 12px; width: 100%; outline: none; box-sizing: border-box; }

    /* GRAPHS */
    .graph-container { background: #000; border: 1px solid #333; border-radius: 4px; position: relative; width: 100%; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .graph-large { height: 260px; }
    .graph-medium { height: 180px; }
    .graph-small { height: 120px; }

    /* COMPRESSOR GR METER */
    .comp-layout { display: flex; gap: 10px; height: 120px; }
    .gr-meter-box { width: 24px; background: #000; border: 1px solid #333; border-radius: 3px; display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
    .gr-track { flex: 1; width: 12px; background: #111; position: relative; margin: 4px 0; border-radius: 2px; overflow: hidden; }
    .gr-fill { position: absolute; top: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(to bottom, #ff9800, #f44336); transition: height 0.05s; }

    /* VERTICAL VU METERS (MONITOR TAB) */
    .monitor-grid { display: flex; justify-content: center; gap: 20px; padding: 20px; height: 100%; }
    .vu-channel { display: flex; flex-direction: column; align-items: center; width: 60px; }
    .vu-title { font-weight: 900; font-size: 14px; margin-bottom: 15px; color: #fff; }
    .vu-meter-wrap { display: flex; gap: 5px; height: calc(100% - 150px); min-height: 200px; }
    .vu-scale { display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; font-family: monospace; color: #666; padding-bottom: 15px; padding-right: 4px; text-align: right; }
    .vu-track { width: 20px; background: #050505; border: 1px solid #222; border-radius: 3px; position: relative; overflow: hidden; }
    .vu-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #004400 0%, #00cc00 60%, #e6e600 80%, #ff0000 100%); transition: height 0.08s ease-out; }
    .vu-leds { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; width: 100%; }
    .led { padding: 4px 0; text-align: center; font-size: 9px; font-weight: 800; border-radius: 3px; background: #111; color: #444; border: 1px solid #222; }
    .led.active.clip { background: #f44336; color: #fff; border-color: #ff7961; box-shadow: 0 0 10px #f44336; }
    .led.active.comp { background: #ff9800; color: #000; border-color: #ffb74d; box-shadow: 0 0 10px #ff9800; }

    /* OVERLAYS */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12,13,16,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(4px); }
    .dialog { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 30px; border-radius: 8px; text-align: center; min-width: 300px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .hidden { display: none !important; }

    /* RESPONSIVE Adjustments for smaller screens, though heavily desktop optimized */
    @media (max-width: 1100px) {
      .channel-strip { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .strip-col { overflow: visible; }
      .panel { overflow-y: auto; }
    }
  </style>
</head>
<body>

  <!-- BLE CONNECTION OVERLAY -->
  <div id="connect-overlay" class="overlay">
    <div style="font-size: 36px; font-weight: 900; color: var(--accent-cyan); letter-spacing: 4px; margin-bottom: 40px;">FRIZH DLMS 24</div>
    <button class="btn btn-primary" style="font-size: 16px; padding: 15px 40px;" onclick="connectBLE()">SCAN & CONNECT</button>
    <p style="color:var(--text-muted); margin-top:20px; font-size: 12px; text-align:center;">Requires Google Chrome/Edge with Web Bluetooth enabled.</p>
  </div>

  <div id="ble-dialog-overlay" class="overlay hidden">
    <div class="dialog">
      <h3 style="color:var(--accent-cyan); margin-top:0;">DEVICE STATUS</h3>
      <p id="ble-connected-name" style="color:var(--text-main); margin-bottom: 25px;">Connected to: Unknown</p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-primary" onclick="switchDevice()">SWITCH DEVICE</button>
        <button class="btn btn-danger" onclick="disconnectBLE()">DISCONNECT</button>
        <button class="btn" onclick="closeBleDialog()">CANCEL</button>
      </div>
    </div>
  </div>

  <div class="app-wrapper">
    <!-- SIDEBAR NAV -->
    <nav class="sidebar">
      <div class="brand">FRIZH<span>DLMS 24</span></div>
      <div class="nav-tabs" id="tabs">
        <div class="tab active" id="tab-meters" onclick="switchTab('t-meters')">MONITOR</div>
        <div class="tab" id="tab-rta" onclick="switchTab('t-rta')">RTA SPECTRUM</div>
        <div style="margin: 10px 15px; font-size: 10px; color: #555; border-bottom: 1px solid #333; padding-bottom: 5px;">INPUTS</div>
        <div class="tab" id="tab-inA" onclick="switchTab('t-inA')">IN A</div>
        <div class="tab" id="tab-inB" onclick="switchTab('t-inB')">IN B</div>
        <div style="margin: 10px 15px; font-size: 10px; color: #555; border-bottom: 1px solid #333; padding-bottom: 5px;">OUTPUTS</div>
        <div class="tab" id="tab-out1" onclick="switchTab('t-out1')">OUT 1</div>
        <div class="tab" id="tab-out2" onclick="switchTab('t-out2')">OUT 2</div>
        <div class="tab" id="tab-out3" onclick="switchTab('t-out3')">OUT 3</div>
        <div class="tab" id="tab-out4" onclick="switchTab('t-out4')">OUT 4</div>
        
        <div class="tab tab-sys" id="tab-sys" onclick="switchTab('t-sys')">SYSTEM</div>
      </div>
      <div class="ble-status">
        <button id="ble-btn" class="ble-btn" onclick="handleBleIconClick()">BLUETOOTH</button>
      </div>
    </nav>

    <!-- MAIN VIEW -->
    <main class="main-view">
      <!-- MONITOR TAB -->
      <div id="t-meters" class="panel active"><div id="meter-grid" class="monitor-grid"></div></div>
      
      <!-- RTA TAB -->
      <div id="t-rta" class="panel">
        <div class="dashboard-header">
            <div class="dashboard-title">RTA SPECTRUM</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:20px; height:calc(100% - 60px);">
            <div class="widget" style="flex:1;">
                <div class="widget-header">INPUT A</div>
                <div class="widget-body"><div class="graph-container" style="height:100%;"><canvas id="cvs-rta-A"></canvas></div></div>
            </div>
            <div class="widget" style="flex:1;">
                <div class="widget-header" style="color:var(--accent-orange);">INPUT B</div>
                <div class="widget-body"><div class="graph-container" style="height:100%;"><canvas id="cvs-rta-B"></canvas></div></div>
            </div>
        </div>
      </div>
      
      <!-- CHANNEL TABS WILL BE INJECTED HERE -->
      <div id="t-inA" class="panel"></div>
      <div id="t-inB" class="panel"></div>
      <div id="t-out1" class="panel"></div>
      <div id="t-out2" class="panel"></div>
      <div id="t-out3" class="panel"></div>
      <div id="t-out4" class="panel"></div>
      <div id="t-sys" class="panel"></div>
    </main>
  </div>

  <script>
    let dspState = {};
    let initialState = null;
    let timers = {};
    let draggingBand = { ch: -1, band: -1, type: '' }; // type: 'eq' or 'deq'
    
    // Live Audio State
    let livePeaks = [0,0,0,0,0,0];
    let compAct = [0,0,0,0];
    let inCompAct = [0,0];
    let rtaA = new Array(31).fill(-60.0);
    let rtaB = new Array(31).fill(-60.0);

    // Web Bluetooth Variables
    let bleDevice, bleServer, bleService, rxChar, txChar;
    let bleQueue = [];
    let isWriting = false;
    let jsonBuffer = "";

    window.addEventListener('resize', () => {
        drawVisibleGraphs();
        drawRTA();
        drawCompVisualizers();
    });

    function getDpiCtx(cvs) {
        if(!cvs) return null;
        let dpr = window.devicePixelRatio || 1;
        let rect = cvs.getBoundingClientRect();
        if(rect.width === 0) return null;
        cvs.width = rect.width * dpr;
        cvs.height = rect.height * dpr;
        let ctx = cvs.getContext('2d', {alpha: false});
        ctx.scale(dpr, dpr);
        return { ctx, w: rect.width, h: rect.height };
    }

    /* --- BLE LOGIC --- */
    function handleBleIconClick() {
      if (bleDevice && bleDevice.gatt.connected) {
         document.getElementById('ble-connected-name').innerText = "Connected to:\n" + (bleDevice.name || "FRIZH DLMS");
         document.getElementById('ble-dialog-overlay').classList.remove('hidden');
      } else {
         connectBLE();
      }
    }
    function closeBleDialog() { document.getElementById('ble-dialog-overlay').classList.add('hidden'); }
    function disconnectBLE() { if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect(); closeBleDialog(); }
    async function switchDevice() { disconnectBLE(); setTimeout(() => connectBLE(), 400); }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'FRIZH_DLMS24_' }], 
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });
        
        bleDevice.addEventListener('gattserverdisconnected', () => { 
            document.getElementById('ble-btn').classList.remove('connected');
            document.getElementById('connect-overlay').classList.remove('hidden'); 
        });

        bleServer = await bleDevice.gatt.connect();
        bleService = await bleServer.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
        rxChar = await bleService.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
        txChar = await bleService.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');
        
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleNotifications);
        
        document.getElementById('connect-overlay').classList.add('hidden');
        document.getElementById('ble-btn').classList.add('connected');
        closeBleDialog(); 
        sendBLE('/api/dump');
      } catch(e) { 
        console.error("BLE Error:", e);
        if (e.name !== 'NotFoundError') alert("Bluetooth Connection Failed.");
      }
    }

    async function processBleQueue() {
      if(isWriting || bleQueue.length === 0 || !rxChar) return;
      isWriting = true;
      let cmd = bleQueue.shift();
      try {
        await rxChar.writeValueWithoutResponse(new TextEncoder().encode(cmd));
      } catch(e) { console.log("BLE Write Error", e); }
      isWriting = false;
      setTimeout(processBleQueue, 15);
    }
    function sendBLE(cmd) { bleQueue.push(cmd); processBleQueue(); }

    function handleNotifications(event) {
      let val = new TextDecoder().decode(event.target.value);
      if(val.startsWith("S:")) {
        let p = val.substring(2).split(',');
        if(p.length >= 18) {
            for(let i=0; i<6; i++) {
                livePeaks[i] = parseFloat(p[i]) || 1e-9;
                if(document.getElementById('t-meters').classList.contains('active')) {
                    let db = (20 * Math.log10(livePeaks[i])) - 3.0; 
                    let pct = Math.max(0, Math.min(100, (db + 60) * (100 / 60))); 
                    let mtr = document.getElementById(`mtr-${i}`);
                    if(mtr) mtr.style.height = pct + '%';
                    let clipLed = document.getElementById(`ind-clip-${i}`);
                    if(clipLed) clipLed.classList.toggle('active', db >= -3.5); 
                }
            }
            if (dspState.in_mute !== undefined) {
              for(let i=0; i<2; i++) {
                dspState.in_mute[i] = (p[6+i] === '1');
                inCompAct[i] = parseInt(p[16+i]);
                let btn = document.getElementById(`btn-mute-in-${i}`);
                if(btn) { btn.classList.toggle('active', dspState.in_mute[i]); btn.innerText = dspState.in_mute[i] ? 'MUTED' : 'MUTE'; }
                let compLed = document.getElementById(`ind-comp-${i}`);
                if(compLed) compLed.classList.toggle('active', inCompAct[i] === 1);
              }
              for(let i=0; i<4; i++) {
                dspState.out_mute[i] = (p[8+i] === '1');
                compAct[i] = parseInt(p[12+i]);
                let btn = document.getElementById(`btn-mute-out-${i}`);
                if(btn) { btn.classList.toggle('active', dspState.out_mute[i]); btn.innerText = dspState.out_mute[i] ? 'MUTED' : 'MUTE'; }
                let compLed = document.getElementById(`ind-comp-${i+2}`);
                if(compLed) compLed.classList.toggle('active', compAct[i] === 1);
              }
            }
            drawCompVisualizers();
            // Trigger DEQ redraw if on input tab to show dynamic response
            if(document.getElementById('t-inA').classList.contains('active')) drawDeqGraph(0);
            if(document.getElementById('t-inB').classList.contains('active')) drawDeqGraph(1);
        }
      } else if (val.startsWith("R:")) {
        let halves = val.substring(2).split('|');
        if (halves.length === 2) {
          let aVals = halves[0].split(','); let bVals = halves[1].split(',');
          for (let i = 0; i < 31; i++) {
            if (aVals[i] !== "") { let raw = parseFloat(aVals[i]); rtaA[i] = raw > rtaA[i] ? raw : Math.max(-60, rtaA[i] - 1.5); }
            if (bVals[i] !== "") { let raw = parseFloat(bVals[i]); rtaB[i] = raw > rtaB[i] ? raw : Math.max(-60, rtaB[i] - 1.5); }
          }
          drawRTA();
        }
      } else if (val.startsWith("J:{")) {
        jsonBuffer = val.substring(2);
      } else if (val.startsWith("J:")) {
        jsonBuffer += val.substring(2);
        if(jsonBuffer.endsWith("}")) {
          try {
              dspState = JSON.parse(jsonBuffer);
              if(!dspState.eqb) dspState.eqb = [0,0,0,0];
              if(dspState.tm === undefined) dspState.tm = 0;
              if(dspState.tf === undefined) dspState.tf = 1000;
              if(dspState.tg === undefined) dspState.tg = -20;
              if(dspState.tr === undefined) dspState.tr = 0;
              if(!dspState.bbe_e) dspState.bbe_e = [0,0];
              if(!dspState.bbe_l) dspState.bbe_l = [50,50];
              if(!dspState.bbe_p) dspState.bbe_p = [50,50];
              if(!dspState.ict) dspState.ict = [0,0];
              if(!dspState.icr) dspState.icr = [4,4];
              if(!dspState.icm) dspState.icm = [0,0];
              if(!dspState.ica) dspState.ica = [10,10];
              if(!dspState.icrel) dspState.icrel = [100,100];
              if(!dspState.in_n) dspState.in_n = ["INPUT A", "INPUT B"];
              if(!dspState.out_n) dspState.out_n = ["OUTPUT 1", "OUTPUT 2", "OUTPUT 3", "OUTPUT 4"];
              if(!dspState.afs_e) dspState.afs_e = [0,0];
              if(!dspState.afs_s) dspState.afs_s = [3,3];
              if(!dspState.afs_f) dspState.afs_f = [[0,0,0,0], [0,0,0,0]];
              if(!dspState.deq_e) dspState.deq_e = [0,0];
              if(!dspState.deq_f) dspState.deq_f = [[150,1000,5000], [150,1000,5000]];
              if(!dspState.deq_q) dspState.deq_q = [[1.4,1.4,1.4], [1.4,1.4,1.4]];
              if(!dspState.deq_t) dspState.deq_t = [[-20,-20,-20], [-20,-20,-20]];
              if(!dspState.deq_r) dspState.deq_r = [[0,0,0], [0,0,0]];
              if(!dspState.deq_d) dspState.deq_d = [[0,0,0], [0,0,0]]; 
              initialState = JSON.stringify(dspState);
              buildUI();
          } catch(e) { console.log("JSON Parse err", e); }
          jsonBuffer = "";
        }
      }
    }

    /* --- UI GENERATION & CONTROL LOGIC --- */
    function switchTab(id) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      let tabBtn = document.getElementById('tab-' + id.substring(2));
      if(tabBtn) tabBtn.classList.add('active');
      
      if(id.startsWith('t-out')) drawVisibleGraphs();
      if(id.startsWith('t-in')) { drawDeqGraph(id.endsWith('A')?0:1); }
      if(id === 't-rta') drawRTA();
      drawCompVisualizers();
    }

    function sendUpdate(type, ch, param, val, band = '') {
      clearTimeout(timers[type+ch+param+band]);
      timers[type+ch+param+band] = setTimeout(() => {
        sendBLE(`/api/set?type=${type}&ch=${ch}&p=${param}&v=${val}${band !== '' ? '&b='+band : ''}`);
      }, 40);
    }

    function promptFreq(id, min, max) {
        let val = prompt(`Enter frequency (${min} - ${max} Hz):`);
        if (val !== null && val.trim() !== '') {
            val = parseFloat(val);
            if (!isNaN(val)) {
                val = Math.max(min, Math.min(max, val));
                let el = document.getElementById(id);
                if (el) {
                    el.value = ((Math.log10(val) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
                    handleSliderInput(el);
                }
            }
        }
    }

    function handleSliderInput(el) {
      let type = el.getAttribute('data-type'), ch = parseInt(el.getAttribute('data-ch'));
      let p = el.getAttribute('data-p'), b = el.getAttribute('data-b');
      let unit = el.getAttribute('data-unit'), step = el.getAttribute('step');
      let isFreq = (p === 'f' || p === 'fl' || p === 'fh');
      
      let realVal = parseFloat(el.value);
      if (isFreq) {
         let min = parseFloat(el.getAttribute('data-min')), max = parseFloat(el.getAttribute('data-max'));
         let logMin = Math.log10(min), logMax = Math.log10(max);
         realVal = Math.pow(10, logMin + (realVal / 1000) * (logMax - logMin));
         if(realVal > 10000) realVal = Math.round(realVal / 100) * 100;
         else if(realVal > 1000) realVal = Math.round(realVal / 10) * 10;
         else realVal = Math.round(realVal);
      }

      let displayVal = realVal.toFixed((unit === '' || step === '0.1') ? 1 : 0) + unit;
      if (type === 'dl' || type === 'idl') displayVal = realVal.toFixed(1) + 'ms / ' + (realVal * 34.3).toFixed(1) + 'cm';
      if (type === 'comp' || type === 'incomp') {
          if (p === 'thr' && realVal >= 1) displayVal = "OFF";
          if (p === 'rat' && realVal >= 21) displayVal = "LIMIT";
      }

      // Update local state immediately for graphs
      if (type === 'eq') {
          if(p === 'f') dspState.eqf[ch][b] = realVal;
          if(p === 'g') dspState.eq_gn[ch][b] = realVal;
          if(p === 'q') dspState.eqq[ch][b] = realVal;
      }
      if (type === 'deq') {
          if(p === 'f') dspState.deq_f[ch][b] = realVal;
          if(p === 'd') { dspState.deq_d[ch][b] = realVal; displayVal = (realVal>0?'+':'') + realVal.toFixed(0) + 'dB'; }
          if(p === 'q') dspState.deq_q[ch][b] = realVal;
          if(p === 'r') { dspState.deq_r[ch][b] = realVal; displayVal = realVal === 0 ? "STATIC" : realVal.toFixed(0) + ":1"; }
          if(p === 't') dspState.deq_t[ch][b] = realVal;
      }
      if (type === 'xo') {
          if(p === 't') dspState.xt[ch] = realVal;
          if(p === 'th') dspState.xth[ch] = realVal;
          if(p === 'fl') dspState.xfl[ch] = realVal;
          if(p === 'fh') dspState.xfh[ch] = realVal;
          if(p === 'g') dspState.xo_gn[ch] = realVal;
      }

      el.closest('.fader-box').querySelector('.fader-val').innerText = displayVal;
      sendUpdate(type, ch, p, realVal, b);
      
      if (type === 'xo' || type === 'eq') drawVisibleGraphs();
      if (type === 'deq') drawDeqGraph(ch);
      if (type === 'comp' || type === 'incomp') {
          if(type === 'incomp') { dspState.ict[ch]=p=='thr'?realVal:dspState.ict[ch]; dspState.icr[ch]=p=='rat'?realVal:dspState.icr[ch]; dspState.icm[ch]=p=='mak'?realVal:dspState.icm[ch]; }
          else { dspState.ct[ch]=p=='thr'?realVal:dspState.ct[ch]; dspState.cr[ch]=p=='rat'?realVal:dspState.cr[ch]; dspState.cm[ch]=p=='mak'?realVal:dspState.cm[ch]; }
          drawCompVisualizers();
      }
    }

    function createFader(label, type, ch, param, min, max, val, unit, band = '', step = '1') {
      let id = `${type}_${param}_${ch}${band !== '' ? '_' + band : ''}`;
      let isFreq = (param === 'f' || param === 'fl' || param === 'fh');
      let displayVal = parseFloat(val).toFixed((unit === '' || step === '0.1') ? 1 : 0) + unit;
      
      if(type === 'dl' || type === 'idl') displayVal = parseFloat(val).toFixed(1) + 'ms';
      if (type === 'comp' || type === 'incomp') {
          if (param === 'thr' && parseInt(val) >= 1) displayVal = "OFF";
          if (param === 'rat' && parseInt(val) >= 21) displayVal = "LIMIT";
      }
      if (type === 'deq') {
          if (param === 'r') displayVal = parseInt(val) === 0 ? "STATIC" : parseInt(val) + ":1";
          if (param === 'd') displayVal = (parseInt(val) > 0 ? "+" : "") + parseInt(val) + "dB";
      }
      
      let htmlVal = val, htmlMin = min, htmlMax = max, htmlStep = step;
      let clickAction = '';
      if (isFreq) {
         htmlMin = 0; htmlMax = 1000; htmlStep = 1;
         htmlVal = ((Math.log10(val) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
         clickAction = `onclick="promptFreq('${id}', ${min}, ${max})"`;
      }

      return `
        <div class="fader-box" id="wrap_${id}">
          <div class="fader-label">${label}</div>
          <div class="fader-val" ${clickAction}>${displayVal}</div>
          <input type="range" id="${id}" data-type="${type}" data-ch="${ch}" data-p="${param}" data-b="${band}" data-min="${min}" data-max="${max}" data-unit="${unit}" min="${htmlMin}" max="${htmlMax}" step="${htmlStep}" value="${htmlVal}" oninput="handleSliderInput(this)">
        </div>`;
    }

    function createSelect(label, type, ch, param, options, val) {
      let id = `${type}_${param}_${ch}`;
      let opts = options.map((o, i) => `<option value="${i}" ${i==val?'selected':''}>${o}</option>`).join('');
      let oc = (type === 'tone' && param === 'm') ? `handleToneModeUpdate(this.value);` : `sendUpdate('${type}', ${ch}, '${param}', this.value); if('${type}'=='xo') drawVisibleGraphs();`;
      return `<div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:6px 10px; border:1px solid #333; border-radius:4px;">
                <span style="font-size:10px; color:var(--text-muted); font-weight:700; text-transform:uppercase;">${label}</span>
                <select class="pro-sel" style="width:auto; min-width:80px;" id="${id}" onchange="${oc}">${opts}</select>
              </div>`;
    }

    function toggleMute(type, ch) {
      let isMuted = (type === 'in') ? (dspState.in_mute[ch] = !dspState.in_mute[ch]) : (dspState.out_mute[ch] = !dspState.out_mute[ch]);
      let btn = document.getElementById(`btn-mute-${type}-${ch}`);
      if(btn) { btn.classList.toggle('active', isMuted); btn.innerText = isMuted ? 'MUTED' : 'MUTE'; }
      sendBLE(`/api/mute?type=${type}&ch=${ch}`);
    }

    function toggleBypass(type, ch) {
        if(type === 'eq') {
            dspState.eqb[ch] = dspState.eqb[ch] === 1 ? 0 : 1;
            document.getElementById(`wid-eq-${ch}`).classList.toggle('bypassed', dspState.eqb[ch] === 1);
            document.getElementById(`btn-byp-eq-${ch}`).innerText = dspState.eqb[ch] === 1 ? 'BYPASSED' : 'ACTIVE';
            sendBLE(`/api/set?type=eqb&ch=${ch}&p=v&v=${dspState.eqb[ch]}`);
            drawVisibleGraphs();
        } else if(type === 'deq') {
            dspState.deq_e[ch] = dspState.deq_e[ch] === 1 ? 0 : 1;
            document.getElementById(`wid-deq-${ch}`).classList.toggle('bypassed', dspState.deq_e[ch] === 0);
            document.getElementById(`btn-byp-deq-${ch}`).innerText = dspState.deq_e[ch] === 0 ? 'BYPASSED' : 'ACTIVE';
            sendBLE(`/api/set?type=deq&ch=${ch}&p=e&v=${dspState.deq_e[ch]}`);
            drawDeqGraph(ch);
        }
    }

    function copyChannel(type, targetCh) {
        let src = document.getElementById(`copy_src_${type}_${targetCh}`).value;
        if(src === "" || parseInt(src) === targetCh) return;
        if(confirm(`Copy settings from ${type.toUpperCase()} ${parseInt(src)+1} to ${type.toUpperCase()} ${targetCh+1}?`)) {
            sendBLE(`/api/copy?type=${type}&src=${src}&dst=${targetCh}`);
            setTimeout(() => sendBLE('/api/dump'), 500); // Reload state after copy
        }
    }

    /* --- DRAWING GRAPHS --- */
    function drawRTA() {
        if(!document.getElementById('t-rta').classList.contains('active')) return;
        drawSpectrum('cvs-rta-A', rtaA, '#00ADB5');
        drawSpectrum('cvs-rta-B', rtaB, '#ff9800');
    }

    function drawSpectrum(id, data, color) {
        let ctxData = getDpiCtx(document.getElementById(id));
        if(!ctxData) return;
        let { ctx, w, h } = ctxData;

        ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
        let indices = [0, 6, 12, 18, 24, 30];
        indices.forEach(i => { let x = (i/30)*w; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); });
        ctx.beginPath(); ctx.moveTo(0, h*0.33); ctx.lineTo(w, h*0.33); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, h*0.66); ctx.lineTo(w, h*0.66); ctx.stroke();
        
        let drawHeight = h;
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
        for(let b=0; b<31; b++) {
            let x = (b/30.0)*w;
            let db = Math.max(-60, Math.min(0, data[b]));
            let y = drawHeight - ((db + 60)/60) * drawHeight;
            if(b===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function drawCompVisualizers() {
        [0,1].forEach(i => { if(document.getElementById(`t-in${['A','B'][i]}`).classList.contains('active')) updateCompCanvas(i, true); });
        [0,1,2,3].forEach(i => { if(document.getElementById(`t-out${i+1}`).classList.contains('active')) updateCompCanvas(i, false); });
    }

    function updateCompCanvas(ch, isInput) {
        let cvs = document.getElementById(`cvs-comp-${isInput?'in':'out'}-${ch}`);
        let grFill = document.getElementById(`gr-fill-${isInput?'in':'out'}-${ch}`);
        if(!cvs || !grFill) return;

        let ctxData = getDpiCtx(cvs);
        if(!ctxData) return;
        let { ctx, w, h } = ctxData;
        
        let thr = isInput ? dspState.ict[ch] : dspState.ct[ch];
        let r = isInput ? dspState.icr[ch] : dspState.cr[ch];
        let rat = r >= 21 ? 1000.0 : r;
        let mak = isInput ? dspState.icm[ch] : dspState.cm[ch];
        let isOff = thr >= 1;
        
        let peakLinear = isInput ? livePeaks[ch] : livePeaks[ch+2];
        let peakDb = (peakLinear > 0.0001) ? Math.max(-60, Math.min(0, 20 * Math.log10(peakLinear) - 3.0)) : -60;
        let activeFlag = isInput ? inCompAct[ch] : compAct[ch];
        
        let simGr = 0.0;
        if(!isOff) {
            let outNoMak = peakDb - mak;
            if(outNoMak > thr) simGr = (outNoMak - thr) * (rat - 1);
            if(activeFlag === 1 && simGr < 1.5) simGr = 1.5 + (Math.max(0, peakDb + 40)/40.0 * Math.min(8, rat));
        }
        simGr = Math.max(0, Math.min(20, simGr));
        grFill.style.height = (simGr / 20.0 * 100) + '%';
        
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
        let minDb = -60, maxDb = 10, range = maxDb - minDb;
        let dbToX = db => ((db - minDb) / range) * w;
        let dbToY = db => h - (((db - minDb) / range) * h);
        
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(dbToX(0), 0); ctx.lineTo(dbToX(0), h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, dbToY(0)); ctx.lineTo(w, dbToY(0)); ctx.stroke();
        ctx.strokeStyle = '#333'; ctx.beginPath(); ctx.moveTo(dbToX(minDb), dbToY(minDb)); ctx.lineTo(dbToX(maxDb), dbToY(maxDb)); ctx.stroke();
        
        if(isOff) return;
        
        ctx.strokeStyle = isInput ? '#00ADB5' : '#ff9800'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
        ctx.moveTo(dbToX(minDb), dbToY(minDb + mak));
        ctx.lineTo(dbToX(thr), dbToY(thr + mak));
        ctx.lineTo(dbToX(maxDb), dbToY(thr + (maxDb - thr) / rat + mak));
        ctx.stroke();
        
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dbToX(thr), dbToY(thr + mak), 4, 0, Math.PI*2); ctx.fill();
        
        if(peakDb > minDb + 1.0) {
            let inDb = (peakDb - mak > thr) ? thr + (peakDb - mak - thr) * rat : peakDb - mak;
            ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.arc(dbToX(inDb), dbToY(peakDb), 4, 0, Math.PI*2); ctx.fill();
        }
    }

    // DRAG LOGIC
    function attachDragListeners(canvas, ch, type) {
        if(canvas.dataset.dragAttached) return;
        canvas.dataset.dragAttached = 'true';
        let isDragging = false;

        function getMousePos(evt) {
            let rect = canvas.getBoundingClientRect();
            let cX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            let cY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: cX - rect.left, y: cY - rect.top, w: rect.width, h: rect.height };
        }

        function onDown(e) {
            let pos = getMousePos(e);
            let minDist = Infinity, nearestB = -1;
            let logMin = Math.log10(20), logMax = Math.log10(20000);
            
            if(type === 'eq' && dspState.eqb[ch] === 1) return;
            if(type === 'deq' && dspState.deq_e[ch] === 0) return;
            
            let numBands = type === 'eq' ? 7 : 3;
            let zeroY = type === 'eq' ? pos.h * (15/45) : pos.h / 2; // DEQ uses middle for 0dB (+15 to -24 approx)
            let pixelPerDb = type === 'eq' ? (pos.h/45) : (pos.h/48);

            for(let b=0; b<numBands; b++) {
                let f = type === 'eq' ? dspState.eqf[ch][b] : dspState.deq_f[ch][b];
                let g = type === 'eq' ? dspState.eq_gn[ch][b] : dspState.deq_d[ch][b];
                let cx = ((Math.log10(f) - logMin) / (logMax - logMin)) * pos.w;
                let cy = zeroY - (g * pixelPerDb);
                let dist = Math.hypot(cx - pos.x, cy - pos.y);
                if(dist < 30 && dist < minDist) { minDist = dist; nearestB = b; }
            }
            if(nearestB !== -1) {
                isDragging = true; draggingBand = { ch, band: nearestB, type };
                if(e.cancelable) e.preventDefault();
            }
        }

        function onMove(e) {
            if(!isDragging || draggingBand.ch !== ch || draggingBand.type !== type) return;
            if(e.cancelable) e.preventDefault();
            let pos = getMousePos(e);
            let logMin = Math.log10(20), logMax = Math.log10(20000);
            
            let logF = logMin + (pos.x / pos.w) * (logMax - logMin);
            let newF = Math.max(20, Math.min(20000, Math.pow(10, logF)));

            let b = draggingBand.band;
            let newG = 0;
            if(type === 'eq') {
                newG = Math.max(-12, Math.min(12, (pos.h*(15/45) - pos.y) / (pos.h/45)));
                dspState.eqf[ch][b] = newF; dspState.eq_gn[ch][b] = newG;
                sendUpdate('eq', ch, 'f', newF, b); sendUpdate('eq', ch, 'g', newG, b);
                updateSliderUI(`eq_f_${ch}_${b}`, newF); updateSliderUI(`eq_g_${ch}_${b}`, newG);
                drawGraph(ch);
            } else {
                newG = Math.max(-24, Math.min(15, (pos.h/2 - pos.y) / (pos.h/48)));
                dspState.deq_f[ch][b] = newF; dspState.deq_d[ch][b] = newG;
                sendUpdate('deq', ch, 'f', newF, b); sendUpdate('deq', ch, 'd', newG, b);
                updateSliderUI(`deq_f_${ch}_${b}`, newF); updateSliderUI(`deq_d_${ch}_${b}`, newG);
                drawDeqGraph(ch);
            }
        }

        function onUp(e) {
            isDragging = false; draggingBand = { ch:-1, band:-1, type:'' };
            if(type === 'eq') drawGraph(ch); else drawDeqGraph(ch);
        }

        canvas.addEventListener('mousedown', onDown); canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onUp); canvas.addEventListener('mouseleave', onUp);
        canvas.addEventListener('touchstart', onDown, {passive:false});
        canvas.addEventListener('touchmove', onMove, {passive:false}); canvas.addEventListener('touchend', onUp);
    }

    function updateSliderUI(id, realVal) {
        let el = document.getElementById(id);
        if(!el) return;
        let isF = id.includes('_f_');
        if(isF) {
            let min = parseFloat(el.getAttribute('data-min')), max = parseFloat(el.getAttribute('data-max'));
            el.value = ((Math.log10(realVal) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 1000;
            el.closest('.fader-box').querySelector('.fader-val').innerText = realVal.toFixed(0) + 'Hz';
        } else {
            el.value = realVal;
            el.closest('.fader-box').querySelector('.fader-val').innerText = (realVal>0?'+':'') + realVal.toFixed(0) + 'dB';
        }
    }

    function drawDeqGraph(ch) {
      let cvs = document.getElementById(`cvs-deq-${ch}`);
      let ctxData = getDpiCtx(cvs);
      if(!ctxData) return;
      let { ctx, w, h } = ctxData;
      
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      
      // Grid
      [20,100,1000,10000,20000].forEach(f => {
          let x = (Math.log10(f)-logMin)/(logMax-logMin)*w;
          ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
      });
      let zeroY = h/2; // 0dB center line
      ctx.strokeStyle = '#444'; ctx.beginPath(); ctx.moveTo(0,zeroY); ctx.lineTo(w,zeroY); ctx.stroke();

      let isBypassed = dspState.deq_e[ch] === 0;
      let color = ch === 0 ? '#00ADB5' : '#ff9800';

      // Draw RTA Background Dimly
      let rData = ch === 0 ? rtaA : rtaB;
      let rtaPath = new Path2D();
      for(let b=0; b<31; b++) {
          let x = (b/30.0)*w; let db = Math.max(-60, Math.min(0, rData[b]));
          let y = h - ((db+60)/60)*h;
          if(b===0) { rtaPath.moveTo(x,h); rtaPath.lineTo(x,y); } else rtaPath.lineTo(x,y);
          if(b===30) rtaPath.lineTo(x,h);
      }
      ctx.fillStyle = color; ctx.globalAlpha = 0.15; ctx.fill(rtaPath); ctx.globalAlpha = 1.0;

      // Calc curves
      let liveP = livePeaks[ch]; 
      let liveDb = (liveP > 0.0001) ? 20 * Math.log10(liveP) - 3.0 : -60;
      
      let boundGains = [0,0,0], dynGains = [0,0,0];
      for(let b=0; b<3; b++) {
          let t = dspState.deq_t[ch][b], r = dspState.deq_r[ch][b], d = dspState.deq_d[ch][b];
          boundGains[b] = d;
          if(r === 0) dynGains[b] = d; // static
          else if(liveDb > t && r > 1.0 && d !== 0) {
              let chg = (liveDb - t) * (1.0 - 1.0/r);
              dynGains[b] = d < 0 ? Math.max(-chg, d) : Math.min(chg, d);
          }
      }

      let bPath = new Path2D(), dPath = new Path2D(), fPath = new Path2D();
      let first = true;
      for(let x=0; x<=w; x+=2) {
          let f = Math.pow(10, logMin + (x/w)*(logMax-logMin));
          let tBound = 0, tDyn = 0;
          if(!isBypassed) {
              for(let b=0; b<3; b++) {
                  let f0 = dspState.deq_f[ch][b], q = dspState.deq_q[ch][b];
                  let bell = Math.exp(-Math.pow(Math.log10(f/f0) * q * 2.8, 2));
                  tBound += boundGains[b] * bell; tDyn += dynGains[b] * bell;
              }
          }
          let yB = zeroY - (tBound * h/48), yD = zeroY - (tDyn * h/48);
          if(first) { bPath.moveTo(x,yB); dPath.moveTo(x,yD); fPath.moveTo(x,zeroY); fPath.lineTo(x,yD); first=false; }
          else { bPath.lineTo(x,yB); dPath.lineTo(x,yD); fPath.lineTo(x,yD); }
          if(x >= w-2) fPath.lineTo(x,zeroY);
      }

      ctx.fillStyle = color; ctx.globalAlpha = 0.3; ctx.fill(fPath); ctx.globalAlpha = 1.0;
      ctx.strokeStyle = color; ctx.globalAlpha = 0.4; ctx.lineWidth = 1; ctx.stroke(bPath);
      ctx.globalAlpha = 1.0; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(dPath);

      // Drag Nodes
      if(!isBypassed) {
          for(let b=0; b<3; b++) {
              let cx = ((Math.log10(dspState.deq_f[ch][b]) - logMin) / (logMax - logMin)) * w;
              let cy = zeroY - (dspState.deq_d[ch][b] * h/48);
              let isActive = (draggingBand.ch === ch && draggingBand.band === b && draggingBand.type === 'deq');
              
              ctx.strokeStyle = isActive ? color : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(cx, zeroY); ctx.lineTo(cx, cy); ctx.stroke();
              ctx.fillStyle = isActive ? color : 'rgba(255,255,255,0.2)';
              ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
              ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
          }
      }
      attachDragListeners(cvs, ch, 'deq');
    }

    function drawGraph(ch) {
      let cvs = document.getElementById(`cvs-${ch}`);
      let ctxData = getDpiCtx(cvs);
      if(!ctxData) return;
      let { ctx, w, h } = ctxData;
      
      ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
      
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
      let logMin = Math.log10(20), logMax = Math.log10(20000);
      [20,100,1000,10000,20000].forEach(f => {
          let x = (Math.log10(f)-logMin)/(logMax-logMin)*w;
          ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
      });
      let zeroY = h * (15/45);
      ctx.strokeStyle = '#444'; ctx.beginPath(); ctx.moveTo(0,zeroY); ctx.lineTo(w,zeroY); ctx.stroke();

      let color = ['#00ADB5', '#ff9800', '#9c27b0', '#8bc34a'][ch] || '#00ADB5';
      let xo_t = dspState.xt[ch]||0, xo_th = dspState.xth[ch]||0, f_low = dspState.xfl[ch]||20, f_high = dspState.xfh[ch]||20000, g_off = dspState.xo_gn[ch]||0;
      let orderL = [2,2,4,8,2,4,8][xo_t]||2, orderH = [2,2,4,8,2,4,8][xo_th]||2;
      let eqBypassed = dspState.eqb[ch] === 1;

      let path = new Path2D(), fillPath = new Path2D();
      let first = true;
      for(let x=0; x<=w; x+=2) {
        let f = Math.pow(10, logMin + (x/w)*(logMax-logMin));
        let tot_db = g_off;
        if(xo_t > 0) tot_db += -10*Math.log10(1+Math.pow(f_low/f, 2*orderL));
        if(xo_th > 0) tot_db += -10*Math.log10(1+Math.pow(f/f_high, 2*orderH));
        
        if(!eqBypassed) {
            for(let b=0; b<7; b++) {
              let g = dspState.eq_gn[ch][b]; if(g === 0) continue;
              let fc = dspState.eqf[ch][b], q = dspState.eqq[ch][b];
              tot_db += g * Math.exp(-Math.pow(Math.log10(f/fc) * q * 2.8, 2));
            }
        }
        let y = zeroY - (tot_db * (h/45));
        if(first) { path.moveTo(x,y); fillPath.moveTo(x,zeroY); fillPath.lineTo(x,y); first=false; } 
        else { path.lineTo(x,y); fillPath.lineTo(x,y); }
        if(x >= w-2) fillPath.lineTo(x,zeroY);
      }
      
      ctx.fillStyle = color; ctx.globalAlpha = 0.15; ctx.fill(fillPath); ctx.globalAlpha = 1.0;
      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(path);

      if(!eqBypassed) {
          for(let b=0; b<7; b++) {
              let cx = ((Math.log10(dspState.eqf[ch][b]) - logMin) / (logMax - logMin)) * w;
              let cy = zeroY - (dspState.eq_gn[ch][b] * h/45);
              let isActive = (draggingBand.ch === ch && draggingBand.band === b && draggingBand.type === 'eq');
              
              ctx.strokeStyle = isActive ? color : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(cx, zeroY); ctx.lineTo(cx, cy); ctx.stroke();
              ctx.fillStyle = isActive ? color : 'rgba(255,255,255,0.2)';
              ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
              ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
          }
      }
      attachDragListeners(cvs, ch, 'eq');
    }

    function drawVisibleGraphs() {
        for(let i=0; i<4; i++) {

                drawGraph(i);

            }
        }

    /* --- UI BUILDER --- */

        let mute = isOut ? dspState.out_mute[i-2] : dspState.in_mute[i];
        mHtml += `
          <div class="vu-channel">
            <div class="vu-title">${name}</div>
            <div class="vu-meter-wrap">
              <div class="vu-scale"><span>0</span><span>-10</span><span>-20</span><span>-40</span><span>-60</span></div>
              <div class="vu-track"><div id="mtr-${i}" class="vu-fill"></div></div>
            </div>
            <div class="vu-leds">
              <div id="ind-comp-${i}" class="led ${isOut?'comp':'comp'}">COMP</div>
              <div id="ind-mute-${i}" class="led ${mute?'active clip':''}">MUTE</div>
              <div id="ind-clip-${i}" class="led clip">CLIP</div>
            </div>
          </div>
        `;
      });
      document.getElementById('meter-grid').innerHTML = mHtml;

      // Inputs

        let deqHtml = '';
        for(let b=0; b<3; b++) {
            deqHtml += `<div class="ctrl-col" style="background:rgba(0,0,0,0.2); padding:10px; border-radius:4px; border:1px solid #222;">
                <div style="color:var(--accent-cyan); font-weight:800; font-size:10px; margin-bottom:5px;">BAND ${b+1}</div>
                ${createFader('FREQ', 'deq', i, 'f', 20, 20000, dspState.deq_f[i][b], 'Hz', b, '10')}
                ${createFader('DEPTH', 'deq', i, 'd', -24, 15, dspState.deq_d[i][b], 'dB', b)}
                ${createFader('Q', 'deq', i, 'q', 0.1, 10, dspState.deq_q[i][b], '', b, '0.1')}
                ${createFader('RATIO', 'deq', i, 'r', 0, 20, dspState.deq_r[i][b], ':1', b)}
                ${createFader('THRESH', 'deq', i, 't', -60, 0, dspState.deq_t[i][b], 'dB', b)}
            </div>`;
        }

        document.getElementById(`t-in${n}`).innerHTML = `
          <div class="dashboard-header">
            <div class="dashboard-title">${dspState.in_n[i]}</div>
            <div class="dashboard-actions">
              <button class="btn btn-danger ${dspState.in_mute[i]?'active':''}" id="btn-mute-in-${i}" onclick="toggleMute('in',${i})">${dspState.in_mute[i]?'MUTED':'MUTE'}</button>
            </div>
          </div>
          <div class="channel-strip">
            <div class="strip-col">
              <div class="widget">
                <div class="widget-header">CONFIG</div>
                <div class="widget-body">
                    ${createFader('MASTER GAIN', 'in', i, 'gn', -12, 24, i===0?dspState.vA:dspState.vB, 'dB')}
                    ${createFader('DELAY', 'idl', i, '', 0, 200, dspState.idl[i]||0, 'ms', '', '0.1')}
                </div>
              </div>
              <div class="widget">
                <div class="widget-header">NOISE GATE</div>
                <div class="widget-body">
                    ${createFader('THRESH', 'gate', i, 'thr', -90, 0, dspState.gth[i], 'dB')}
                    <div class="ctrl-row">
                        ${createFader('ATTACK', 'gate', i, 'atk', 1, 100, dspState.gat[i], 'ms')}
                        ${createFader('RELEASE', 'gate', i, 'rel', 10, 1000, dspState.gre[i], 'ms')}
                    </div>
                </div>
              </div>
              <div class="widget">
                <div class="widget-header">INPUT COMP</div>
                <div class="widget-body">
                    <div class="comp-layout">
                        <div class="graph-container" style="flex:1;"><canvas id="cvs-comp-in-${i}"></canvas></div>
                        <div class="gr-meter-box">
                            <span style="font-size:8px; font-weight:bold; color:#888;">GR</span>
                            <div class="gr-track"><div id="gr-fill-in-${i}" class="gr-fill"></div></div>
                        </div>
                    </div>
                    ${createFader('THRESH', 'incomp', i, 'thr', -40, 1, dspState.ict[i], 'dB')}
                    <div class="ctrl-row">
                        ${createFader('RATIO', 'incomp', i, 'rat', 1, 21, dspState.icr[i], ':1')}
                        ${createFader('MAKEUP', 'incomp', i, 'mak', 0, 20, dspState.icm[i], 'dB')}
                    </div>
                    <div class="ctrl-row">
                        ${createFader('ATTACK', 'incomp', i, 'atk', 1, 100, dspState.ica[i], 'ms')}
                        ${createFader('RELEASE', 'incomp', i, 'rel', 10, 1000, dspState.icrel[i], 'ms', '', '10')}
                    </div>
                </div>
              </div>
            </div>
            
            <div class="strip-col">
              <div class="widget" id="wid-deq-${i}" class="${dspState.deq_e[i]===0?'bypassed':''}">
                <div class="widget-header">
                    <span>DYNAMIC EQ</span>
                    <button class="btn btn-small ${dspState.deq_e[i]===0?'btn-danger':''}" id="btn-byp-deq-${i}" onclick="toggleBypass('deq',${i})">${dspState.deq_e[i]===0?'BYPASSED':'ACTIVE'}</button>
                </div>
                <div class="widget-body">
                    <div class="graph-container graph-medium"><canvas id="cvs-deq-${i}"></canvas></div>
                    <div class="ctrl-row">${deqHtml}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      // Outputs
      [0,1,2,3].forEach(i => {
        let eqHtml = '';
        for(let b=0; b<7; b++) {
            eqHtml += `<div class="ctrl-col" style="background:rgba(0,0,0,0.2); padding:10px; border-radius:4px; border:1px solid #222;">
                <div style="color:var(--accent-cyan); font-weight:800; font-size:10px; margin-bottom:5px;">B${b+1}</div>
                ${createFader('FREQ', 'eq', i, 'f', 20, 20000, dspState.eqf[i][b], 'Hz', b, '10')}
                ${createFader('GAIN', 'eq', i, 'g', -12, 12, dspState.eq_gn[i][b], 'dB', b)}
                ${createFader('Q', 'eq', i, 'q', 0.1, 10, dspState.eqq[i][b], '', b, '0.1')}
            </div>`;
        }

        let copyOpts = `<option value="">SELECT...</option>` + [0,1,2,3].filter(c=>c!==i).map(c=>`<option value="${c}">OUT ${c+1}</option>`).join('');

        document.getElementById(`t-out${i+1}`).innerHTML = `
          <div class="dashboard-header">

            <div class="dashboard-actions">
              <div style="display:flex; align-items:center; gap:5px; background:#111; padding:2px 8px; border-radius:4px; border:1px solid #333;">

              </div>
              <button class="btn btn-danger ${dspState.out_mute[i]?'active':''}" id="btn-mute-out-${i}" onclick="toggleMute('out',${i})">${dspState.out_mute[i]?'MUTED':'MUTE'}</button>

                    ${createFader('DELAY', 'dl', i, '', 0, 200, dspState.dl[i], 'ms', '', '0.1')}
                </div>
              </div>
              <div class="widget">
                <div class="widget-header">CROSSOVER</div>
                <div class="widget-body">
                    ${createFader('OUT GAIN', 'xo', i, 'g', -12, 6, dspState.xo_gn[i], 'dB')}
                    ${createSelect('HPF TYPE', 'xo', i, 't', ['OFF', 'BW12', 'BW24', 'BW48', 'LR12', 'LR24', 'LR48'], dspState.xt[i])}
                    ${createFader('HPF FREQ', 'xo', i, 'fl', 20, 20000, dspState.xfl[i], 'Hz', '', '10')}
                    <div style="border-top:1px solid #333; margin:5px 0;"></div>
                    ${createSelect('LPF TYPE', 'xo', i, 'th', ['OFF', 'BW12', 'BW24', 'BW48', 'LR12', 'LR24', 'LR48'], dspState.xth[i])}
                    ${createFader('LPF FREQ', 'xo', i, 'fh', 20, 20000, dspState.xfh[i], 'Hz', '', '10')}
                </div>
              </div>
              <div class="widget">
                <div class="widget-header">COMPRESSOR</div>
                <div class="widget-body">
                    <div class="comp-layout">
                        <div class="graph-container" style="flex:1;"><canvas id="cvs-comp-out-${i}"></canvas></div>
                        <div class="gr-meter-box">
                            <span style="font-size:8px; font-weight:bold; color:#888;">GR</span>
                            <div class="gr-track"><div id="gr-fill-out-${i}" class="gr-fill"></div></div>
                        </div>
                    </div>
                    ${createFader('THRESH', 'comp', i, 'thr', -40, 1, dspState.ct[i], 'dB')}
                    <div class="ctrl-row">
                        ${createFader('RATIO', 'comp', i, 'rat', 1, 21, dspState.cr[i], ':1')}

                    </div>
                </div>
              </div>
            </div>
            
            <div class="strip-col">
              <div class="widget" id="wid-eq-${i}" class="${dspState.eqb[i]===1?'bypassed':''}">

                </div>
                <div class="widget-body">
                    <div class="graph-container graph-large"><canvas id="cvs-${i}"></canvas></div>
                    <div class="ctrl-row" style="overflow-x:auto;">${eqHtml}</div>

            </div>
          </div>
        `;
      });
    }
