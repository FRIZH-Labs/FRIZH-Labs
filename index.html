<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIZH Labs | DLMS24</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --cyan-accent: #22d3ee;
            --cyan-glow: rgba(34, 211, 238, 0.3);
            --orange-accent: #ff9800;
            --text-main: #f8fafc;
        }

        body {
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo { width: 76px; margin-bottom: 16px; filter: drop-shadow(0 0 8px var(--cyan-glow)); }
        
        h1 { font-size: 1.5rem; letter-spacing: 4px; margin: 0; color: var(--cyan-accent); text-transform: uppercase; }
        
        .status-badge {
            display: inline-block;
            background: rgba(34, 211, 238, 0.1);
            color: var(--cyan-accent);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.72rem;
            border: 1px solid var(--cyan-accent);
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.8px;
        }

        .selection-box { margin-top: 24px; text-align: left; }
        
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 24px 0 18px 0;
        }

        label { font-size: 0.78rem; color: #94a3b8; margin-bottom: 8px; display: block; margin-left: 4px; font-weight: 600; letter-spacing: 0.4px; }

        select {
            width: 100%;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.88rem;
            font-weight: 600;
        }

        select:focus { border-color: var(--cyan-accent); box-shadow: 0 0 0 2px var(--cyan-glow); }

        .webui-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .tier-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .tier-card:hover {
            border-color: var(--cyan-accent);
            background: rgba(34, 211, 238, 0.08);
            transform: translateY(-2px);
        }

        .tier-card.fir {
            border-color: rgba(255, 152, 0, 0.5);
        }
        .tier-card.fir:hover {
            border-color: var(--orange-accent);
            background: rgba(255, 152, 0, 0.12);
        }

        .tier-title {
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--cyan-accent);
        }

        .tier-card.fir .tier-title {
            color: var(--orange-accent);
        }

        .tier-sub {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 14px;
            transition: 0.25s;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .primary { background: var(--cyan-accent); color: #0f172a; }
        .primary:hover:not(:disabled) { background: #67e8f9; transform: translateY(-2px); }
        .primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        .footer { margin-top: 26px; font-size: 0.7rem; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <img src="logo.png" class="logo" alt="FRIZH" onerror="this.style.display='none'">
        <h1>FRIZH Labs</h1>
        <div class="status-badge">DLMS24 AUDIO PROCESSOR</div>

        <!-- ANDROID APK DOWNLOAD SECTION -->
        <div class="selection-box">
            <label>ANDROID APP (APK RELEASES)</label>
            <select id="apk-dropdown">
                <option>Connecting to GitHub...</option>
            </select>
            
            <button id="dl-button" class="btn primary" disabled onclick="startDownload()">
                Download Selected APK
            </button>
        </div>

        <div class="divider"></div>

        <!-- 3 WEB BLUETOOTH UI CONSOLE LAUNCHERS -->
        <div class="selection-box" style="margin-top: 0;">
            <label>LAUNCH WEB BLUETOOTH CONSOLE</label>
            <div class="webui-grid">
                <a href="web_basic.html" class="tier-card">
                    <span class="tier-title">BASIC</span>
                    <span class="tier-sub">Essential DSP</span>
                </a>
                <a href="web_std_iir.html" class="tier-card">
                    <span class="tier-title">STD IIR</span>
                    <span class="tier-sub">Full IIR Console</span>
                </a>
                <a href="web_std_fir.html" class="tier-card fir">
                    <span class="tier-title">✨ STD FIR</span>
                    <span class="tier-sub">256/512T Auto-FIR</span>
                </a>
            </div>
        </div>

        <div class="footer">
            Android App Requires Android 8.0+<br>
            Web Bluetooth UI Requires Chrome / Edge / Bluefy<br>
            © 2026 FRIZH Labs
        </div>
    </div>

    <script>
        const REPO = "FRIZH-Labs/FRIZH-Labs";
        
        async function loadFiles() {
            const dropdown = document.getElementById('apk-dropdown');
            const button = document.getElementById('dl-button');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/releases?t=${Date.now()}`);
                const releases = await response.json();
                
                dropdown.innerHTML = "";
                let hasFiles = false;

                releases.forEach(rel => {
                    rel.assets.forEach(asset => {
                        if (asset.name.toLowerCase().endsWith('.apk')) {
                            const opt = document.createElement('option');
                            opt.value = asset.browser_download_url;
                            opt.textContent = `${rel.tag_name} — ${asset.name}`;
                            dropdown.appendChild(opt);
                            hasFiles = true;
                        }
                    });
                });

                if (hasFiles) {
                    button.disabled = false;
                } else {
                    dropdown.innerHTML = "<option>No APKs found in public releases</option>";
                }

            } catch (e) {
                dropdown.innerHTML = "<option>Error loading files</option>";
                console.error(e);
            }
        }

        function startDownload() {
            const url = document.getElementById('apk-dropdown').value;
            if (url) window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
